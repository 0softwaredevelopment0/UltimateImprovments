# ============================================
# UI-Clans Configuration
# ============================================

clan:
  # Clan name length limits (plain text, MiniMessage tags are not counted)
  name_min_length: 2
  name_max_length: 32
  # How long a pending confirmation stays valid, in seconds
  confirm_timeout: 30
  # Cooldown between join requests, in seconds
  request_cooldown_seconds: 10
  # How long a join request stays valid, in seconds (1 hour = 3600)
  request_expire_seconds: 3600
  home:
    # Clan home mode: legit (only shows coordinates, no teleport) or standard (teleports)
    mode: legit
    # Teleport cooldown in seconds when mode is standard (0 = disabled)
    tp_cooldown_seconds: 0

  # Dependent clans
  dependent:
    # Master toggle for dependent clans
    enabled: true
    # How long a dependency invite stays valid (seconds, 24h = 86400)
    invite_expire_seconds: 86400
    # Cooldown between dep invites from the same main clan (seconds)
    invite_cooldown_seconds: 60
