# UI-Player — player features (armor/trim effects, vanish, ...).
#
# Active language follows messages.lang.
[vanish]
# Default: []
vanished_players = []

# Armor effects: configurable potion effects for worn armor sets (units).
# Per unit: duration_ticks = how long one application lasts (ticks),
# check_interval_ticks = how often the effect is re-applied (ticks, min 20).
# Default scheme (every unit is FULL-set): WEAK armor grants buffs —
#   leather = Speed I, copper = Haste I, chainmail = Jump Boost I,
#   golden = Regeneration I;
# STRONG armor pays with debuffs — iron = Hunger I, diamond = Slowness I,
# netherite = Slowness I + Weakness I.

[armor_effects]
# Master switch (true = feature on).
# Default: true
enabled = true

# units section.

[armor_effects.units]

# speed leather section.

[armor_effects.units.speed_leather]
# Material name (minecraft:...).
# Default: ["leather"]
materials = ["leather"]
# Default: "FULL"
rule = "FULL"
# Default: 1
count = 1
# Default: "speed"
effect = "speed"
# Default: 0
amplifier = 0
# How long ONE application of the effect lasts, in ticks.
# Default: 40
duration_ticks = 61
# How often the check re-applies the effect while the rule holds, in ticks.
# With duration_ticks >= check_interval_ticks the refresh lands before the
# previous application expires, so the effect never flickers.
# Do NOT set below 20: the check heartbeat runs once per second, so smaller
# values cannot check more often and only waste performance.
# Default: 40
check_interval_ticks = 40
# Default: false
particles = false
# Default: false
ambient = false
# Icon configuration.
# Default: true
icon = true

