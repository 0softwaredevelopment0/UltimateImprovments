# UI-World — world mechanics (wireless redstone, meteors, block friction, challenges).

# ==================================================================
# WORLD MECHANICS
# ==================================================================

# Wireless redstone transmitters/receivers.
[wireless_redstone]
# Enable wireless redstone transmitters/receivers.
# Default: true
enabled = true

# Falling meteors.
[meteor]
# Master switch (true = feature on).
# Default: true
enabled = true
# World name.
# Default: "world"
world = "world"
# Default: 1
count_per_spawn = 1
# Duration.
# Default: 60
fall_duration_ticks = 60
# Radius in blocks.
# Default: 2
sphere_radius = 2
# Power.
# Default: 8.0
explosion_power = 8.0
# Maximum value.
# Default: 10
max_active = 10
# Default: ["CRACKED_DEEPSLATE_BRICKS", "CRACKED_DEEPSLATE_TILES", "CHISELED_DEEPSLATE", "MAGMA_BLOCK"]
display_blocks = ["CRACKED_DEEPSLATE_BRICKS", "CRACKED_DEEPSLATE_TILES", "CHISELED_DEEPSLATE", "MAGMA_BLOCK"]
# Log the periodic scheduler lines to the console: "Next meteor in N minute(s)"
# and "No players online in '<world>', skipping." (every cycle).
# Default: false (silent)
log_scheduler = false

# interval section.
[meteor.interval]
# Minimum value.
# Default: 30
min = 30
# Maximum value.
# Default: 90
max = 90

# spawn radius section.
[meteor.spawn_radius]
# Minimum value.
# Default: 30
min = 30
# Maximum value.
# Default: 120
max = 120

# height section.
[meteor.height]
# Minimum value.
# Default: -64
min = -64
# Maximum value.
# Default: 320
max = 320

# core ores section.
[meteor.core_ores]
# Default: 1.0
DEEPSLATE_DIAMOND_ORE = 1.0
# Default: 1.0
DEEPSLATE_IRON_ORE = 1.0
# Default: 1.0
DEEPSLATE_GOLD_ORE = 1.0
# Default: 1.0
DEEPSLATE_EMERALD_ORE = 1.0
# Default: 1.0
DEEPSLATE_LAPIS_ORE = 1.0
# Default: 1.0
DEEPSLATE_REDSTONE_ORE = 1.0
# Default: 1.0
DEEPSLATE_COAL_ORE = 1.0
# Default: 1.0
DEEPSLATE_COPPER_ORE = 1.0

# Custom block friction behaviour.
[block_friction]
# Default: 0.989
BLUE_ICE = 0.989

# Infinitely growing sculk. Every sculk catalyst is pulsed by the plugin on a
# cooldown, which keeps the vanilla bloom alive: the catalyst converts blocks
# from the #minecraft:sculk_replaceable tag (stone, deepslate, dirt, gravel,
# sand, ...), grows veins and occasionally shriekers, forever. Ores, containers,
# tile entities and builds of other materials are untouched - that is vanilla.
[sculk]
# Master switch (true = every loaded catalyst keeps blooming).
# Default: true
enabled = true
# Pulse cooldown in ticks (20 = one second).
# Default: 20
interval_ticks = 20
# Charge added to the catalyst's vanilla spreader per pulse. This is the spread
# strength: higher = more blocks converted per pulse.
# Default: 10
charge_per_pulse = 10
# Upper bound of catalysts bloomed per pulse (round-robin). A TPS guard for
# worlds with hundreds of catalysts.
# Default: 32
max_catalysts_per_pulse = 32
# Skip a pulse while the average tick time is above this value (milliseconds).
# Default: 50.0
max_mspt = 50.0

# World filter. The whitelist and the blacklist are independent: each can be
# switched on or off, they can be active at the same time, and the blacklist
# wins (whitelist picks the allowed set, blacklist removes worlds from it).
# World names are case-insensitive and must match the server's world folders
# (e.g. "world", "world_nether", "world_the_end").
[sculk.worlds]
# Restrict growth to the whitelisted worlds only.
# Default: false
whitelist_enabled = false
# Worlds where sculk is allowed (used only when whitelist_enabled = true).
# Default: [] (empty whitelist + enabled = no growth anywhere)
whitelist = []
# Forbid growth in the blacklisted worlds (wins over the whitelist).
# Default: false
blacklist_enabled = false
# Worlds where sculk must NOT grow (used only when blacklist_enabled = true).
# Default: []
blacklist = []

# ---- MESSAGES ----

[messages.meteor]
# Default: <red>❌ Usage: </red><white>/ui meteor spawn [count]</white>
usage = "<red>❌ Usage: </red><white>/ui meteor spawn [count]</white>"
# Default: <red>❌ Unknown meteor subcommand: </red><white>%sub%</white>
unknown_sub = "<red>❌ Unknown meteor subcommand: </red><white>%sub%</white>"
# Permission node.
# Default: <red>❌ You don't have permission to spawn meteors!</red>
no_permission = "<red>❌ You don't have permission to spawn meteors!</red>"
# Default: <red>❌ Invalid count!</red>
invalid_count = "<red>❌ Invalid count!</red>"
# Default: <red>❌ Meteor module is disabled in config.yml!</red>
module_disabled = "<red>❌ Meteor module is disabled in config.yml!</red>"
# Default: <red>❌ Meteor module is not initialized!</red>
module_not_init = "<red>❌ Meteor module is not initialized!</red>"
# Default: <green>✔</green> <white>Spawned </white><yellow>%count%</yellow><white> meteor(s)!</white>
spawned = "<green>✔</green> <white>Spawned </white><yellow>%count%</yellow><white> meteor(s)!</white>"
