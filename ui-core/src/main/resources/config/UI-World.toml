# UI-World — world mechanics (wireless redstone, meteors, block friction, challenges).

# ==================================================================
# WORLD MECHANICS
# ==================================================================

# Wireless redstone transmitters/receivers.
[wireless_redstone]
# Enable wireless redstone transmitters/receivers.
# Default: true
enabled = true

# Falling meteors.
[meteor]
# Master switch (true = feature on).
# Default: true
enabled = true
# World name.
# Default: "world"
world = "world"
# Default: 1
count_per_spawn = 1
# Duration.
# Default: 60
fall_duration_ticks = 60
# Radius in blocks.
# Default: 2
sphere_radius = 2
# Power.
# Default: 8.0
explosion_power = 8.0
# Maximum value.
# Default: 10
max_active = 10
# Default: ["CRACKED_DEEPSLATE_BRICKS", "CRACKED_DEEPSLATE_TILES", "CHISELED_DEEPSLATE", "MAGMA_BLOCK"]
display_blocks = ["CRACKED_DEEPSLATE_BRICKS", "CRACKED_DEEPSLATE_TILES", "CHISELED_DEEPSLATE", "MAGMA_BLOCK"]
# Log the periodic scheduler lines to the console: "Next meteor in N minute(s)"
# and "No players online in '<world>', skipping." (every cycle).
# Default: false (silent)
log_scheduler = false

# interval section.
[meteor.interval]
# Minimum value.
# Default: 30
min = 30
# Maximum value.
# Default: 90
max = 90

# spawn radius section.
[meteor.spawn_radius]
# Minimum value.
# Default: 30
min = 30
# Maximum value.
# Default: 120
max = 120

# height section.
[meteor.height]
# Minimum value.
# Default: -64
min = -64
# Maximum value.
# Default: 320
max = 320

# core ores section.
[meteor.core_ores]
# Default: 1.0
DEEPSLATE_DIAMOND_ORE = 1.0
# Default: 1.0
DEEPSLATE_IRON_ORE = 1.0
# Default: 1.0
DEEPSLATE_GOLD_ORE = 1.0
# Default: 1.0
DEEPSLATE_EMERALD_ORE = 1.0
# Default: 1.0
DEEPSLATE_LAPIS_ORE = 1.0
# Default: 1.0
DEEPSLATE_REDSTONE_ORE = 1.0
# Default: 1.0
DEEPSLATE_COAL_ORE = 1.0
# Default: 1.0
DEEPSLATE_COPPER_ORE = 1.0

# Custom block friction behaviour.
[block_friction]
# Default: 0.989
BLUE_ICE = 0.989

# Infinitely growing sculk. Every sculk catalyst is pulsed by the plugin on a
# cooldown, which keeps the vanilla bloom alive: the catalyst converts blocks
# from the #minecraft:sculk_replaceable tag (stone, deepslate, dirt, gravel,
# sand, ...), grows veins and occasionally shriekers, forever. Ores, containers,
# tile entities and builds of other materials are untouched - that is vanilla.
[sculk]
# Master switch (true = every loaded catalyst keeps blooming).
# Default: true
enabled = true
# Pulse cooldown in ticks (20 = one second).
# Default: 20
interval_ticks = 20
# Charge added to the catalyst's vanilla spreader per pulse. This is the spread
# strength: higher = more blocks converted per pulse.
# Default: 10
charge_per_pulse = 10
# Upper bound of catalysts bloomed per pulse (round-robin). A TPS guard for
# worlds with hundreds of catalysts.
# Default: 32
max_catalysts_per_pulse = 32
# Skip a pulse while the average tick time is above this value (milliseconds).
# Default: 50.0
max_mspt = 50.0
# Each pulse starts the bloom from one RANDOM block out of the six faces of the
# catalyst. Solid neighbours simply waste that pulse (vanilla cannot start a
# bloom inside a solid block), so a walled-in catalyst never spreads; a
# catalyst with at least one air/water face above a replaceable surface starts
# growing within a few pulses.

# World filter. The whitelist and the blacklist are independent: each can be
# switched on or off, they can be active at the same time, and the blacklist
# wins (whitelist picks the allowed set, blacklist removes worlds from it).
# World names are case-insensitive and must match the server's world folders
# (e.g. "world", "world_nether", "world_the_end").
[sculk.worlds]
# Restrict growth to the whitelisted worlds only.
# Default: false
whitelist_enabled = false
# Worlds where sculk is allowed (used only when whitelist_enabled = true).
# Default: [] (empty whitelist + enabled = no growth anywhere)
whitelist = []
# Forbid growth in the blacklisted worlds (wins over the whitelist).
# Default: false
blacklist_enabled = false
# Worlds where sculk must NOT grow (used only when blacklist_enabled = true).
# Default: []
blacklist = []

# Contact hazards. The growth module turns the world into sculk; this section
# makes standing on the result hurt. Every interval_ticks the plugin inspects
# the block the player occupies (or the block right under the feet - see each
# rule's "offset") and applies the matching debuff. Nothing is event-driven: the
# effect is refreshed for as long as the player stays there and expires on its
# own (duration_ticks) after stepping off. The hazards are independent of
# /ui sculk start|stop - stopping the spread does not disarm the blocks that
# already exist.
[sculk.hazards]
# Master switch for all contact hazards.
# Default: true
enabled = true
# How often the hazard pulse runs, in ticks (20 = one second).
# Default: 20
interval_ticks = 20
# Skip creative players - the blocks cannot hurt them anyway.
# Default: true
ignore_creative = true
# Skip spectators - they can fly through the sculk.
# Default: true
ignore_spectator = true
# When true, hazards only fire in the worlds allowed by [sculk.worlds]
# (whitelist/blacklist of the growth module). false = hazards work everywhere.
# Default: false
use_growth_world_filter = false
# Permission that makes a player immune to every hazard. Empty string = no
# bypass permission. The node is also registered in the permission registry.
# Immunity requires an EXPLICIT grant of this exact node: wildcards such as
# "*" or "ui.*" (the usual admin setup) do NOT count, so an OP testing the
# mechanic still gets hurt.
# Default: "ui.sculk.hazards.bypass"
bypass_permission = "ui.sculk.hazards.bypass"

# Per-rule keys shared by all tables below:
#   enabled              - switch of this single rule (default true)
#   blocks               - block materials that trigger the rule (a list)
#   offset               - which block is inspected, counted from the block the
#                          player's feet are in: 0 = the feet block itself,
#                          -1 = the block the player stands on (one below).
#   radius               - proximity radius in blocks: 0 (default) = only the
#                          block selected by offset (pure contact); 1-4 = also
#                          react to a matching block inside a cube of that size
#                          around the player, nearest block first. Use 1-2 if the
#                          sculk should hurt when merely walking next to it. A
#                          rule with radius > 0 ignores offset. Cost: every pulse
#                          scans (2*radius+1)^3 blocks per player per rule.
#   effect / duration_ticks / amplifier
#                        - potion effect name (registry key, e.g. "wither"),
#                          its duration in ticks and its amplifier (0 = level I,
#                          254 = level 255). Keep duration_ticks >= interval_ticks
#                          so the debuff never lapses while the player stays on
#                          the block; a value of duration_ticks = interval_ticks
#                          may show a one-tick gap in the HUD.
#                          Wither, poison and regeneration only apply their
#                          effect when the REMAINING duration is a multiple of
#                          40/25/50 >> amplifier, so a one-second wither (20t)
#                          shows the icon but deals no damage. The module lifts
#                          too-short durations to one such interval (wither I =
#                          40t = 2 s) and logs it.
#   particles / ambient / icon
#                        - potion effect rendering flags.
#   fangs                - true = summon evoker fangs at the block instead of a
#                          potion effect (the fangs then use fangs_count and
#                          fangs_attack_delay_ticks; effect keys are ignored).

# Sculk vein: the vein has no collision, so the player literally stands in its
# block -> offset 0, wither I for two seconds.
[sculk.hazards.vein]
# Default: true
enabled = true
# Default: ["SCULK_VEIN"]
blocks = ["SCULK_VEIN"]
# Default: 0
offset = 0
# Proximity radius in blocks (0 = contact only, 1-4 = aura around the player).
# Default: 0
radius = 0
# Default: "WITHER"
effect = "WITHER"
# Two seconds: wither I only damages when the remaining duration is a multiple
# of 40 ticks, so a one-second wither is purely cosmetic.
# Default: 40
duration_ticks = 40
# Default: 0 (level I)
amplifier = 0
# Default: true
particles = true
# Default: false
ambient = false
# Default: true
icon = true

# Sculk block: a full block, so a player standing on it occupies the block one
# level above it -> offset -1, wither I for two seconds.
[sculk.hazards.block]
# Default: true
enabled = true
# Default: ["SCULK"]
blocks = ["SCULK"]
# Default: -1
offset = -1
# Proximity radius in blocks (0 = contact only, 1-4 = aura around the player).
# Default: 0
radius = 0
# Default: "WITHER"
effect = "WITHER"
# Two seconds: see the note on [sculk.hazards.vein].
# Default: 40
duration_ticks = 40
# Default: 0 (level I)
amplifier = 0
# Default: true
particles = true
# Default: false
ambient = false
# Default: true
icon = true

# Sculk shrieker: only half a block tall, so the player's feet are inside its
# block -> offset 0. Instead of a potion effect the rule summons evoker fangs at
# the centre of the shrieker's block; the fangs have no owner, so they damage
# the player standing on them (and any mob in the hitbox).
[sculk.hazards.shrieker]
# Default: true
enabled = true
# Default: ["SCULK_SHRIEKER"]
blocks = ["SCULK_SHRIEKER"]
# Default: 0
offset = 0
# Proximity radius in blocks (0 = contact only, 1-4 = aura around the player).
# Default: 0
radius = 0
# Summon evoker fangs instead of a potion effect.
# Default: true
fangs = true
# How many fangs to summon per pulse.
# Default: 1
fangs_count = 1
# Delay in ticks before the fangs attack (Paper requires >= 1; 1 = instant).
# Default: 1
fangs_attack_delay_ticks = 1

# Sculk sensor (and the calibrated variant): half a block tall, so the player's
# feet are inside its block -> offset 0, slowness 255 for one second.
[sculk.hazards.sensor]
# Default: true
enabled = true
# Default: ["SCULK_SENSOR", "CALIBRATED_SCULK_SENSOR"]
blocks = ["SCULK_SENSOR", "CALIBRATED_SCULK_SENSOR"]
# Default: 0
offset = 0
# Proximity radius in blocks (0 = contact only, 1-4 = aura around the player).
# Default: 0
radius = 0
# Default: "SLOWNESS"
effect = "SLOWNESS"
# Default: 20
duration_ticks = 20
# Default: 254 (level 255)
amplifier = 254
# Default: true
particles = true
# Default: false
ambient = false
# Default: true
icon = true

# Sculk catalyst: a full block, so a player standing on it occupies the block
# one level above it -> offset -1, mining fatigue 255 for one second.
[sculk.hazards.catalyst]
# Default: true
enabled = true
# Default: ["SCULK_CATALYST"]
blocks = ["SCULK_CATALYST"]
# Default: -1
offset = -1
# Proximity radius in blocks (0 = contact only, 1-4 = aura around the player).
# Default: 0
radius = 0
# Default: "MINING_FATIGUE"
effect = "MINING_FATIGUE"
# Default: 20
duration_ticks = 20
# Default: 254 (level 255)
amplifier = 254
# Default: true
particles = true
# Default: false
ambient = false
# Default: true
icon = true

# ---- MESSAGES ----

[messages.meteor]
# Default: <red>❌ Usage: </red><white>/ui meteor spawn [count]</white>
usage = "<red>❌ Usage: </red><white>/ui meteor spawn [count]</white>"
# Default: <red>❌ Unknown meteor subcommand: </red><white>%sub%</white>
unknown_sub = "<red>❌ Unknown meteor subcommand: </red><white>%sub%</white>"
# Permission node.
# Default: <red>❌ You don't have permission to spawn meteors!</red>
no_permission = "<red>❌ You don't have permission to spawn meteors!</red>"
# Default: <red>❌ Invalid count!</red>
invalid_count = "<red>❌ Invalid count!</red>"
# Default: <red>❌ Meteor module is disabled in config.yml!</red>
module_disabled = "<red>❌ Meteor module is disabled in config.yml!</red>"
# Default: <red>❌ Meteor module is not initialized!</red>
module_not_init = "<red>❌ Meteor module is not initialized!</red>"
# Default: <green>✔</green> <white>Spawned </white><yellow>%count%</yellow><white> meteor(s)!</white>
spawned = "<green>✔</green> <white>Spawned </white><yellow>%count%</yellow><white> meteor(s)!</white>"
