# UltimateImprovments — UI-Energy configuration.
# This single file holds the addon's settings AND its messages (RU + EN).
# Language: the global switch is messages.lang in UI-Core.toml ("en" or "ru").
# Every value can be edited; the file is re-read by /ui reload.
# Missing keys are auto-repaired from the bundled defaults on startup.

# ==================================================================
# SETTINGS
# ==================================================================


# Energy system: production, transfer limits and per-machine behaviour.
[energy]

# generator section.
[energy.generator]
# Master switch (true = feature on).
# Default: true
enabled = true
# Energy amount.
# Default: 100
energy_per_fuel = 100
# Default: 100
fuel_burn_ticks = 100
# Leftover buffer of one generator: when no battery in the network takes
# the produced energy, it waits here until a consumer pulls it (a direct
# generator → wires → consumer setup works without a battery).
# Default: 2000
buffer_capacity = 2000
# Default: false
log = false

# electric furnace section.
[energy.electric_furnace]
# Master switch (true = feature on).
# Default: true
enabled = true
# Energy amount.
# Default: 100
energy_per_smelt = 100
# Cooldown.
# Default: 1000
cooldown_ms = 1000

# cable section — cables are pure routers, they don't store energy.
[energy.cable.blink]
# Master switch (true = blink while energy flows).
# Default: true
enabled = true
# Off-phase length in REAL ticks (a 5-tick visual pass reads them).
# Default: 10
off_ticks = 10
# On-phase length in REAL ticks.
# Default: 10
on_ticks = 10

# battery section.
[energy.battery]
# Capacity of ONE battery block; cluster capacity = blocks × this value.
# Default: 100000
max_energy = 100000

# balancer section — equalizes the charge of batteries in one network.
[energy.balancer]
# Master switch (true = feature on).
# Default: true
enabled = true
# Maximum transfer per battery per balancing pass (the task runs every 2s).
# Default: 25
max_transfer = 25
# Default: false
log = false

# Energy cost of the crafting-related energy features.
[energy_crafting]
# Master switch (true = feature on).
# Default: true
enabled = true
# Energy amount.
# Default: 100
energy_per_craft = 100
# Radius in blocks.
# Default: 3
workbench_search_radius = 3
