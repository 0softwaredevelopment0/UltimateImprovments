# UltimateImprovments — UI-Anticheat configuration.
# This single file holds the addon's settings AND its messages (RU + EN).
# Language: the global switch is messages.lang in UI-Core.toml ("en" or "ru").
# Every value can be edited; the file is re-read by /ui reload.
# Missing keys are auto-repaired from the bundled defaults on startup.

# ==================================================================
# SETTINGS
# ==================================================================


# Anti-cheat: detection modules, thresholds and punishments.
[anticheat]
# Master switch (true = feature on).
# Default: true
enabled = true
# Permission node.
# Default: "ui.anticheat.bypass"
bypass_permission = "ui.anticheat.bypass"
# Cooldown.
# Default: 100
action_cooldown_ms = 100

# actions section.
[anticheat.actions]

# log section.
[anticheat.actions.log]
# Master switch (true = feature on).
# Default: true
enabled = true

# notify section.
[anticheat.actions.notify]
# Default: 1.0
vl_threshold = 1.0

# setback section.
[anticheat.actions.setback]
# Default: 1.0
vl_threshold = 1.0

# packet section.
[anticheat.packet]
