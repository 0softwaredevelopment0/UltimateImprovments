# Player added instantly, removed automatically after the delay.
# Default: ["<green>✔</green> <white>Player</white> <yellow>%player%</yellow> <white>added to the</white> <yellow>%list%</yellow> <white>for</white> <yellow>%duration%</yellow>"]
