# UltimateImprovments — UI-Core configuration.
# This single file holds the addon's settings AND its messages (RU + EN).
# Language: the global switch is messages.lang in UI-Core.toml ("en" or "ru").
# Every value can be edited; the file is re-read by /ui reload.
# Missing keys are auto-repaired from the bundled defaults on startup.

# ==================================================================
# SETTINGS
# ==================================================================

# Prefix string (MiniMessage).
# Default: "<dark_gray>[<green>UI<dark_gray>] <reset>"
prefix = "<dark_gray>[<green>UI<dark_gray>] <reset>"
# Internal marker, do not edit.
# Default: "1.8.3-beta.6"
plugin_version = "1.8.3-beta.6"

# Master switch for the /ui config commands (e.g. /ui config regen).
# Disabled by default so a stray permission grant cannot wipe config edits.
[config]
# Default: false
commands_enabled = false

# API version compatibility check: warns in the console when the running server's
# API version is older than the minimum required by the plugin. The check reads the
# ACTUAL runtime server version (not the api-version from plugin.yml), so editing
# the plugin's own api-version cannot bypass it.
[version_check]
# Master switch (true = feature on).
# Default: true
enabled = true
# Minimum required server API version ("major.minor" or "major.minor.patch").
# Default: "26.3"
min_api_version = "26.3"


# join invulnerable reset section.
[join_invulnerable_reset]
# Master switch (true = feature on).
# Default: false
enabled = false
# Default: "join"
mode = "join"
# Interval in ticks (20 ticks = 1 second).
# Default: 2000
interval_ticks = 2000
# Default: true
notify_console = true

# One-shot "UltimateImprovments loaded successfully!" chat alert: after a
# server start, every alerts holder (ui.alerts / OP) receives it ONCE per
# server session — the first time they are present after startup (already
# online at enable, or on their first join). Later joins stay silent;
# resets on server restart.
[loaded_alert]
# Master switch (true = feature on).
# Default: true
enabled = true

# Reputation auto-penalties (staff-issued numeric scale).
[reputation]
# Rep penalty for a CONFIRMED report verdict (0 disables).
# Default: -5
report_confirmed = -5
# Rep penalty per warning (0 disables).
# Default: -1
punish_warn = -1
# Rep penalty per mute (0 disables).
# Default: -3
punish_mute = -3
# Rep penalty per ban (0 disables).
# Default: -10
punish_ban = -10

# ==================================================================
# GLOBAL LANGUAGE
# ==================================================================

# Active UI language: "en" or "ru".
# Default: "en"
[messages]
lang = "en"

