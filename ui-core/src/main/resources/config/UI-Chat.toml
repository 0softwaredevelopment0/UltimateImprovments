# access control section.
[chat.access_control]
# Master switch (true = feature on).
# Default: false
enabled = false

# units section.
[chat.access_control.units]

# 1 section.
[chat.access_control.units."1"]
# Master switch (true = feature on).
# Default: true
enabled = true
# Default: "blacklist"
mode = "blacklist"
# Default: []
