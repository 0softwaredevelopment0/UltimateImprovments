# units section.
[chat.channels.terminal.access_control.units]

# 1 section.
[chat.channels.terminal.access_control.units."1"]
# Master switch (true = feature on).
# Default: true
enabled = true
# Default: "blacklist"
mode = "blacklist"
# Default: []
regexes = []
# Default: "all"
condition = "all"

# wildcards section.
[chat.channels.terminal.access_control.units."1".wildcards]
# Default: "*rm -rf /*"
