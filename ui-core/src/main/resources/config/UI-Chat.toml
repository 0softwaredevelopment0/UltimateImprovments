# UltimateImprovments — UI-Chat configuration.
# This single file holds the addon's settings AND its messages (RU + EN).
# Language: the global switch is messages.lang in UI-Core.toml ("en" or "ru").
# Every value can be edited; the file is re-read by /ui reload.
# Missing keys are auto-repaired from the bundled defaults on startup.

# ==================================================================
# SETTINGS
# ==================================================================


# Sound ping when someone mentions your name in chat.
[chat_ping]
# Master switch: play a sound when your name is mentioned.
# Default: true
enabled = true
# Default: "<underlined><color:#FFAA00>@%s</color></underlined>"
ping_style = "<underlined><color:#FFAA00>@%s</color></underlined>"
# Sound name (minecraft:...).
# Default: "ENTITY_EXPERIENCE_ORB_PICKUP"
sound_name = "ENTITY_EXPERIENCE_ORB_PICKUP"
# Sound name (minecraft:...).
# Default: 0.5
sound_volume = 0.5
# Sound name (minecraft:...).
# Default: 1.5
sound_pitch = 1.5

# Chat word filter (regex-based blocking).
[chat_filter]
# Master switch (true = feature on).
# Default: false
enabled = false
# Default: ["*блять*", "*блят*", "*хуй*", "*пизда*", "*еба*", "*пидр*", "*таврь*", "*нахуй*", "*нахер*", "*нах"]
words = ["*блять*", "*блят*", "*хуй*", "*пизда*", "*еба*", "*пидр*", "*таврь*", "*нахуй*", "*нахер*", "*нах"]
# Default: [".*(?<!\\p{L})(?:бля(?:дь|ть|т)|бляд(?:ь|и|ина)|еб(?:ать|ан|лан|уч)|хуй|хуйня|пизд(?:а|ец|еть)|муд(?:ак|ила)|гандон)(?!\\p{L}).*\n", ".*(?<!\\p{L})(?:долбо(?:еб|ёб)|идиот|дебил|кретин|имбецил|придурок)(?!\\p{L}).*\n", ".*п[^а-яёa-z0-9]{0,3}и[^а-яёa-z0-9]{0,3}д[^а-яёa-z0-9]{0,3}(?:а|о)?[^а-яёa-z0-9]{0,3}р.*\n", ".*х[^а-яёa-z0-9]{0,3}у[^а-яёa-z0-9]{0,3}й.*\n", ".*[А-ЯЁA-Z]{15,}.*\n", ".*(.)\\1{8,}.*\n", ".*ж[^а-яёa-z0-9]{0,3}[иi1і][^а-яёa-z0-9]{0,3}р(?:н(?:ы(?:й|е|х|м)?|ая|ое)?|уха|ок|дяй)? .*\n"]
regex_patterns = [".*(?<!\\p{L})(?:бля(?:дь|ть|т)|бляд(?:ь|и|ина)|еб(?:ать|ан|лан|уч)|хуй|хуйня|пизд(?:а|ец|еть)|муд(?:ак|ила)|гандон)(?!\\p{L}).*\n", ".*(?<!\\p{L})(?:долбо(?:еб|ёб)|идиот|дебил|кретин|имбецил|придурок)(?!\\p{L}).*\n", ".*п[^а-яёa-z0-9]{0,3}и[^а-яёa-z0-9]{0,3}д[^а-яёa-z0-9]{0,3}(?:а|о)?[^а-яёa-z0-9]{0,3}р.*\n", ".*х[^а-яёa-z0-9]{0,3}у[^а-яёa-z0-9]{0,3}й.*\n", ".*[А-ЯЁA-Z]{15,}.*\n", ".*(.)\\1{8,}.*\n", ".*ж[^а-яёa-z0-9]{0,3}[иi1і][^а-яёa-z0-9]{0,3}р(?:н(?:ы(?:й|е|х|м)?|ая|ое)?|уха|ок|дяй)? .*\n"]

# Chat formatting: formats, channels, colors, cooldowns, links.
[chat]
# Master switch (true = feature on).
# Default: true
enabled = true
# Default: "channels"
mode = "channels"
# Format string (MiniMessage).
# Default: "<#32c800>ᴄᴜᴄᴇ <dark_gray>» <reset>%luckperms_prefix%<white>%player_name%<gray>: <white>%mes…"
format = "<#32c800>ᴄᴜᴄᴇ <dark_gray>» <reset>%luckperms_prefix%<white>%player_name%<gray>: <white>%message%"
# Minimum value.
# Default: true
player_minimessage = true
# Message text (MiniMessage).
# Default: true
message_placeholders = true
# Permission node.
# Default: ""
bypass_permission = ""

# Chat abuse limits. Applied to every player message, even when the custom
# chat is disabled (chat.enabled = false) — these are protections, not
# formatting. Console/terminal channels run trusted staff commands and are
# NOT limited.
[chat.limits]
# Master switch (true = feature on).
# Default: true
enabled = true
# Max rendered lines of ONE message
# (each line is rendered through the full chat format).
# Default: 3
max_lines = 3
# Max characters in ONE message, counted across all lines ("…" included).
# Default: 512
max_chars = 512
# Max share of CAPITAL letters among the letters of the message, %.
# The share is checked whatever the message length; only messages with at
# most caps_ignore_max_chars characters skip the check.
# 0 disables the check, 100 allows everything.
# Default: 50
max_caps_percent = 50
# Messages of at most this many characters skip the CAPS check.
# Keeps short shouts like "OK", "LOL", "GO" allowed.
# Default: 8
caps_ignore_max_chars = 8
# Max share of "random characters" (machine-made soup), %.
# Measured as the share of message characters inside random-looking tokens:
# near-maximal per-character entropy PLUS a machine-made structure
# (a run of 7+ consonants, letters and digits interleaved, or no vowels).
# URLs are ignored, and a digit group at the edge of a nick (Steve123)
# does not count as interleaving. 0 disables the check, 100 allows everything.
# Default: 50
max_entropy_percent = 50
# Minimum interval between two messages of ONE player, milliseconds.
# A message sent earlier is rejected with a (throttled) notice.
# 0 disables the cooldown.
# Default: 1000
cooldown_ms = 1000
# Duplicate guard: window in milliseconds. A message that repeats the last
# ACCEPTED message inside this window is dropped. The reference is the last
# accepted message, so rejected attempts cannot shift it. 0 disables.
# Default: 2000
duplicate_window_ms = 2000
# Minimum similarity (%) to the last accepted message that counts as a
# duplicate: 95 = one changed character in 20 is already "the same",
# 100 = exact match (after trimming, collapsing spaces and case-folding).
# 0 disables the check.
# Default: 95
duplicate_percent = 95
# Block messages that contain Cyrillic letters (for non-Cyrillic servers).
# Default: false
block_cyrillic = false
# Block messages that contain ANY non-ASCII character (code point above
# U+007F: Cyrillic, emoji, exotic symbols, invisible spaces). Stricter than
# block_cyrillic - for ASCII-only servers.
# Default: false
block_unicode = false
# Permission that skips all the limits above.
# Default: "ui.chat.limits.bypass"
bypass_permission = "ui.chat.limits.bypass"

# channels section.
[chat.channels]

# local section.
[chat.channels.local]
# Radius in blocks.
# Default: 100
radius = 100
# Format string (MiniMessage).
# Default: "<#32c800>ᴄʜᴀᴛ <dark_gray>»<dark_gray> [<white>L<dark_gray>] <reset>%luckperms_prefix%<white…"
format = "<#32c800>ᴄʜᴀᴛ <dark_gray>»<dark_gray> [<white>L<dark_gray>] <reset>%luckperms_prefix%<white>%player_name%<gray>: <white>%message%"

# global section.
[chat.channels.global]
# Format string (MiniMessage).
# Default: "<#32c800>ᴄʜᴀᴛ <dark_gray>»<dark_gray> [<white>G<dark_gray>] <reset>%luckperms_prefix%<white…"
format = "<#32c800>ᴄʜᴀᴛ <dark_gray>»<dark_gray> [<white>G<dark_gray>] <reset>%luckperms_prefix%<white>%player_name%<gray>: <white>%message%"

# world section.
[chat.channels.world]
# Format string (MiniMessage).
# Default: "<#32c800>ᴄʜᴀᴛ <dark_gray>»<dark_gray> [<white>W<dark_gray>] <reset>%luckperms_prefix%<white…"
format = "<#32c800>ᴄʜᴀᴛ <dark_gray>»<dark_gray> [<white>W<dark_gray>] <reset>%luckperms_prefix%<white>%player_name%<gray>: <white>%message%"

# private section.
[chat.channels.private]
# Format string (MiniMessage).
# Default: "<#32c800>ᴄʜᴀᴛ <dark_gray>»<dark_gray> [<white>P<dark_gray>] <reset>%luckperms_prefix%<white…"
format = "<#32c800>ᴄʜᴀᴛ <dark_gray>»<dark_gray> [<white>P<dark_gray>] <reset>%luckperms_prefix%<white>%player_name%<gray>: <white>%message%"

# admin section.
[chat.channels.admin]
# Format string (MiniMessage).
# Default: "<#32c800>ᴄʜᴀᴛ <dark_gray>»<dark_gray> [<white>A<dark_gray>] <reset>%luckperms_prefix%<white…"
format = "<#32c800>ᴄʜᴀᴛ <dark_gray>»<dark_gray> [<white>A<dark_gray>] <reset>%luckperms_prefix%<white>%player_name%<gray>: <white>%message%"

# check section.
[chat.channels.check]
# Format string (MiniMessage).
# Default: "<#32c800>ᴄʜᴀᴛ <dark_gray>»<dark_gray> [<red>C<dark_gray>] <reset>%luckperms_prefix%<white>%…"
format = "<#32c800>ᴄʜᴀᴛ <dark_gray>»<dark_gray> [<red>C<dark_gray>] <reset>%luckperms_prefix%<white>%player_name%<gray>: <white>%message%"

# console section.
[chat.channels.console]
# Master switch (true = feature on).
# Default: true
enabled = true
# Whitelist.
# Default: []
whitelist = []

# access control section.
[chat.channels.console.access_control]
# Master switch (true = feature on).
# Default: true
enabled = true

# units section.
[chat.channels.console.access_control.units]

# 1 section.
[chat.channels.console.access_control.units."1"]
# Master switch (true = feature on).
# Default: true
enabled = true
# Default: "blacklist"
mode = "blacklist"
# Default: []
regexes = []
# Default: "all"
condition = "all"

# wildcards section.
[chat.channels.console.access_control.units."1".wildcards]
# Default: "*rm -rf /*"
1 = "*rm -rf /*"

# custom deny msg section.
[chat.channels.console.access_control.units."1".custom_deny_msg]
# Master switch (true = feature on).
# Default: false
enabled = false
# Message text (MiniMessage).
# Default: "<red>This is blocked by the server.</red>"
message = "<red>This is blocked by the server.</red>"

# terminal section.
