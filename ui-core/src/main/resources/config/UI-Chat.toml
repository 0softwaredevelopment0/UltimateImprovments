# Automatic broadcast messages shown on a timer.
[auto_broadcast]
# Master switch (true = feature on).
# Default: true
enabled = true

# sections section.
[auto_broadcast.sections]

# example section.
[auto_broadcast.sections.example]
# Master switch (true = feature on).
# Default: true
enabled = true
# Cooldown.
# Default: 2400
cooldown_ticks = 2400
# Default: "is-op=false, is-gamemode=survival, online-above=1"
conditions = "is-op=false, is-gamemode=survival, online-above=1"
# Message text (MiniMessage).
# Default: ["<gold>✦ <white>Добро пожаловать на <yellow>%server_name%</yellow>! Онлайн: <aqua>%online%</aqua></white></gold>", "<green>☀ <white>Не забудь заглянуть в <yellow>/ui help</yellow> — там много полезного!</white></green>"]
messages = ["<gold>✦ <white>Добро пожаловать на <yellow>%server_name%</yellow>! Онлайн: <aqua>%online%</aqua></white></gold>", "<green>☀ <white>Не забудь заглянуть в <yellow>/ui help</yellow> — там много полезного!</white></green>"]

# OJM (chat/join message) module settings.
[ojm]
# Master switch (true = feature on).
# Default: false
enabled = false
# Default: "<white>[<green>+<white>] <player> <green>joined the game"
join = "<white>[<green>+<white>] <player> <green>joined the game"
# Default: "<white>[<red>-<white>] <player> <red>left the game"
leave = "<white>[<red>-<white>] <player> <red>left the game"

