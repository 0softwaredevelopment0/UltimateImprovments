# chat filter section.
# Placeholders: %message%, %source%
[messages.chat_filter]
# Message text (MiniMessage).
# Default: <dark_red>❌</dark_red> <red>Your message was flagged for prohibited content!</red>
message = "<dark_red>❌</dark_red> <red>Your message was flagged for prohibited content!</red>"
