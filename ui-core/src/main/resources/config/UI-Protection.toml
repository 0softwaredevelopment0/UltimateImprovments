# UI-Protection — block protection + void protection.
#
# Settings under [protection.*] / [void_protection.*]; messages under
# [messages.protection.*] (RU) and [messages_en.protection.*] (EN).
# Active language follows messages.lang.

[void_protection]
# Master switch (true = feature on).
enabled = true
# Worlds where void damage is intercepted.
worlds = ["pocketworld"]

[void_protection.target]
# Teleport destination.
world = "pocketworld"
x = 0
y = 1
z = 0
yaw = 0.0
pitch = 0.0

[protection]
# Master switch. false = the whole block protection system is not registered.
enabled = true

[protection.block]
# Material used as the physical protection block (minecraft:...).
material = "LODESTONE"

[protection.radius]
# Starting radius of a freshly placed block, in blocks.
default = 5
# Minimum radius.
min = 1
# Maximum radius purchasable with points.
max = 64

[protection.integrity]
# Starting integrity in percent (0..100).
starting_value = 100.0
# Integrity lost per refused action (break / place / interact / piston / area enchant block).
loss_per_break_attempt = 0.1
# Integrity lost per block an explosion tried to destroy.
loss_per_explosion_block = 0.1

[protection.points]
# Points per furnace burn tick of the fuel item.
fuel_multiplier = 0.1
# Cost of the first radius upgrade; doubles after every purchase.
radius_upgrade_base_cost = 1
# Cost of the first integrity repair; doubles after every purchase.
repair_base_cost = 1

[protection.crafting]
# Whether the recipe can be crafted in a regular workbench.
workbench_allowed = false
# Whether the recipe can be crafted in a Crafter (1.21+).
crafter_allowed = true

[protection.admin]
# Whether /ui protection give is allowed.
give_allowed = true

[protection.interact]
# Container blocks whose RMB is cancelled inside a protected zone.
# Empty list = built-in default (chests, barrels, shulkers, furnaces, hoppers,
# droppers, dispensers, brewing stands, crafters, decorated pots, chiseled
# bookshelves, lecterns, jukeboxes, vaults). Doors, buttons, levers and
# crafting tables are NEVER blocked unless listed here.
blocked_materials = []

[protection.pistons]
# Forbid pistons from moving blocks INTO or OUT of a protected zone
# (and from moving the protection block itself).
enabled = true

