# UI-Protection — block protection + void protection.
#
# Settings under [protection.*]/[void_protection.*]; messages under
# [messages.protection.*]. Active language follows messages.lang.
[void_protection]
# Master switch (true = feature on).
# Default: true
enabled = true
# World name.
# Default: ["pocketworld"]
worlds = ["pocketworld"]

# target section.

[void_protection.target]
# World name.
# Default: "pocketworld"
world = "pocketworld"
# Default: 0
x = 0
# Default: 1
y = 1
# Default: 0
z = 0
# Default: 0.0
yaw = 0.0
# Default: 0.0
pitch = 0.0

# Logs recent deaths so admins can inspect them.

[protection]
# Master switch (true = feature on).
# Default: true
enabled = true

# block section.

[protection.block]
# Material name (minecraft:...).
# Default: "LODESTONE"
material = "LODESTONE"

# radius section.

[protection.radius]
# Default: 5
default = 5
# Minimum value.
# Default: 1
min = 1
# Maximum value.
# Default: 64
max = 64

# integrity section.

[protection.integrity]
# Default: 100.0
starting_value = 100.0
# Default: 0.1
loss_per_break_attempt = 0.1
# Default: 0.1
loss_per_explosion_block = 0.1

# points section.

[protection.points]
# Default: 0.1
fuel_multiplier = 0.1
# Radius in blocks.
# Default: 1
radius_upgrade_base_cost = 1
# Cost.
# Default: 1
repair_base_cost = 1

# crafting section.

[protection.crafting]
# Default: false
workbench_allowed = false
# Default: true
crafter_allowed = true

# admin section.

[protection.admin]
# Default: true
give_allowed = true

# ==================================================================
# MESSAGES — RUSSIAN (active when lang = "ru")
# ==================================================================


