# UI-Admin — economy, op management, updater.
#
# Active language follows messages.lang.
[economy]
# Master switch (true = feature on).
# Default: true
enabled = true
# Default: 100.0
default_balance = 100.0
# Default: "coins"
primary_currency = "coins"

# income section.

[economy.income]
# Master switch (true = feature on).
# Default: false
enabled = false

# blocks section.

[economy.income.blocks]

# mobs section.

[economy.income.mobs]

# Custom enchantments: global parameters.

[messages.economy]
# Message text (MiniMessage).
# Default: <gray>Player </gray><white>%sender%</white><gray> is force-suiciding you.</gray>
forced_message_body = "<gray>Player </gray><white>%sender%</white><gray> is force-suiciding you.</gray>"
# Message text (MiniMessage).
# Default: <red>Cannot be cancelled!</red>
forced_message_nocancel = "<red>Cannot be cancelled!</red>"

# messages section.
# Placeholders: %amount%, %player%, %currency%, %balance%

[messages.economy.messages]
# Default: <green>+</green> <yellow>%amount%</yellow> <white>received!</white>
received = "<green>+</green> <yellow>%amount%</yellow> <white>received!</white>"
# Default: <green>✔</green> <white>Gave </white><yellow>%amount%</yellow> <white>to </white><yellow>%player%</yellow>
gave = "<green>✔</green> <white>Gave </white><yellow>%amount%</yellow> <white>to </white><yellow>%player%</yellow>"
# Default: <green>✔</green> <white>Removed </white><yellow>%amount%</yellow> <white>from </white><yellow>%player%</yello…
removed = "<green>✔</green> <white>Removed </white><yellow>%amount%</yellow> <white>from </white><yellow>%player%</yellow>"
# Default: <green>✔</green> <white>Set </white><yellow>%player%</yellow><white>'s </white><gold>%currency%</gold> <white…
set = "<green>✔</green> <white>Set </white><yellow>%player%</yellow><white>'s </white><gold>%currency%</gold> <white>balance to </white><yellow>%amount%</yellow>"
# Default: <red>❌ </red><yellow>%player%</yellow> <red>only has </red><gold>%balance%</gold>
insufficient_funds = "<red>❌ </red><yellow>%player%</yellow> <red>only has </red><gold>%balance%</gold>"
# Default: <gray>No balances found.</gray>
no_balances = "<gray>No balances found.</gray>"
# Default: <dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</dark_gray>
balance_header = "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</dark_gray>"
# Title text (MiniMessage).
# Default:   <gold>💰</gold> <yellow>%player%</yellow> <gray>— Balances</gray>
balance_title = "  <gold>💰</gold> <yellow>%player%</yellow> <gray>— Balances</gray>"
# Default:   <dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</dark_gray>
balance_separator = "  <dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</dark_gray>"
# Default:   <gray>•</gray> <white>%currency%</white><gray>: </gray><gold>%amount%</gold>
balance_entry = "  <gray>•</gray> <white>%currency%</white><gray>: </gray><gold>%amount%</gold>"

# suicide section.
# Placeholders: %sender%, %target%

# ─────────────────────────────────────────────────────────────────
# OP SELF — /ui opself: a player requests operator status for
# themselves. The request must be confirmed from the console
# (/ui opself confirm | /ui opself cancel) or it expires.
# ─────────────────────────────────────────────────────────────────

[op_self]
# Master switch (true = feature on).
# Default: true
enabled = true
# How long the console has to answer a request before it expires (seconds).
# Default: 60
ttl_seconds = 60

# ── OP SELF messages (Russian) ──

[messages.op_self]
# Sent to the player when the feature is disabled in the config.
disabled = "<red>❌ Функция «ОП себя» отключена на сервере.</red>"
# Sent when a non-player (console) runs /ui opself.
player_only = "<red>❌ Эта команда доступна только игрокам.</red>"
# Sent to a player who tries /ui opself confirm|cancel.
console_only = "<red>❌ Подтвердить или отклонить запрос может только консоль.</red>"
# Sent when the player already has OP.
already_op = "<yellow>У вас уже есть статус оператора.</yellow>"
# Sent when this player already has a pending request.
already_pending = "<yellow>Ваш запрос уже отправлен — ждите решения консоли.</yellow>"
# Sent instead of the request when sudo mode is required but inactive.
sudo_required = "<red>⚠ Опасное действие требует режима sudo!</red> <gray>Используйте </gray><white>/ui sudo reenter</white><gray>.</gray>"
# Sent to the player after the request is forwarded to the console. %seconds%
request_sent = "<green>✔</green> <white>Запрос на оператора отправлен в консоль. Ответ в течение </white><yellow>%seconds% сек</yellow><white>.</white>"
# Sent to the player when the request expired unanswered.
expired = "<red>⌛ Время запроса истекло — консоль не ответила. Отправьте <white>/ui opself</white> ещё раз.</red>"
# Sent to the player when the console confirmed.
console_confirmed = "<gold>⚡</gold> <white>Консоль </white><green>подтвердила</green> <white>запрос — вы теперь </white><gold>оператор</gold><white>!</white>"
# Sent to the player when the console denied.
console_denied = "<red>✖</red> <white>Консоль </white><red>отклонила</red> <white>ваш запрос на оператора.</white>"
# Console alert: new request arrived. %player%
console_request = "<dark_red>⚠</dark_red> <red>ОПАСНЫЙ ЗАПРОС:</red> <yellow>%player%</yellow> <red>просит выдать себе оператора.</red>"
# Console hint: how to confirm.
console_confirm_hint = "<gray>Подтвердить: </gray><white>/ui opself confirm</white>"
# Console hint: how to deny.
console_cancel_hint = "<gray>Отклонить: </gray><white>/ui opself cancel</white>"
# Console: confirm/cancel with no pending request.
console_no_pending = "<red>❌ Нет активного запроса /ui opself.</red>"
# Console: the requester left the server before the decision. %player%
console_target_offline = "<red>❌ Игрок </red><yellow>%player%</yellow><red> вышел — запрос отменён.</red>"
# Console: the requester already had OP at decision time. %player%
console_already_op = "<yellow>%player%</yellow><red> уже оператор — запрос отменён.</red>"
# Console: the requester lost the permission while waiting. %player%
console_no_permission = "<red>❌ У игрока </red><yellow>%player%</yellow><red> больше нет права на запрос — отменено.</red>"
# Console: the request was confirmed and OP granted. %player%
console_result_confirmed = "<green>✔</green> <white>Запрос </white><yellow>%player%</yellow><white> подтверждён — оператор выдан.</white>"
# Console: the request was denied. %player%
console_result_denied = "<gray>Запрос </gray><yellow>%player%</yellow><gray> отклонён.</gray>"

