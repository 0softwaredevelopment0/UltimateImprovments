# Default: <red>В нике запрещённый синтаксис — сработало правило %section% "<white>%rule%</white>"</red>
forbidden_blacklist = "<red>В нике запрещённый синтаксис — сработало правило %section% \"<white>%rule%</white>\"</red>"
# Default: <red>Ник не проходит обязательное правило %section% "<white>%rule%</white>" (белый список)</red>
forbidden_whitelist = "<red>Ник не проходит обязательное правило %section% \"<white>%rule%</white>\" (белый список)</red>"
# Default: <red>Плейсхолдеры ('%') в нике запрещены</red>
