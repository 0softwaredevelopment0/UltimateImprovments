chat_ping:
  enabled: true
  ping_style: <underlined><color:#FFAA00>@%s</color></underlined>
  sound_name: ENTITY_EXPERIENCE_ORB_PICKUP
  sound_volume: 0.5
  sound_pitch: 1.5
chat_filter:
  enabled: false
  words:
  - '*блять*'
  - '*блят*'
  - '*хуй*'
  - '*пизда*'
  - '*еба*'
  - '*пидр*'
  - '*таврь*'
  - '*нахуй*'
  - '*нахер*'
  - '*нах'
  regex_patterns:
  - '.*(?<!\p{L})(?:бля(?:дь|ть|т)|бляд(?:ь|и|ина)|еб(?:ать|ан|лан|уч)|хуй|хуйня|пизд(?:а|ец|еть)|муд(?:ак|ила)|гандон)(?!\p{L}).*

    '
  - '.*(?<!\p{L})(?:долбо(?:еб|ёб)|идиот|дебил|кретин|имбецил|придурок)(?!\p{L}).*

    '
  - '.*п[^а-яёa-z0-9]{0,3}и[^а-яёa-z0-9]{0,3}д[^а-яёa-z0-9]{0,3}(?:а|о)?[^а-яёa-z0-9]{0,3}р.*

    '
  - '.*х[^а-яёa-z0-9]{0,3}у[^а-яёa-z0-9]{0,3}й.*

    '
  - '.*[А-ЯЁA-Z]{15,}.*

    '
  - '.*(.)\1{8,}.*

    '
  - '.*ж[^а-яёa-z0-9]{0,3}[иi1і][^а-яёa-z0-9]{0,3}р(?:н(?:ы(?:й|е|х|м)?|ая|ое)?|уха|ок|дяй)?
    .*

    '
chat:
  enabled: true
  mode: channels
  format: '<green>ᴄᴜᴄᴇ <dark_gray>» <reset>%luckperms_prefix%<white>%player_name%<gray>:
    <white>%message%'
  channels:
    local:
      radius: 100
      format: '<green>ᴄʜᴀᴛ <dark_gray>»<dark_gray> [<white>L<dark_gray>] <reset>%luckperms_prefix%<white>%player_name%<gray>:
        <white>%message%'
    global:
      format: '<green>ᴄʜᴀᴛ <dark_gray>»<dark_gray> [<white>G<dark_gray>] <reset>%luckperms_prefix%<white>%player_name%<gray>:
        <white>%message%'
    world:
      format: '<green>ᴄʜᴀᴛ <dark_gray>»<dark_gray> [<white>W<dark_gray>] <reset>%luckperms_prefix%<white>%player_name%<gray>:
        <white>%message%'
    private:
      format: '<green>ᴄʜᴀᴛ <dark_gray>»<dark_gray> [<white>P<dark_gray>] <reset>%luckperms_prefix%<white>%player_name%<gray>:
        <white>%message%'
    admin:
      format: '<green>ᴄʜᴀᴛ <dark_gray>»<dark_gray> [<white>A<dark_gray>] <reset>%luckperms_prefix%<white>%player_name%<gray>:
        <white>%message%'
    check:
      format: '<green>ᴄʜᴀᴛ <dark_gray>»<dark_gray> [<red>C<dark_gray>] <reset>%luckperms_prefix%<white>%player_name%<gray>:
        <white>%message%'
    console:
      enabled: true
      whitelist: []
      access_control:
        enabled: true
        units:
          1:
            enabled: true
            mode: blacklist
            wildcards:
              1: '*rm -rf /*'
            regexes: null
            condition: all
            custom_deny_msg:
              enabled: false
              message: <red>This is blocked by the server.</red>
    linux:
      enabled: false
      whitelist: []
      access_control:
        enabled: true
        units:
          1:
            enabled: true
            mode: blacklist
            wildcards:
              1: '*rm -rf /*'
            regexes: null
            condition: all
            custom_deny_msg:
              enabled: false
              message: <red>This is blocked by the server.</red>
  player_minimessage: true
  message_placeholders: true
  bypass_permission: ''
  access_control:
    enabled: false
    units:
      1:
        enabled: true
        mode: blacklist
        wildcards:
          1: '*badword*'
        regexes: null
        condition: all
        custom_deny_msg:
          enabled: false
          message: <red>Message blocked by chat access control.</red>
auto_broadcast:
  enabled: true
  sections:
    example:
      enabled: true
      cooldown_ticks: 2400
      conditions: is-op=false, is-gamemode=survival, online-above=1
      messages:
      - '<gold>✦ <white>Добро пожаловать на <yellow>%server_name%</yellow>! Онлайн:
        <aqua>%online%</aqua></white></gold>'
      - <green>☀ <white>Не забудь заглянуть в <yellow>/ui help</yellow> — там много
        полезного!</white></green>
ojm:
  enabled: false
  join: <white>[<green>+<white>] <player> <green>joined the game
  leave: <white>[<red>-<white>] <player> <red>left the game
messages:
  lang: en
  chat_ping:
    notification: <gray>🔔 You were pinged by</gray> <white>%sender%</white>
  chat_filter:
    message: <dark_red>❌</dark_red> <red>Your message was flagged for prohibited content!</red>
    violation_highlight: <gray>→ </gray><white>%message%</white>
    violation_match: <gray>└</gray> <white>Match:</white> %source%
messages_en:
  chat_ping:
    notification: <gray>🔔 You were pinged by</gray> <white>%sender%</white>
  chat_filter:
    message: <dark_red>❌</dark_red> <red>Your message was flagged for prohibited content!</red>
    violation_highlight: <gray>→ </gray><white>%message%</white>
    violation_match: <gray>└</gray> <white>Match:</white> %source%
