# UltimateImprovments — UI-Punish configuration.
# This single file holds the addon's settings AND its messages (RU + EN).
# Language: the global switch is messages.lang in UI-Core.toml ("en" or "ru").
# Every value can be edited; the file is re-read by /ui reload.
# Missing keys are auto-repaired from the bundled defaults on startup.

# ==================================================================
# SETTINGS
# ==================================================================


# Access control for the punish module.
[access_control]
# Interval in ticks (20 ticks = 1 second).
# Default: 20
check_interval_ticks = 20

# Operator lists — OP whitelist + OP blacklist share ONE periodic check task.
# Both checks run in a single pass with the interval below.
[op_lists]
# Shared check interval in ticks (20 ticks = 1 second; 0 disables the
# periodic check — join/add/enable checks still work).
# Default: 20
check_interval_ticks = 20

# OP whitelist: players WITHOUT an entry here lose OP (when enabled).
# /ui opwhitelist on|off writes the switch here (migrated from the DB once).
[op_lists.whitelist]
# Master switch.
# Default: false
enabled = false

# OP blacklist: players WITH an entry here lose OP.
# /ui opblacklist on|off writes the switch here.
[op_lists.blacklist]
# Master switch.
# Default: true
enabled = true

