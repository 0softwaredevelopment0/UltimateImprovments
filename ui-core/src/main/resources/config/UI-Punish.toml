# UltimateImprovments — UI-Punish configuration.
# This single file holds the addon's settings AND its messages (RU + EN).
# Language: the global switch is messages.lang in UI-Core.toml ("en" or "ru").
# Every value can be edited; the file is re-read by /ui reload.
# Missing keys are auto-repaired from the bundled defaults on startup.

# ==================================================================
# SETTINGS
# ==================================================================


# Access control for the punish module.
[access_control]
# Interval in ticks (20 ticks = 1 second).
# Default: 20
check_interval_ticks = 20

# BLOCK punishment — soft, dialog-only lock.
# The blocked player is NOT kicked: they stay online behind a modal dialog and
# cannot move, interact, chat or run commands until the block expires or an
# admin runs /ui punish unblock <player>. The block is stored in the database
# (punishments.type = 'block'), so it survives restarts and reconnects.
[punish.block]
# How often (ticks) the block dialog is re-sent while the block is active, so a
# dismissed dialog (ESC / Close button) pops back up. 20 ticks = 1 second.
# 0 = re-send only on join and on any attempted action (move/interact/chat/command).
# Default: 20
reopen_interval_ticks = 20

# Operator lists — OP whitelist + OP blacklist share ONE periodic check task.
# Both checks run in a single pass with the interval below.
[op_lists]
# Shared check interval in ticks (20 ticks = 1 second; 0 disables the
# periodic check — join/add/enable checks still work).
# Default: 20
check_interval_ticks = 20

# OP whitelist: players WITHOUT an entry here lose OP.
[op_lists.whitelist]
# Feature switch — whether the OP whitelist system runs at all.
# The runtime on/off state is separate and is controlled by the command
# (/ui opwhitelist on|off), persisted in the database.
# Default: true
enabled = true

# OP blacklist: players WITH an entry here lose OP.
[op_lists.blacklist]
# Feature switch — whether the OP blacklist system runs at all.
# The runtime on/off state is separate and is controlled by the command
# (/ui opblacklist on|off), persisted in the database.
# Default: true
enabled = true

