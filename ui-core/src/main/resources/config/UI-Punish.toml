# UltimateImprovments — UI-Punish configuration.
# This single file holds the addon's settings AND its messages (RU + EN).
# Language: the global switch is messages.lang in UI-Core.toml ("en" or "ru").
# Every value can be edited; the file is re-read by /ui reload.
# Missing keys are auto-repaired from the bundled defaults on startup.

# ==================================================================
# SETTINGS
# ==================================================================


# Maintenance mode (kick/knock non-staff players).
[maintenance]
# Maintenance mode switch: non-staff players are kicked/blocked.
# Default: true
enabled = true

# Access control for the punish module.
[access_control]
# Interval in ticks (20 ticks = 1 second).
# Default: 20
check_interval_ticks = 20

# ==================================================================
# MESSAGES — RUSSIAN (active when lang = "ru")
# ==================================================================


# maintenance section.
# Placeholders: %time%
[messages.maintenance]
# Message text (MiniMessage).
# Default: <red>⛏ Server is currently under maintenance!</red>\n<gray>Please come back later.</gray>
kick_message = "<red>⛏ Server is currently under maintenance!</red>\n<gray>Please come back later.</gray>"

# messages section.
# Placeholders: %time%
[messages.maintenance.messages]
# Master switch (true = feature on).
# Default: <red>⛏</red> <white>Maintenance mode </white><green>ENABLED</green>
enabled = "<red>⛏</red> <white>Maintenance mode </white><green>ENABLED</green>"
# Default: <green>✔</green> <white>Maintenance mode </white><red>DISABLED</red>
disabled = "<green>✔</green> <white>Maintenance mode </white><red>DISABLED</red>"
# Default: <yellow>⏰</yellow> <white>Maintenance will be enabled in </white><yellow>%time%</yellow>
scheduled_enable = "<yellow>⏰</yellow> <white>Maintenance will be enabled in </white><yellow>%time%</yellow>"
# Default: <yellow>⏰</yellow> <white>Maintenance will be disabled in </white><yellow>%time%</yellow>
scheduled_disable = "<yellow>⏰</yellow> <white>Maintenance will be disabled in </white><yellow>%time%</yellow>"

# ==================================================================
# MESSAGES — ENGLISH (active when lang = "en")
# ==================================================================


# maintenance section.
# Placeholders: %time%
[messages_en.maintenance]
# Message text (MiniMessage).
# Default: <red>⛏ Server is currently under maintenance!</red>\n<gray>Please come back later.</gray>
kick_message = "<red>⛏ Server is currently under maintenance!</red>\\n<gray>Please come back later.</gray>"

# messages section.
# Placeholders: %time%
[messages_en.maintenance.messages]
# Master switch (true = feature on).
# Default: <red>⛏</red> <white>Maintenance mode </white><green>ENABLED</green>
enabled = "<red>⛏</red> <white>Maintenance mode </white><green>ENABLED</green>"
# Default: <green>✔</green> <white>Maintenance mode </white><red>DISABLED</red>
disabled = "<green>✔</green> <white>Maintenance mode </white><red>DISABLED</red>"
# Default: <yellow>⏰</yellow> <white>Maintenance will be enabled in </white><yellow>%time%</yellow>
scheduled_enable = "<yellow>⏰</yellow> <white>Maintenance will be enabled in </white><yellow>%time%</yellow>"
# Default: <yellow>⏰</yellow> <white>Maintenance will be disabled in </white><yellow>%time%</yellow>
scheduled_disable = "<yellow>⏰</yellow> <white>Maintenance will be disabled in </white><yellow>%time%</yellow>"
