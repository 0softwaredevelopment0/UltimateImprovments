# UltimateImprovments — UI-MBS configuration.
# This single file holds the addon's settings AND its messages (RU + EN).
# Language: the global switch is messages.lang in UI-Core.toml ("en" or "ru").
# Every value can be edited; the file is re-read by /ui reload.
# Missing keys are auto-repaired from the bundled defaults on startup.

# ==================================================================
# SETTINGS
# ==================================================================


# Nuclear reactor: fuel, heat, explosions and energy output.
[reactor]
# Master switch (true = feature on).
# Default: true
enabled = true
# Log every reactor DB save to the console ("[Reactor] Saved reactor ...").
# Saves happen on state changes and can be frequent — off by default.
# Default: false
log_save = false
# Maximum value.
# Default: 2000000000
core_temp_max = 2000000000
# Default: 10000000
core_work_temp = 10000000
# Default: 0.02
press_follow_rate = 0.02
# Default: 0.01
spin_follow_rate = 0.01
# Energy amount.
# Default: 100
energy_rate = 100
# Startup energy buffer: the reactor's case junctions (waxed chiseled
# copper touching the cable network) charge it at 250 ⚡/s; a startup
# requires a FULL buffer and consumes it.
# Default: 5000
startup_energy = 5000
# Default: 5.0
laser_ramp_rate = 5.0
# Power.
# Default: 5000
power_laser_heat_rate = 5000
# Default: 9500
stab_cool_rate = 9500
# Default: 5.0
shield_build_rate = 5.0
# Default: 400000
shield_stress_heat_per = 400000
# Default: 0.5
shield_stress_press_per = 0.5
# Default: 35000
shield_stress_spin_per = 35000
# Default: 0.333
shield_decay_base = 0.333
# Default: 5
shield_recovery_every_sec = 5
# Default: 1.0
shield_recovery_rate = 1.0
# Default: 10
shield_failure_countdown = 10
# Radius in blocks.
# Default: 10
shield_explosion_radius = 10
# Default: 25
shield_integrity_shutdown_percent = 25
# Chance (0.0-1.0 or percent, see the value).
# Default: 1.0
selfdestruct_chance = 1.0
# Default: 5
selfdestruct_no_signal_sec = 5
# Default: 60
selfdestruct_timed_sec = 60
# Power.
# Default: 10.0
selfdestruct_overpower_rate = 10.0
# Default: 9500.0
absorber_cool_rate = 9500.0
# Default: 40.0
absorber_rad_per_sec = 40.0
# Speed.
# Default: 0.35
shield_particle_rod_speed = 0.35
# Default: 16
shield_particle_rod_count = 16
# Default: 16
shield_particle_dust_count = 16
# Radius in blocks for the reactor visual gate: no particles and no ambient
# sounds are spawned while no player is this close (0 = always). Vanilla only
# sends particles/sounds to nearby players, so without viewers the work is
# pure waste.
# Default: 32.0
particle_view_distance = 32.0
# Minimum value.
# Default: 1000
fuel_spin_min = 1000
# Default: 95000
fuel_work_spin = 95000
# Default: 100000
fuel_over_spin = 100000
# Default: 5.0
fuel_base_rate = 5.0
# Minimum value.
# Default: 1.0
fuel_min_rate = 1.0
# Default: 1.0
fuel_over_per_10k = 1.0
# Default: 500.0
fuel_no_fuel_spin_decay = 500.0
# Minimum value.
# Default: 1000000
fusion_temp_min = 1000000
# Default: 10000000
fusion_temp_work = 10000000
# Default: 15000000
fusion_temp_peak = 15000000
# Default: 25000000
fusion_temp_end = 25000000
# Default: 20
fusion_particles_per_sec = 20
# Default: 21.0
fusion_absorb_rate = 21.0
# Default: 4000
fusion_debris_per = 4000
# Default: 15
case_heat_rate = 15
# Passive case cooling, C* per second, before the build-site humidity
# multiplier (the same roll as the core's natural cooling; legacy reactors
# multiply by 1.0 — plains 0.5 → 1.5 C*/sec, jungle 0.9 → 2.7). Runs even
# with the reactor off: the case coasts down to the lower temperature limit
# instead of freezing hot forever. Auto-clamped in config so that even at
# the max humidity multiplier it stays below the working-point (100%)
# fusion heat — a running reactor at >=100% always nets heating.
# Default: 3.0
case_cool_rate = 3.0
# Maximum value.
# Default: 10000
case_temp_max = 10000
# Maximum value.
# Default: 15.0
case_press_max = 15.0
# Default: 0.02
case_press_follow_rate = 0.02
# Default: 8000
case_int_decay_temp = 8000
# Default: 12.0
case_int_decay_press = 12.0
# Default: 1.0
case_int_decay_rate = 1.0
# Pane repairs are refused above this case temperature (C*): the pane is
# placed but not counted and pops off naturally after 1 second — unless the
# case cools below the threshold in time, then it counts as a repair.
# Default: 1000
case_repair_max_temp = 1000
# Iron ingots (held in the OFF hand — the main hand holds the glass) one
# pane repair costs. 0 = repairs are free. A repair without the ingot
# fails the same way as a too-hot one (pane pops off after 1 second).
# Default: 1
case_repair_iron_cost = 1
# Fusion particles (P) escaping through a breached case per second, per
# 1% of broken case glass (e.g. 1% broken = 10 particles/sec leak).
# Default: 10.0
case_breach_leak_per_pct = 10.0
# Fusion speed points lost per 1% of broken case glass while the core has
# no particles left to leak (e.g. 1% broken = -1% fusion strength; a fully
# broken case grinds fusion to 0). Shown plainly on the signs.
# Default: 1.0
case_breach_speed_penalty = 1.0
# Maintenance window: how many seconds a pane marked critical by integrity
# decay keeps warning (CRIT particles ramp 1..10) before it snaps. Save it
# by right-clicking the pane with an iron ingot (1 ingot). After one pane
# is lost, further decay snaps random panes instantly until the case is
# fully repaired again.
# Default: 10
case_maintain_window_sec = 10
# Cooldown after a critical pane is SAVED by maintenance: no new pane is
# marked critical for this many seconds. Decay waves arriving during the
# cooldown wait it out (no marks and no breaks until it expires).
# 0 = no cooldown.
# Default: 10
case_maintain_cooldown_sec = 10
# Radius in blocks.
# Default: 10
meltdown_explosion_radius = 10
# Dynamic lower temperature limit — rolled per reactor at build time from
# the build-site biome (a disassemble + rebuild rolls a fresh one).
# limit = biome temperature × multiplier + offset, rounded to whole C*.
# Default: 0.0
temp_limit_offset = 0.0
# Biome temperature multiplier.
# Default: 10.0
temp_limit_biome_multiplier = 10.0
# Biome temperature used when the biome has no temperature value.
# Default: 1.0
temp_limit_biome_fallback = 1.0
# Natural (passive) core cooling rate, C* per second, before the
# build-site humidity multiplier (rolled at assembly: multiplier =
# biome humidity + natural_cool_multiplier_offset, clamped by
# natural_cool_multiplier_min/max).
# Default: 20.0
natural_cool_rate = 20.0
# Added to the biome humidity multiplier rolled at assembly.
# Default: 0.0
natural_cool_multiplier_offset = 0.0
# Humidity used when the biome has no humidity value.
# Default: 0.5
natural_cool_biome_fallback = 0.5
# Clamp (floor) for the rolled humidity multiplier.
# Default: 0.0
natural_cool_multiplier_min = 0.0
# Clamp (ceiling) for the rolled humidity multiplier.
# Default: 1.0
natural_cool_multiplier_max = 1.0

# ==================================================================
# COMPACT NUCLEAR REACTOR (3×3×3 safe energy generator)
# ==================================================================

# Compact nuclear reactor: emeralds burn in the top barrel, the redstone-
# powered reinforced deepslate in the center enables it, and 100 ⚡/s are
# pushed into the cable network through the bottom copper port. Whatever the
# network cannot take stays in the reactor's own output buffer on that port,
# where any consumer pulls it directly (lamps/machines work without a battery).
[nuclear_reactor]
# Master switch (true = feature on).
# Default: true
enabled = true
# Energy pushed into the network per second while the reactor runs. Kept
# deliberately low: the coal generator produces 10 ⚡/s, so a single reactor
# is worth ten generators, not a hundred.
# Default: 100
energy_per_second = 100
# Seconds one fuel item (one emerald) sustains the reactor. Fuel is only
# spent while the structure is intact, the center is powered, a cable is
# connected and the network (or the output buffer) actually accepts the energy.
# Default: 10
fuel_interval_seconds = 10
# Fuel item consumed from the barrel.
# Default: EMERALD
fuel_item = "EMERALD"
# Log every operating-state change to the console.
# Default: false
log = false
# Leftover output buffer of one reactor: when no battery in the network takes
# the produced energy, it waits on the bottom copper port until a consumer
# pulls it (a direct reactor → wires → lamp / machine setup works without a
# battery). The reactor switches off while the network AND this buffer are
# full and resumes automatically when a consumer drains either of them.
# Keep it modest: an unloaded reactor keeps producing (and heating up) until
# the buffer is full, so a huge value lets it run far longer than needed.
# Default: 2000
buffer_capacity = 2000

# ----------------------------------------------------------------
# THERMAL MODEL (temperature, coolant and meltdown)
# ----------------------------------------------------------------

# Heating rate while the reactor runs, in degrees per second. The reactor
# heats up to work_temp with passive cooling disabled.
# Default: 20
heat_rate = 20
# Working temperature: the reactor holds this point and starts draining the
# cooling buffer (1% per cooling_drain_seconds). Without coolant it keeps
# heating to max_temp.
# Default: 512
work_temp = 512
# Maximum temperature: the center block turns into lava and the detonation
# countdown starts. Detonation is cancelled if the player puts reinforced
# deepslate back into the center in time.
# Default: 1024
max_temp = 1024
# Passive cooling, in degrees per second, applied to a stopped reactor (down
# to the biome floor rolled at assembly) and to a running reactor that was
# cooled back from above work_temp. Scaled by the build-site biome humidity
# multiplier, exactly like the DFC.
# Default: 1.0
passive_cool_rate = 1.0
# Added to the build-site biome humidity before clamping the multiplier.
# Default: 0.0
passive_cool_multiplier_offset = 0.0
# Humidity value used when the biome has none (custom/datapack biomes).
# Default: 0.5
passive_cool_biome_fallback = 0.5
# Clamp floor / ceiling for the humidity multiplier.
# Defaults: 0.0 / 1.0
passive_cool_multiplier_min = 0.0
passive_cool_multiplier_max = 1.0
# Dynamic lower temperature limit rolled at assembly from the build-site
# biome: limit = biome temperature x multiplier + offset, rounded.
# Defaults: 10.0 / 0.0 / 1.0 (biome without a temperature value)
temp_limit_biome_multiplier = 10.0
temp_limit_offset = 0.0
temp_limit_biome_fallback = 1.0

# ----------------------------------------------------------------
# COOLANT (ice in the barrel)
# ----------------------------------------------------------------

# Full cooling buffer in percent; a full buffer stops eating ice.
# Default: 100
cooling_max = 100
# Cooling blocks converted from the barrel per second while the buffer is
# not full.
# Default: 1
cooling_blocks_per_second = 1
# Cooling percent added by one block of each ice type.
# Defaults: 1 / 2 / 3
cooling_ice = 1
cooling_packed_ice = 2
cooling_blue_ice = 3
# Seconds one cooling percent lasts at the working temperature.
# Default: 8
cooling_drain_seconds = 8

# ----------------------------------------------------------------
# STRUCTURE AUDIT
# ----------------------------------------------------------------

# DFC-style lazy structure scan: template cells re-read per second (the cube
# has 27 cells, so the default 9 is a full sweep every 3 seconds). The sweep
# catches bypasses that never fire BlockBreakEvent — explosions, pistons,
# plugin block changes. Player breaks/places are processed instantly and do
# not wait for the sweep.
# Default: 9
audit_cells_per_second = 9

# ----------------------------------------------------------------
# MELTDOWN AND ALERTS
# ----------------------------------------------------------------

# Detonation countdown after the center block turns into lava.
# Default: 10
meltdown_seconds = 10
# Charged-creeper explosion radius used by the detonation and by breaking
# the redstone center block.
# Default: 5
explosion_power = 5
# Radius in blocks for the CER alert broadcasts (damage / repair / failure /
# meltdown).
# Default: 30
alert_radius = 30
