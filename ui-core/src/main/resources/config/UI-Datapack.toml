# UltimateImprovments — UI-Datapack configuration.
# This single file holds the addon's settings AND its messages (RU + EN).
# Language: the global switch is messages.lang in UI-Core.toml ("en" or "ru").
# The bundled datapack language has its own switch: datapack.lang below.
# Every value can be edited; the file is re-read by /ui reload.
# Missing keys are auto-repaired from the bundled defaults on startup.

# ==================================================================
# SETTINGS
# ==================================================================


# Bundled datapack: which custom content is enabled.
# The pack is registered by UI-Datapack's bootstrapper (Paper DATAPACK_DISCOVERY)
# BEFORE the worlds load and auto-enabled on every start, so installing/updating the
# plugin no longer needs a restart or /datapack enable. Changing these toggles still
# requires a server restart (discovery happens at startup only).
[datapack]
# Master switch (true = feature on).
# Default: true
enabled = true

# Datapack language: "en" or "ru".
# Both variants carry identical content (enchantments, advancements, recipes,
# structures, worldgen); only the display names/descriptions are translated.
# "auto" follows messages.lang from UI-Core.toml.
# Requires a server restart (the pack is registered once, at startup).
# Default: "auto"
lang = "auto"

# modules section.
[datapack.modules]
# Default: true
enchantments = true
# Default: true
advancements = true
# Default: true
custom_recipes = true
# Default: true
vanilla_recipes = true
# Default: true
loot_tables = true
# World name.
# Default: true
worldgen = true
# Limit.
# Default: true
dimension_limits = true
