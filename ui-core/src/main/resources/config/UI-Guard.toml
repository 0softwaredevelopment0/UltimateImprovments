# Maximum value.
# Default: 10
max_length = 10
# Cooldown.
# Default: 3
enter_cooldown = 3

# sounds section.
[codepanel.sounds]
# Default: "UI_BUTTON_CLICK"
digit = "UI_BUTTON_CLICK"
# Default: "BLOCK_DISPENSER_FAIL"
backspace = "BLOCK_DISPENSER_FAIL"
# Default: "ENTITY_EXPERIENCE_ORB_PICKUP"
enter = "ENTITY_EXPERIENCE_ORB_PICKUP"
# Default: "ENTITY_PLAYER_LEVELUP"
success = "ENTITY_PLAYER_LEVELUP"
# Default: "BLOCK_ANVIL_LAND"
fail = "BLOCK_ANVIL_LAND"

# sudo section.
[sudo]
# Master switch (true = feature on).
# Default: true
enabled = true
# Minimum value.
# Default: 15
session_minutes = 15
# Cooldown.
# Default: 10
attempt_cooldown_seconds = 10
# Command.
# Default: ["ui punish", "ui power", "ui sudo", "ui op", "ui deop", "ui whitelist", "ui opwhitelist", "ui blacklist", "ui maint", "lp", "luckperms"]
dangerous_commands = ["ui punish", "ui power", "ui sudo", "ui op", "ui deop", "ui whitelist", "ui opwhitelist", "ui blacklist", "ui maint", "lp", "luckperms"]

# Command policy: vanilla commands superseded by /ui equivalents.
# Typing them reports error 011 ("command disabled on this server").

[command_policy]
# Vanilla commands disabled on this server — use the /ui equivalents instead
# (/ui op|deop, /ui power off|reboot). Blocked for players AND the
# console/RCON alike (the /ui replacements work from the console too).
# Default: ["op", "deop", "stop", "restart"]
disabled_commands = ["op", "deop", "stop", "restart"]

[maintenance]
# Maintenance mode switch: non-staff players are kicked/blocked.
# Default: true
enabled = true

# /ui console lockdown — emergency console lockout (all console/RCON commands
# are cancelled while active). The lockdown state itself lives in the database
# and survives restarts.

[console_lockdown]
# KILL SWITCH: emergency escape hatch. Set to true if the lockdown locks you
# out — on the next server restart or /ui reload the saved lockdown state is
# wiped from the database, the lockdown is lifted and this option is
# automatically reset back to false.
# Default: false
kill_switch = false

# /ui server lockdown — emergency server lockout against join floods (bot
# attacks and similar). While active, NEW connections are refused, but players
# already online are NOT kicked: they may leave and rejoin within the grace
# window. The lockdown state itself lives in the database and survives
# restarts.

[server_lockdown]
# KILL SWITCH: emergency escape hatch. Set to true if the lockdown locks you
# out — on the next server restart or /ui reload the saved lockdown state
# (including grace marks) is wiped from the database, the lockdown is lifted
# and this option is automatically reset back to false.
# Default: false
kill_switch = false

# Grace window: a player who was on the server when the lockdown was enabled
# may leave and rejoin within this time after quitting without being blocked;
# after the window expires they are treated like every other new connection.
# Time format: <number>s|m|h|d (e.g. 10s, 5m, 2h, 1d).
# Default: 10s
grace_time = "10s"

