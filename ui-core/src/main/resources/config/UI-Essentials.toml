# UltimateImprovments — UI-Essentials configuration.
# This single file holds the addon's settings AND its messages (RU + EN).
# Language: the global switch is messages.lang in UI-Core.toml ("en" or "ru").
# Every value can be edited; the file is re-read by /ui reload.
# Missing keys are auto-repaired from the bundled defaults on startup.

# ==================================================================
# SETTINGS
# ==================================================================


# /ui home: number of homes and related limits.
[home]
# Maximum homes per player (without extra permissions).
# Default: 10
max_homes = 10
# Minimum value.
# Default: 1
name_min_length = 1
# Maximum value.
# Default: 16
name_max_length = 16
# Maximum value.
# Default: 160
description_max_length = 160
# Default: "legit"
mode = "legit"

# Player report command toggles.
[report]
# Default: "3d"
expire_time = "3d"

# /ui endersee — inspect other players' ender chests.
[endersee]
# Enable the /ui endersee command.
# Default: false
enabled = false

# /ui heal and /ui feed behaviour and amounts.
[heal_feed]
# Master switch (true = feature on).
# Default: true
enabled = true
# Hearts restored by /ui heal.
# Default: 0
heal_amount = 0
# Food points restored by /ui feed.
# Default: 0
feed_amount = 0

# Spawn command/location settings.
[spawn]
# Default: "legit"
mode = "legit"

# Random teleport (/ui rtp): radius, cooldown and world rules.
[rtp]
# Master switch (true = feature on).
# Default: false
enabled = false
# Cooldown.
# Default: 60
cooldown_seconds = 60
# Maximum value.
# Default: 50
max_attempts = 50
# Default: "square"
shape = "square"
# World name.
# Default: ["world"]
worlds = ["world"]
# Radius in blocks.
# Default: 5
safe_search_radius = 5
# Default: ["MAGMA_BLOCK", "CACTUS", "FIRE", "SWEET_BERRY_BUSH", "POWDER_SNOW", "CAMPFIRE", "SOUL_CAMPFIRE", "BEDROCK", "WITHER_ROSE", "POINTED_DRIPSTONE"]
avoid_blocks = ["MAGMA_BLOCK", "CACTUS", "FIRE", "SWEET_BERRY_BUSH", "POWDER_SNOW", "CAMPFIRE", "SOUL_CAMPFIRE", "BEDROCK", "WITHER_ROSE", "POINTED_DRIPSTONE"]
# Default: []
only_surface = []

# radius section.
[rtp.radius]
# Minimum value.
# Default: 500
min = 500
# Maximum value.
# Default: 10000
max = 10000

# height section.
[rtp.height]
# Minimum value.
# Default: 0
min = 0
# Maximum value.
# Default: 255
max = 255

# avoid section.
[rtp.avoid]
# Default: true
liquid = true
# Default: true
void = true

# /ui near — shows nearby players (staff utility).
[near]
# Enable the /ui near command.
# Default: false
enabled = false
# Radius in blocks.
# Default: 128
max_radius = 128

# Fake/troll commands aimed at suspected hackers.
[troll]
# Enable the fake troll commands.
# Default: true
enabled = true

# forceop section.
[troll.forceop]
# Master switch (true = feature on).
# Default: true
enabled = true
# Permission node.
# Default: ""
permission = ""
# Message text (MiniMessage).
# Default: ["<white>[<gold>Server</gold>] Made <aqua>%player%</aqua> a server operator</white>", "<green>✔ You are now a server operator!</green>"]
messages = ["<white>[<gold>Server</gold>] Made <aqua>%player%</aqua> a server operator</white>", "<green>✔ You are now a server operator!</green>"]
# Default: "<gold>⚡ You are now OP!</gold>"
actionbar = "<gold>⚡ You are now OP!</gold>"
# Sound name (minecraft:...).
# Default: "ENTITY_EXPERIENCE_ORB_PICKUP"
sound = "ENTITY_EXPERIENCE_ORB_PICKUP"
# Default: true
log_to_console = true

# crash section.
[troll.crash]
# Master switch (true = feature on).
# Default: true
enabled = true
# Permission node.
# Default: ""
permission = ""
# Message text (MiniMessage).
# Default: ["<dark_red><bold>⚠ SERVER ERROR</bold></dark_red>", "<gray>java.lang.OutOfMemoryError: Java heap space</gray>", "<gray>    at net.minecraft.server.MinecraftServer.run(MinecraftServer.java:932)</gray>", "<dark_gray>[<red>Server closed</red>]</dark_gray>"]
messages = ["<dark_red><bold>⚠ SERVER ERROR</bold></dark_red>", "<gray>java.lang.OutOfMemoryError: Java heap space</gray>", "<gray>    at net.minecraft.server.MinecraftServer.run(MinecraftServer.java:932)</gray>", "<dark_gray>[<red>Server closed</red>]</dark_gray>"]
# Delay.
# Default: 2
delay_seconds = 2
# Message text (MiniMessage).
# Default: "Server closed"
kick_message = "Server closed"
# Sound name (minecraft:...).
# Default: "ENTITY_GENERIC_EXPLODE"
sound = "ENTITY_GENERIC_EXPLODE"
# Default: true
log_to_console = true

