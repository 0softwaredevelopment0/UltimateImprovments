# UI-Auth — player authentication.
#
# Settings under [auth]; messages under [messages.auth.*] (ru) and
# [messages_en.auth.*] (en). Active language follows messages.lang.
[auth]
# Master switch (true = feature on).
# Default: true
enabled = true
# Minimum value.
# Default: 1
min_password_length = 1
# Maximum value.
# Default: 32
max_password_length = 32
# Duration.
# Default: 60
session_duration_minutes = 60
# Timeout.
# Default: 60
login_timeout_seconds = 60
# Maximum value.
# Default: 5
max_wrong_attempts = 5
# Cooldown.
# Default: 5
request_cooldown_seconds = 5
# Maximum value.
# Default: 3
max_accounts_per_ip = 3

# check ip section.

[messages.auth]

# gui section.

[messages.auth.gui]
# Default: Register
register = "Register"
# Default: Enter password
login = "Enter password"
# Default: Change password
change_password = "Change password"
# Default: Account logout
logout = "Account logout"

# messages section.
# Placeholders: %remaining%, %min%, %max%, %count%, %limit%, %seconds%

[messages.auth.messages]
# Default: <green>✔ Registration successful!</green>
success_register = "<green>✔ Registration successful!</green>"
# Default: <green>✔ You have successfully logged in!</green>
success_login = "<green>✔ You have successfully logged in!</green>"
# Default: <red>❌ Incorrect password! Try again.</red>
