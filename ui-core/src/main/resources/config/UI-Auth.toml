# Auth settings (sub-sections).

[auth.check_ip]
# Master switch (true = feature on).
# Default: true
enabled = true

# check duplicate name section.

[auth.check_duplicate_name]
# Master switch (true = feature on).
# Default: true
enabled = true

# twofa section.

[auth.twofa]

# github section.

[auth.twofa.github]
# Master switch (true = feature on).
# Default: false
enabled = false
# Default: ""
client_id = ""
# Default: ""
client_secret = ""
# Default: 8080
port = 8080
# URL.
# Default: ""
public_url = ""

# Saves players who fall into the void (configurable teleport).
