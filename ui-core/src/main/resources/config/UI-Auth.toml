# Default: <red>❌ Password must not exceed </red><yellow>%max%</yellow><red> characters!</red>
password_too_long = "<red>❌ Password must not exceed </red><yellow>%max%</yellow><red> characters!</red>"
# Default: <red>❌ Please authenticate first! Enter your password in the opened window.</red>
need_auth = "<red>❌ Please authenticate first! Enter your password in the opened window.</red>"
# Default: <red>❌</red> <white>Your IP address has changed. Please log in again.</white>
