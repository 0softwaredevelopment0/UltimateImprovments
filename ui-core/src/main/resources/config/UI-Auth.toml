# UI-Auth — player authentication.
#
# Settings under [auth]; messages under [messages.auth.*] (ru) and
# [messages_en.auth.*] (en). Active language follows messages.lang.
[auth]
# Master switch (true = feature on).
# Default: true
enabled = true
# Minimum value.
# DEPRECATED — use [auth.password].min_length below; kept for old configs.
# Default: 8
min_password_length = 8
# Maximum value.
# Default: 32
max_password_length = 32
# Duration.
# Default: 60
session_duration_minutes = 60
# Timeout.
# Default: 60
login_timeout_seconds = 60
# Maximum value.
# Default: 5
max_wrong_attempts = 5
# Cooldown after a wrong password, for the account AND its IP.
# Default: 15
request_cooldown_seconds = 15
# Maximum value.
# Default: 3
max_accounts_per_ip = 3

# Password requirements. Applies to registration, self password change and admin resets.
[auth.password]
# Minimum password length in characters.
# Default: 8
min_length = 8
# Maximum password length in characters (also the field limit in the auth dialog).
# Default: 32
max_length = 32
# Require at least one digit (0-9).
# Default: true
require_digit = true
# Require at least one lowercase AND one uppercase English letter (a-z, A-Z).
# Default: true
require_case = true
# Require at least one special character (!, @, #, $, %, &, *, ...).
# Default: true
require_special = true
# Reject passwords that match the list below (case-insensitive).
# Default: true
block_common = true
# Forbidden passwords, compared case-insensitively.
# Default: the 25 most common leaked passwords
common_passwords = [
    "123456", "12345678", "123456789", "1234567890", "111111",
    "123123", "password", "passw0rd", "qwerty", "qwerty123",
    "qwertyuiop", "abc123", "letmein", "welcome", "admin",
    "root", "iloveyou", "monkey", "dragon", "football",
    "master", "sunshine", "princess", "minecraft", "minecraft123"
]

