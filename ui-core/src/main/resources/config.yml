# This is the configuration for the UltimateImprovements plugin.
# As you can see, there are a lot of settings here.
# If you need help with configuration, please contact the developer (DM: @rizer001_dm)
# or check out the README.

messages:
  # Chat message for general (lang)
  lang: en  # default language (en or ru)
  
  auth:
    gui:
      # Message related to player registration
      register: "Register"
      # Message related to player login
      login: "Enter password"
      # Message related to passwords
      change_password: "Change password"
      # Message related to player logout
      logout: "Account logout"
  
