# UI-Other configuration
# Feature settings

energy:
  generator:
    # Whether the energy generator is enabled
    enabled: true
    # Energy produced per unit of fuel burned
    energy_per_fuel: 100
    # How long one fuel item burns, in ticks (20 = 1 second)
    fuel_burn_ticks: 100
    # Whether generator actions are logged to the console
    log: false

  electric_furnace:
    # Whether the electric furnace is enabled
    enabled: true
    # Energy consumed per item smelted
    energy_per_smelt: 100
    # Cooldown between smelts, in milliseconds
    cooldown_ms: 1000

  cable:
    # Whether energy cables are enabled
    enabled: true
    # Maximum energy a cable can store (0 = unlimited)
    max_energy: 0
    # Whether cable actions are logged to the console
    log: false

    blink:
      # Whether the cable blink visual effect is enabled
      enabled: true
      # How long the cable stays off while blinking, in ticks
      off_ticks: 10
      # How long the cable stays on while blinking, in ticks
      on_ticks: 10

  battery:
    # Maximum energy a battery can store
    max_energy: 100000
    # Energy a battery discharges per tick
    discharge_per_tick: 10

    smooth_charge:
      # Whether smooth (gradual) battery charging is enabled
      enabled: true
      # Charge speed multiplier when charging
      charge_multiplier: 2.0
      # Discharge speed multiplier when discharging
      discharge_multiplier: 0.5

    visual:
      # Whether battery charge particles are shown
      particles_enabled: true

  battery_drain:
    # Whether battery draining is enabled
    enabled: true
    # Energy transferred per tick while draining
    transfer_per_tick: 5
    # Whether battery drain actions are logged to the console
    log: false

  balancer:
    # Whether the energy balancer is enabled
    enabled: true
    # Whether the balancer also balances batteries
    include_batteries: false
    # Maximum energy the balancer can transfer per tick
    max_transfer: 25
    # Whether balancer actions are logged to the console
    log: false

codepanel:
  # Maximum number of characters in a code panel code
  max_length: 10
  # Cooldown between code entries, in seconds
  enter_cooldown: 3
  sounds:
    # Sound played when a digit is pressed
    digit: UI_BUTTON_CLICK
    # Sound played when a digit is deleted
    backspace: BLOCK_DISPENSER_FAIL
    # Sound played when the code is submitted
    enter: ENTITY_EXPERIENCE_ORB_PICKUP
    # Sound played when the correct code is entered
    success: ENTITY_PLAYER_LEVELUP
    # Sound played when an incorrect code is entered
    fail: BLOCK_ANVIL_LAND

energy_crafting:
  # Whether energy crafting is enabled
  enabled: true
  # Energy consumed per crafted item
  energy_per_craft: 100
  # Radius (in blocks) to search for an energy source
  workbench_search_radius: 3
reactor:
  # Whether the reactor machine is enabled
  enabled: true

  # Rate at which the reactor temperature naturally decays
  temp_decay_rate: 1
  # Maximum core temperature before critical events
  core_temp_max: 6000
  # Minimum possible core temperature
  core_temp_min: -272
  # Minimum temperature the core can be cooled to
  core_temp_cool_min: -270
  # How fast the core heats up while running
  heat_rate: 3
  # How fast the core cools down
  cool_rate: 3

  # Rate at which core pressure is reduced
  core_press_reduce_rate: 1

  # How fast the reactor case heats up
  case_temp_heat_rate: 2
  # Maximum case temperature before damage
  case_temp_max: 8000
  # How fast the case cools down
  case_temp_cool_rate: 2
  # Minimum temperature the case can be cooled to
  case_temp_cool_min: -271
  # Rate at which case temperature naturally decays
  case_temp_decay_rate: 1

  # How fast case pressure builds from heat
  case_press_heat_rate: 4
  # Maximum case pressure before damage
  case_press_max: 10000
  # Rate at which case pressure naturally decays
  case_press_decay_rate: 1

  # Temperature above which shell integrity starts decaying
  shell_integrity_decay_temp: 5000
  # Shell integrity decay rate above the critical temperature
  shell_int_decay_rate: 1
  # Maximum temperature at which shell integrity can recover
  shell_int_recovery_temp_max: 4999
  # Shell integrity recovery rate when cooled down
  shell_int_recovery_rate: 1

  # Pressure above which case integrity starts decaying
  case_integrity_decay_press: 7000
  # Temperature above which case integrity starts decaying
  case_integrity_decay_temp: 7000
  # Case integrity decay rate from excessive pressure
  case_int_decay_press_rate: 1
  # Case integrity decay rate from excessive temperature
  case_int_decay_temp_rate: 1
  # Maximum pressure at which case integrity can recover
  case_int_recovery_press_max: 7000
  # Maximum temperature at which case integrity can recover
  case_int_recovery_temp_max: 4999
  # Case integrity recovery rate in safe conditions
  case_int_recovery_rate: 1

  wear:
    # Whether reactor wear (degradation over time) is enabled
    enabled: true
    # Interval between normal wear checks, in ticks
    interval_normal: 1200
    # Interval between wear checks while degraded, in ticks
    interval_degradation: 20
    # Ticks before meltdown to show a chat countdown
    chat_countdown: 30
    # Wear value at which the final meltdown sequence starts
    final_meltdown_start_at: 11
    # Duration of the final meltdown sequence, in ticks
    final_meltdown_duration: 10

  # Explosion radius when the reactor melts down
  meltdown_explosion_radius: 10

  # Maximum processing time for reactor recipes, in ticks
  recipe_time_max: 100

features:
  antimatter:
    # Whether antimatter explosions are enabled
    enabled: true
    # Radius of antimatter explosions
    explosion_radius: 5
    # Whether antimatter explosions break blocks
    break_blocks: true
    # Whether antimatter explosions set fire
    set_fire: true

  attributes:
    # Whether custom attribute boosts are enabled
    enabled: true
    # Extra attack damage granted to the player
    attack_damage: 0.1
    # Sneak speed multiplier
    sneak_speed: 1.0
    # Attack speed multiplier
    attack_speed: 3.5
    # How often attributes are applied, in ticks
    interval_ticks: 200

  beacon:
    # Whether the custom beacon effect is enabled
    enabled: true
    # Whether the beacon gives a glowing effect
    glowing: true
    # Whether the beacon gives blindness
    blindness: true
    # Regeneration effect amplifier from the beacon
    regeneration_amplifier: 4
    # Resistance effect amplifier from the beacon
    resistance_amplifier: 4
    # How often beacon effects are applied, in ticks
    interval_ticks: 5

  blockdmg:
    # Whether block damage effects are enabled
    enabled: true
    # Damage dealt by falling dripstone
    dripstone_damage: 1
    # Damage dealt by falling end rods
    endrod_damage: 1
    # How often block damage is checked, in ticks
    interval_ticks: 5

  boostedcobweb:
    # Whether boosted cobweb movement is enabled
    enabled: true

  # ────────────────────────────────────────────────────────────────
  # BLOCK COLLAPSE (GRAVITY) — DISABLED BY DEFAULT
  # ────────────────────────────────────────────────────────────────
  # Player-placed solid blocks get Stickiness (0-100%) and Heaviness.
  # Stickiness drains only while the block has NO solid support below it
  # (drain = heaviness × rate per second). At 0% the block collapses and
  # drops as if mined with a netherite tool; blocks above fall too.
  # State is persisted to the DB every save_interval_seconds.
  block_collapse:
    # Master switch — enable to turn the system on
    # Whether block collapse is enabled
    enabled: false
    # ── Stickiness formula ────────────────────────────────────────────
    # Every block starts with 100% stickiness. While the block has a solid
    # block directly BELOW it (vertical support), stickiness is NOT consumed.
    # Without vertical support, stickiness drains by:
    #     heaviness × rate  (percent per second)
    # Example: a block with heaviness 5 drains 5% stickiness per second.
    # When stickiness reaches 0% the block collapses (drops as if mined with
    # a netherite tool) and takes the blocks above it that ALSO have 0% —
    # the cascade STOPS at any block with stickiness > 0 (still holding).
    # Base block collapse probability multiplier
    rate: 1.0
    # How often blocks are checked (ticks)
    # How often collapse is checked, in ticks
    interval_ticks: 20
    # How often state is flushed to the DB (seconds) — 600 = every 10 minutes
    # How often collapse state is saved, in seconds
    save_interval_seconds: 600
    # Show «Heaviness» in the lore of block items (stickiness is always 100)
    # Whether collapse information is shown in item lore
    lore_enabled: true
    # How often inventories are scanned for lore (ticks)
    # How often the collapse lore is refreshed, in ticks
    lore_interval_ticks: 100
    # Log EVERY player block action (place/break) to console as it is queued
    # Whether block actions are logged to the console
    log_block_actions: false
    # Default heaviness (for unknown materials)
    # Default heaviness of unsupported blocks
    default_heaviness: 5.0
    # Per-material heaviness overrides (NAME: value)
    heaviness_overrides:
      # OBSIDIAN: 12.0
      # BEDROCK: 100.0

    # ────────────────────────────────────────────────────────────
    # ASYNC CHUNK SCANNING (16x16x16 around player block actions)
    # ────────────────────────────────────────────────────────────
    # EVERY player block action (place/break) is logged and queued as an
    # operation. Operations are processed LAZILY in a FIFO queue:
    #   • maximum 1 operation per interval_seconds (default: 1 per second);
    #   • all queued operations (new + old) wait their turn in order;
    #   • if the server is lagging (MSPT above max_mspt), the queue pauses
    #     until MSPT drops below the threshold;
    #   • scanning itself runs in a dedicated executor thread via
    #     thread-safe ChunkSnapshot (no main-thread lag).
    # Each operation scans the 16x16x16 chunk area around the action and
    # adds unsupported solid blocks to tracking — so even NATURAL structures
    # (overhangs, floating islands) are discovered and can collapse.
    # Duplicate operations for the same chunk are coalesced into one.
    scan:
      # Enable async chunk scanning
      # Whether periodic block scanning is enabled
      enabled: true
      # Delay before the first scan starts (seconds)
      # Delay before the first scan, in seconds
      delay_seconds: 1
      # One scan operation per N seconds (lazy mode, queued if several)
      # Interval between scans, in seconds
      interval_seconds: 1
      # Scan area side length (blocks) — 16 = 16x16x16 around the action
      # Area (in blocks) scanned per pass
      area: 16
      # Pause scanning while server MSPT is above this value
      # Maximum server MSPT allowed during a scan (scan pauses above this)
      max_mspt: 50.0

  deathbell:
    # Whether the death bell effect is enabled
    enabled: true
    # Whether lightning strikes when a player dies
    lightning: true

  dragonegg:
    # Whether the dragon egg respawn feature is enabled
    enabled: false
    # World where the dragon egg respawns
    world: "world_the_end"
    # X coordinate of the dragon egg spawn point
    x: 0
    # Y coordinate of the dragon egg spawn point
    y: 142
    # Z coordinate of the dragon egg spawn point
    z: 0
    # How often the dragon egg respawn is checked, in ticks
    interval_ticks: 1728000
    # Chance (0.0-1.0) the dragon egg respawns each check
    spawn_chance: 1.0

  enderchest:
    # Whether the ender chest explosion feature is enabled
    enabled: true
    # Chance an ender chest explodes when destroyed
    explosion_chance: 0.001
    # Power of the ender chest explosion
    explosion_power: 10.0
    # Damage dealt to the player opening a broken ender chest
    damage: 1

    quick_close:
      # Whether quick-close punishment is enabled
      enabled: true
      # Close speed threshold (ms) that triggers punishment
      threshold_ms: 1000
      # Damage dealt when the chest is closed too quickly
      damage: 1

      look_away:
        # Whether looking away from the chest triggers punishment
        enabled: true
        # View angle (degrees) considered as looking away
        angle_threshold: 45.0
        # Damage dealt when looking away from the chest
        explosion_damage: 20

  entitylocator:
    # Whether the entity locator feature is enabled
    enabled: true
    # Radius (in blocks) scanned for entities
    scan_radius: 12
    # How often the entity scan runs, in ticks
    interval_ticks: 20

  exp_bottle_upgrade:
    # Whether XP bottle upgrading in an anvil is enabled
    enabled: true

    # Максимальный множитель пузырька (x2 ... x{max_multiplier}). Выше — не скрафтить.
    # Maximum multiplier level for upgraded XP bottles
    max_multiplier: 100

    # Сколько уровней опыта забирает наковальня за крафт (0 — бесплатно).
    # XP cost per upgrade in the anvil
    anvil_cost_amount: 1

    # Название пузырька (MiniMessage). {level} — множитель.
    # Name of the upgraded XP bottle item
    item_name: "<i:false><yellow>Experience bottle <gold>x{level}</gold></yellow>"

    # Строки лора (MiniMessage). {level} — множитель, {next} — следующий уровень.
    item_lore:
      - "<i:false><gray>Gives <aqua>{level}</aqua> times more experience.</gray>"
      - "<i:false><dark_gray>{level} + {level} = <aqua>x{next}</aqua> on an anvil.</dark_gray>"

  glassbreak:
    # Whether glass break damage is enabled
    enabled: true
    # Damage dealt when glass breaks
    damage: 1

  magnet:
    # Whether the magnet feature is enabled
    enabled: true

    radius:
      # Minimum magnet radius
      min: 3
      # Maximum magnet radius
      max: 15

    # How often the magnet pulls items, in ticks
    interval_ticks: 1

    force:
      # Base pull force applied to items
      base: 0.01
      # Pull force multiplier based on distance
      distance_multiplier: 0.3
      # Maximum pull force
      max: 1
      # Maximum item pull speed (blocks per second)
      max_speed: 0.5

    # Vertical boost applied to items when pulled
    item_y_boost: 0.05

    force_curve:
      # Exponent of the force distance curve
      power_exponent: 0.50
      # Normalization factor of the force curve
      power_normalize: 20.0

    distance_curve:
      # Type of the distance curve (e.g. smoothstep)
      type: smoothstep
      # Minimum distance factor of the curve
      min_factor: 0.0

    particles:
      # Maximum particles at the magnet center
      center_max: 50
      # Maximum particles on pulled blocks
      blocks_max: 30
      # Maximum critical particles
      crit_max: 25
      # Maximum portal particles
      portal_max: 15

  modeprotect:
    # Whether game-mode protection is enabled
    enabled: false

    worlds:
      - "world"
      - "world_nether"
      - "world_the_end"

    # Permission that bypasses game-mode protection
    bypass_permission: "ui.gmprotect.bypass"

  shieldslowness:
    # Whether shield slowness is enabled
    enabled: true
    # Slowness amplifier applied while holding a shield
    slowness_amplifier: 255
    # Slowness duration, in ticks
    slowness_duration: 20

  terracotaspeed:
    # Whether terracotta speed boost is enabled
    enabled: true
    # Speed amplifier granted on terracotta
    speed_amplifier: 4
    # How often the speed effect is applied, in ticks
    interval_ticks: 5

  minecart_speed:
    # Whether the minecart speed feature is enabled
    enabled: true

    # Base maximum minecart speed
    base_max_speed: 8.0

    # Hard cap on minecart speed
    max_speed_limit: 999999999

    # Acceleration multiplier per tick
    acceleration_factor: 1.005

    # Deceleration multiplier per tick
    deceleration_factor: 0.998

    # Thrust added per tick while boosting
    thrust_per_tick: 0.06

    # Minimum speed at which minecart collisions deal damage
    collision_min_speed: 15.0

    # How often minecart speed is updated, in ticks
    interval_ticks: 1

    hopper_smelt:
      # Whether hopper minecarts smelt while moving fast
      enabled: true
      # Minimum speed for hopper minecart smelting
      min_speed: 50.0

  unbreakable_breaker:
    # Whether unbreakable block breaking is enabled
    enabled: true

    blocks:

      BEDROCK:
        # Whether this feature is enabled
        enabled: true

        # Maximum damage BEDROCK can take before breaking
        max_damage: 100

        # Minimum tool tier required to damage BEDROCK
        min_tool_tier: "-"

        # Whether Haste is required to break BEDROCK
        require_haste: false

        # Whether BEDROCK drops when broken
        drop_block: true

        # Whether BEDROCK breaks naturally (like vanilla)
        break_naturally: true

        # Whether break effects (particles/sound) play when BEDROCK breaks
        play_effects: true

        damage:
          # Damage dealt per hit with a netherite pickaxe
          netherite_pickaxe: 4.0
          # Damage dealt per hit with a diamond pickaxe
          diamond_pickaxe: 2.5
          # Damage dealt per hit with an iron pickaxe
          iron_pickaxe: 1.0
          # Damage dealt per hit with a copper pickaxe
          copper_pickaxe: 0.7
          # Damage dealt per hit with a wooden pickaxe
          wooden_pickaxe: 0.5
          # Damage dealt per hit with a golden pickaxe
          golden_pickaxe: 0.4
          # Default damage dealt per hit with other tools
          default: 0.3

        # Damage multiplier while Efficiency is applied
        efficiency_multiplier: 0.5

        # Damage multiplier while Haste is applied
        haste_multiplier: 0.3

      BARRIER:
        # Whether this feature is enabled
        enabled: true

        # Maximum damage BARRIER can take before breaking
        max_damage: 80.0

        # Minimum tool tier required to damage BARRIER
        min_tool_tier: "-"

        # Whether Haste is required to break BARRIER
        require_haste: false

        # Whether BARRIER drops when broken
        drop_block: true

        # Whether BARRIER breaks naturally (like vanilla)
        break_naturally: true

        # Whether break effects (particles/sound) play when BARRIER breaks
        play_effects: true

        damage:
          # Damage dealt per hit with a netherite pickaxe
          netherite_pickaxe: 4.0
          # Damage dealt per hit with a diamond pickaxe
          diamond_pickaxe: 2.5
          # Damage dealt per hit with an iron pickaxe
          iron_pickaxe: 1.0
          # Damage dealt per hit with a copper pickaxe
          copper_pickaxe: 0.7
          # Damage dealt per hit with a wooden pickaxe
          wooden_pickaxe: 0.5
          # Damage dealt per hit with a golden pickaxe
          golden_pickaxe: 0.4
          # Default damage dealt per hit with other tools
          default: 0.3

        # Damage multiplier while Efficiency is applied
        efficiency_multiplier: 0.5

        # Damage multiplier while Haste is applied
        haste_multiplier: 0.3

  integrity:
    # Whether item integrity is enabled
    enabled: true

    # How often integrity is checked, in ticks
    interval_ticks: 20

    # Global multiplier for integrity loss
    cost_multiplier: 1.0

    gradient:
      # Color of the integrity gradient at 100%
      high_color: "#006600"
      # Color of the integrity gradient at 0%
      low_color: "#990000"

    # Lore line showing the integrity value
    lore_text: "<white>Integrity:</white>"

    on_break:
      # Whether a sound plays when an item breaks
      play_sound: true

      # Whether a message is sent when an item breaks
      send_message: true

      # Sound played when an item breaks
      sound: ENTITY_ITEM_BREAK

      # Volume of the break sound
      sound_volume: 2.0

      # Pitch of the break sound
      sound_pitch: 1.0

    logging:
      # Whether integrity initialization is logged
      log_init: false

      # Whether item break events are logged
      log_break: false

      # Whether integrity errors are logged
      log_errors: true

    anvil_repair:
      # Whether anvil integrity repair is enabled
      enabled: true
      # Integrity restored per anvil repair
      integrity_multiplier: 0.25
      # Whether combining items in an anvil restores integrity
      combine_enabled: true
      # Bonus integrity when combining two items
      combine_bonus: 0.1

      material_craft:
        # Whether crafting with materials restores integrity
        enabled: true
        # Integrity restored per material used in crafting
        integrity_per_material: 10.0

    mending_xp:
      # Whether mending repairs integrity
      enabled: true
      # Integrity restored per mending repair
      integrity_multiplier: 0.5

    combine:
      # Whether combining items affects integrity
      enabled: true
      # Integrity lost when combining items
      loss_rate: 0.0

    xp_integrity:
      # Whether collecting XP restores integrity
      enabled: true
      # Integrity restored per XP point collected
      integrity_per_xp: 0.1

    low_integrity_warning:
      # Whether low-integrity warnings are enabled
      enabled: true
      thresholds:
        - 75
        - 50
        - 25
        - 10
        - 5

    unbreaking:
      # Whether the Unbreaking enchantment protects integrity
      enabled: true

    piercing:
      # Whether piercing arrows cost extra integrity
      enabled: true
      # Extra integrity cost when shot by piercing arrows
      extra_integrity_cost: 0.5

    # Items that never receive integrity
    blacklist: []

    # Items that always receive integrity
    whitelist: []

  creative_item_validator:
    # Whether creative item validation is enabled
    enabled: true
    # Permission that bypasses creative item validation
    bypass_permission: "ui.creative.bypass"
    # Maximum serialized item size (bytes)
    max_item_bytes: 10240
    # Maximum persistent data keys allowed on an item
    max_pdc_keys: 30
    # Maximum lore lines allowed
    max_lore_lines: 50
    # Maximum characters per lore line
    max_lore_chars: 1000
    # Maximum characters in an item name
    max_name_chars: 200
    # Maximum enchantments allowed on one item
    max_enchantments: 40

  shulker_protection:
    # Whether shulker box protection is enabled
    enabled: true

  leash:
    # Whether leash behavior is enabled
    enabled: true
    # Maximum leash distance
    max_distance: 10
    # How often the leash pulls the entity back, in ticks
    pull_back_interval: 2
    # Whether the leash cannot break from distance
    prevent_break: true
    # Whether the entity stops completely at the leash limit
    hard_stop: true

  container_trigger:
    # Whether container triggers are enabled
    enabled: false

    # How often container triggers are checked, in ticks
    interval_ticks: 1

    triggers:
      []

  waypoint:
    # Whether waypoints are enabled
    enabled: true
    # How often waypoint effects are applied, in ticks
    interval_ticks: 200

  sudo:
    # Whether sudo mode is enabled
    enabled: true

    # How long a sudo session lasts, in minutes
    session_minutes: 15

    # Cooldown between sudo attempts, in seconds
    attempt_cooldown_seconds: 10

    # Список команд, требующих sudo-подтверждения (префиксы, БЕЗ слэша).
    # Сюда перенесены ВСЕ команды, которые требуют sudo. Каждая строка — префикс:
    # "ui punish" перехватывает /ui punish crash, /ui punish ban, /ui punish kick и т.д.
    dangerous_commands:
      - "ui punish"
      - "ui power"
      - "ui chgop"
      - "ui op"
      - "ui deop"
      - "ui whitelist"
      - "ui opwhitelist"
      - "ui blacklist"
      - "ui maintenance"
      - "lp"
      - "luckperms"
      - "op"
      - "deop"
      - "stop"
      - "restart"

brand_spoof:
  # Whether the server brand is spoofed
  enabled: true

  # Custom server brand shown to clients
  custom_brand: "Paper"

vanish:
  # List of players currently vanished (auto-managed)
  vanished_players: []

radiation:
  # Whether radiation mechanics are enabled
  enabled: true
  # Natural radiation decay rate per tick
  natural_decay: 1
  # Whether radiation effects are applied to players
  effects_enabled: true

  # Radiation emitted by ancient debris
  ancient_debris_radiation: 2
  # Radiation in the basalt deltas biome
  basalt_deltas_radiation: 2
  # Radiation in the End dimension
  end_radiation: 2

  # Radiation reduction from a lead shield
  lead_shield_reduction: 2
  # Radiation reduction from antirad items
  antirad_reduction: 100
  # Radiation reduction on kill
  kill_reduction: 100
  # Whether radiation resets on death
  death_reset: true

  # Radiation gained from using a mace
  mace_use_radiation: 50
  # Radiation gained from using a trident
  trident_use_radiation: 50
  # Radiation gained from using elytra
  elytra_use_radiation: 50

  # Radiation near a reactor core
  reactor_core_radiation: 10
  # Radiation near a reactor under pressure
  reactor_pressure_radiation: 600
  # Radiation close to a melted-down reactor
  reactor_meltdown_close: 6400
  # Radiation far from a melted-down reactor
  reactor_meltdown_far: 3200

  # Space dimension radiation (points added every space_interval_ticks)
  space_radiation: 199
  # Space radiation interval in ticks (200 = 10 seconds)
  space_interval_ticks: 200
sunburn:
  # Master toggle - enable/disable the entire sunburn system
  enabled: true

  # How often to check all players for sun exposure (ticks)
  # 20 = 1 second, 80 = 4 seconds (recommended to avoid lag)
  check_interval: 80

  # Duration of fire applied to exposed players (ticks)
  # 20 = 1 second. Set equal to or greater than check_interval
  # so fire stays on continuously while in sunlight
  fire_ticks: 80

  # Extinguish player when they leave sunlight (night, underground, etc.)
  # Minecraft also naturally extinguishes fire in water and rain
  extinguish_when_safe: true

  # --- Helmet Protection ---
  # How often to degrade helmet durability when exposed to sun (ticks)
  # While helmet is equipped, player does NOT catch fire
  helmet_degrade_interval: 80

  # How many integrity uses a helmet absorbs per degrade tick
  helmet_integrity_loss: 1

  # --- World Whitelist ---
  # Only worlds listed here have sunburn enabled
  # Other worlds (nether, end, lobby, etc.) are unaffected
  included_worlds:
    - "world"
netherite_upgrade:
  base_values:
    # Base attribute values used to compute the upgrade lore
    armor:
      # Base protection of netherite helmet
      helmet: 3
      # Base protection of netherite chestplate
      chestplate: 8
      # Base protection of netherite leggings
      leggings: 6
