# ║                                                                  ║
# ╚══════════════════════════════════════════════════════════════════╝
#
#   access_control.check_interval_ticks
#     • Description: Interval of PERIODIC CHECKS of all online players
#       against whitelist/blacklist/opwhitelist.
#       20 ticks = every second.
#       If whitelist/blacklist/opwhitelist are on, every N ticks
#       all players are checked — anyone who should not be on the server
#       gets kicked.
#       0 = disable the periodic check (check only on join).
#     • Values: any integer ≥ 0
#     • Default: 20
