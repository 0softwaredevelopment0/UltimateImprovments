# ============================================================================
# AUTO BROADCAST — АВТО-БРОАДКАСТЫ (auto_broadcast)
# ============================================================================
# Периодические сообщения игрокам с гибкими условиями показа.
#
# ── СТРУКТУРА ───────────────────────────────────────────────────────────────
#   auto_broadcast:
#     enabled: true            # мастер-переключатель всей системы
#     sections:                # список секций (можно сколько угодно)
#       <имя_секции>:
#         enabled: true        # включена ли секция
#         cooldown_ticks: 2400 # интервал отправки в ТИКАХ (20 тиков = 1 сек)
#         conditions: "..."    # строка условий (см. ниже), пусто = сообщение идёт всем
#         messages:            # сообщения в формате MiniMessage (отправляются по кругу)
#           - "<gold>Первое сообщение</gold>"
#           - "<gold>Второе сообщение</gold>"
#
#   Сообщения секции отправляются по очереди: 1-е, 2-е, ... и снова с 1-го.
#   Первое сообщение уходит через cooldown_ticks после старта/релоада.
#
# ── ФОРМАТ УСЛОВИЙ (conditions) ─────────────────────────────────────────────
#   "<условие>=<значение>"                          — одно условие
#   "a=1, b=2, c=3"                               — несколько условий через запятую
#   (пробелы после запятых не обязательны)
#
#   Правила комбинации:
#   • Однотипные условия (ОДИНАКОВОЕ имя) с РАЗНЫМИ значениями = ИЛИ
#     (игроку достаточно совпадения с любым из них).
#     Пример: "is-gamemode=survival, is-gamemode=creative" — подходит и для
#     выживания, и для креатива.
#   • Разные условия между собой = И (должны выполниться ВСЕ).
#     Пример: "is-op=false, is-gamemode=survival" — только не-операторы в выживании.
#   • Если одно и то же «условие=значение» встречается несколько раз — плагин
#     напишет ПРЕДУПРЕЖДЕНИЕ в консоль и использует только первое вхождение.
#   • Неизвестные условия и неверные значения тоже предупреждаются в консоли
#     и просто игнорируются (секция продолжает работать с остальными условиями).
#
# ── ДОСТУПНЫЕ УСЛОВИЯ ───────────────────────────────────────────────────────
#   is-op=true/false                       — true: только для операторов (OP);
#                                            false: только для НЕ-операторов
#   is-gamemode=survival|creative|spectator|adventure
#                                          — игрок находится в указанном режиме игры
#   height-is/above/below=<int>            — высота игрока по Y (блоки),
#                                            например: height-above=25, height-below=-10
#   health-is/above/below=<int>            — здоровье игрока,
#                                            например: health-below=10 (раненые),
#                                            health-above=18
#   hunger-is/above/below=<int>            — очки голода (0–20),
#                                            например: hunger-below=6 (голодные)
#   is-alert=true/false                    — true: сообщение видят ТОЛЬКО игроки
#                                            с правом ui.alerts;
#                                            false: игроки с правом ui.alerts его НЕ видят
#   is-group=<группа>                      — сообщение идёт только игрокам в указанной
#                                            группе LuckPerms (основная ИЛИ унаследованная),
#                                            например: is-group=admin
#   online-is/above/below=<int>            — СЕРВЕРНОЕ условие: количество игроков
#                                            онлайн, например: online-above=5
#   xp-lvl-is/above/below=<int>            — уровень XP игрока,
#                                            например: xp-lvl-above=30
#
# ── ПЛЕЙСХОЛДЕРЫ ─────────────────────────────────────────────────────────────
#   В сообщениях работают все внутренние плейсхолдеры (%player_name%, %online%,
#   %group%, %prefix%, %tps% и др.) и любые PlaceholderAPI-плейсхолдеры.
#   Плейсхолдеры резолвятся персонально для каждого получателя.
# ============================================================================
auto_broadcast:
  # Whether this feature is enabled
  enabled: true

  sections:
    # ── ПРИМЕР ──────────────────────────────────────────────────────────────
    # Приветствие: раз в 2 минуты (2400 тиков) для не-операторов, играющих
    # в выживании, когда на сервере больше 1 игрока. Сообщения чередуются.
    example:
      # Whether this feature is enabled
      enabled: true
      # Cooldown between broadcasts of this section, in ticks
      cooldown_ticks: 2400
      # Conditions that control when this section broadcasts
      conditions: "is-op=false, is-gamemode=survival, online-above=1"
      messages:
        - "<gold>✦ <white>Добро пожаловать на <yellow>%server_name%</yellow>! Онлайн: <aqua>%online%</aqua></white></gold>"
        - "<green>☀ <white>Не забудь заглянуть в <yellow>/ui help</yellow> — там много полезного!</white></green>"

