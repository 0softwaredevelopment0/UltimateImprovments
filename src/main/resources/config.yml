# ╔══════════════════════════════════════════════════════════════════╗
# ║                                                                  ║
# ║   8. 🔐 AUTHENTICATION (auth)                                   ║
# ║                                                                  ║
# ╚══════════════════════════════════════════════════════════════════╝
#
#   auth.enabled
#     • Description: Enables the authentication system (password login).
#       Players MUST register and authenticate.
#       Recommended for cracked servers (offline-mode).
#     • Values: true / false
#     • Default: true
#
#   auth.min_password_length
#     • Description: Minimum password length.
#       8 — at least 8 characters. Too-short passwords are risky.
#     • Values: any integer ≥ 1
#     • Default: 8
#
#   auth.max_password_length
#     • Description: Maximum password length.
#       32 — max 32 characters. Longer — inconvenient to type.
#     • Values: any integer ≥ 1
#     • Default: 32
#
#   auth.session_duration_minutes
#     • Description: Authentication session duration (minutes).
#       After logging in the player does not re-enter the password.
#       60 = 1 hour. 0 = no session (re-login every join).
#     • Values: any integer ≥ 0
#     • Default: 60
#
#   auth.check_ip.enabled
#     • Description: Whether to check the IP when restoring a session.
#       If the IP changed — the session is reset, re-authentication is needed.
#       Protects against session theft.
#     • Values: true / false
#     • Default: true
#
#   auth.login_timeout_seconds
#     • Description: Max time to authenticate (seconds).
#       60 = 1 minute. After the timeout the player is kicked.
#     • Values: any integer ≥ 1
#     • Default: 60
#
#   auth.max_wrong_attempts
#     • Description: Max wrong password attempts.
#       5 — after 5 failed attempts the player is kicked.
#     • Values: any integer ≥ 1
#     • Default: 5
#
#   auth.request_cooldown_seconds
#     • Description: Cooldown between password-change requests (seconds).
#       5 — can request a change once every 5 seconds.
#     • Values: any integer ≥ 0
#     • Default: 5
#
#   auth.max_accounts_per_ip
#     • Description: Max accounts from one IP address.
#       3 — up to 3 different players can log in from one IP.
#       Protects against mass bot registration.
#       0 — no limit.
#     • Values: any integer ≥ 0
#     • Default: 3
#
#   auth.check_duplicate_name.enabled
#     • Description: Whether to check duplicate names on registration.
#       If someone already took this name — a new player cannot register.
#       Protects against name impersonation.
#     • Values: true / false
#     • Default: true
#
#   auth.2fa.bot_token
#     • Description: Telegram bot token for 2FA (two-factor authentication).
#       If filled — players can connect Telegram and confirm login
#       via the bot. Leave empty if you don't use 2FA.
#     • WARNING: The repo contains a TEST token. Create YOUR OWN bot
#       via @BotFather in Telegram and paste its token here.
#     • Default: filled with a test token
#
#   auth.2fa.bot_url
#     • Description: URL for the Telegram bot web server (local or remote).
#       "http://localhost:3000" — if the bot runs on the same server.
#     • Default: "http://localhost:3000"
#
#
# ╔══════════════════════════════════════════════════════════════════╗
# ║                                                                  ║
# ║   9. 🕳 VOID PROTECTION                                         ║
# ║                                                                  ║
# ╚══════════════════════════════════════════════════════════════════╝
#
#   void_protection.enabled
#     • Description: Teleports the player to a spawn point when falling
#       into the void in the listed worlds. E.g. in pocketworld.
#     • Values: true / false
#     • Default: true
#
#   void_protection.worlds
#     • Description: Worlds where the protection works.
#       Example: ["pocketworld", "arena_world"]
#     • Values: list of strings (world names)
#
#   void_protection.target
#     • Description: Teleport point when falling into the void.
#     • world: world name
#     • x, y, z: coordinates
#     • yaw, pitch: look direction
#
#
# ╔══════════════════════════════════════════════════════════════════╗
# ║                                                                  ║
# ║   10. 🔌 POWER MANAGEMENT (power)                                ║
# ║                                                                  ║
# ╚══════════════════════════════════════════════════════════════════╝
#
#   power.intercept_commands
#     • Description: Intercept vanilla /stop and /restart.
#       If true — the commands show a confirmation via /ui power.
#       If false — the commands work as usual.
#     • Values: true / false
#     • Default: true
#
#   power.request_timeout
#     • Description: Time to confirm a request (seconds).
#       30 — after 30 sec the request auto-cancels.
#     • Values: any integer ≥ 1
#     • Default: 30
#
#   power.countdown_duration
#     • Description: Countdown duration before execution (sec).
#       10 — the server shuts down 10 sec after confirmation.
#     • Values: any integer ≥ 1
#     • Default: 10
#
#   power.actionbar.enabled
#     • Description: Whether to show the countdown in the actionbar.
#     • Values: true / false
#     • Default: true
#
#   power.bossbar.enabled
#     • Description: Whether to show a countdown boss bar.
#     • Values: true / false
#     • Default: true
#
#   power.bossbar.color
#     • Description: Boss bar color.
#     • Values: BLUE, RED, GREEN, PURPLE, PINK, WHITE, YELLOW
#     • Default: RED
#
#   power.bossbar.style
#     • Description: Boss bar style.
#     • Values: SOLID, SEGMENTED_6, SEGMENTED_10, SEGMENTED_12, SEGMENTED_20
#     • Default: SOLID
#
#   power.countdown_sound.enabled
#     • Description: Whether to play a beep sound during the countdown.
#     • Values: true / false
#     • Default: true
#
#   power.countdown_sound.name
#     • Description: Beep sound name.
#     • Default: "BLOCK_NOTE_BLOCK_PLING"
#
#   power.countdown_sound.volume
#     • Description: Sound volume.
#     • Values: decimal from 0.0 to 2.0
#     • Default: 1.0
#
#   power.countdown_sound.pitch_base
#     • Description: Pitch at the start of the countdown (low = slow beeping).
#     • Values: decimal from 0.5 to 2.0
#     • Default: 1.2
#
#   power.countdown_sound.pitch_max
#     • Description: Pitch on the last second (high = sped up).
#     • Values: decimal from 0.5 to 2.0
#     • Default: 2.0
#
#   power.countdown_sound.beep_speedup.enabled
#     • Description: Whether to speed up beeping toward the end of the countdown.
#     • Values: true / false
#     • Default: true
#
#   power.countdown_sound.beep_speedup.min_per_second
#     • Description: Min beeps per second (at countdown start). 1 = once per sec.
#     • Values: any integer ≥ 1
#     • Default: 1
#
#   power.countdown_sound.beep_speedup.max_per_second
#     • Description: Max beeps per second (at countdown end). 6 = 6 times per sec.
#     • Values: any integer ≥ 1
#     • Default: 6
#
#
# ╔══════════════════════════════════════════════════════════════════╗
