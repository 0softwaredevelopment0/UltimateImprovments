#   ────────────────────────────────────────────────────────────────
#   4.24. features.sudo — SUDO MODE (DANGEROUS-COMMAND PROTECTION)
#   ────────────────────────────────────────────────────────────────
#
#   GitHub-style sudo mode: players with the ui.sudo permission must confirm
#   dangerous commands with a sudo password. After a successful password entry
#   a sudo session starts (15 minutes by default) during which
#   dangerous commands pass without confirmation.
#
#   features.sudo.enabled
#     • Description: Enables sudo mode.
#     • Values: true / false
#     • Default: true
#
#   features.sudo.session_minutes
#     • Description: Sudo session duration after entering the password (minutes).
#     • Values: integer ≥ 1
#     • Default: 15
#
#   features.sudo.attempt_cooldown_seconds
#     • Description: Cooldown between sudo password attempts (seconds).
#       The number of attempts is unlimited.
#     • Values: integer ≥ 1
#     • Default: 10
#
#   features.sudo.dangerous_commands
#     • Description: List of dangerous commands (prefixes). Any command
#       starting with one of these prefixes requires sudo.
#       Examples: ui punish crash, lp (and all /lp subcommands),
#       ui power off, ui power reboot (server shutdown/restart).
#     • Values: list of strings
#     • Default: ui punish crash, lp, luckperms, ui power off,
#       ui power reboot, ui power off, ui power reboot
#
#   Commands:
#     /ui sudo status              — sudo session status
#     /ui sudo on                  — open the sudo-password dialog
#     /ui sudo off                 — exit sudo mode
#     /ui sudo reset               — request a password reset (confirmed by console)
#     /ui sudo confirmreset <nick> — console confirms the password reset
#
#   Permission: ui.sudo — who is subject to sudo mode.
#
#   Password reset: if a player forgot their sudo password, they type /ui sudo reset,
#   a request goes to console, the console confirms via
#   /ui sudo confirmreset <nick> — after that the player sets a new password.
#
#
