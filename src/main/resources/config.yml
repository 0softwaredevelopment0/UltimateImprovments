# ║                                                                  ║
# ║   24. 📊 SCOREBOARD                                             ║
# ║                                                                  ║
# ╚══════════════════════════════════════════════════════════════════╝
#
#   scoreboard.enabled
#     • Description: Custom scoreboard (right screen). Can have
#       SEVERAL configurations with different display conditions.
#     • Values: true / false
#     • Default: true
#
#   scoreboard.update_interval_ticks
#     • Description: Scoreboard refresh interval (in ticks).
#       20 = once per second.
#     • Values: any integer ≥ 5
#     • Default: 20
#
#   scoreboard.boards
#     • Description: List of scoreboard configurations.
#       Each board has a name (e.g. "default", "pvp", "mining").
#       Conditions determine who and when sees this scoreboard.
#
#     Each board:
#       condition:
#         type:     always / world / world_blacklist / permission
#                   always — show to everyone at all times
#                   world — show ONLY in these worlds
#                   world_blacklist — show in ALL EXCEPT these worlds
#                   permission — show only with the permission
#         worlds:   list of worlds (for type=world/world_blacklist)
#         permission: permission (for type=permission)
#
#       title:    Scoreboard title (MiniMessage with placeholders)
#                 Max ~40 characters (Minecraft limit)
#
#       lines:    Scoreboard lines (list, max 15 lines)
#                 Empty line = "" = an empty divider line
#                 Each line is MiniMessage with placeholders
#
#   Example with multiple boards:
#     boards:
#       default:
#         condition:
#           type: always
#         title: "<gradient:#00AAFF:#FF55FF>UltimateImprovments</gradient>"
#         lines:
#           - ""
#           - "<gray>Online: <white>{online}</white></gray>"
#           - "<gray>TPS: <white>{tps}</white></gray>"
#           - ""
#           - "<gray>Your ping: <white>{player_ping}ms</white></gray>"
#           - "<gray>World: <white>{world_name}</white></gray>"
#
#       pvp:
#         condition:
#           type: world
#           worlds: ["pvp_arena"]
#         title: "<red>⚔ PVP ARENA</red>"
#         lines:
#           - "<gray>Kills: <white>{kills}</white></gray>"
#           - "<gray>Deaths: <white>{deaths}</white></gray>"
#
#
# ╔══════════════════════════════════════════════════════════════════╗
# ║                                                                  ║
# ║   25. 📊 BOSSBAR                                                ║
# ║                                                                  ║
# ╚══════════════════════════════════════════════════════════════════╝
#
#   bossbar.enabled
#     • Description: Custom boss bar at the top of the screen.
#       Displays info (online, TPS, etc.) with an animated
#       progress bar. Can be disabled if not needed.
#       Per-player on/off: /ui togglebb
#     • Values: true / false
#     • Default: true
#
#   bossbar.format
#     • Description: Boss bar text in MiniMessage format with placeholders.
#       All placeholders are supported (player, server, PAPI).
#       Example: "<gradient:#00AAFF:#FF55FF>UltimateImprovments</gradient> | Online: {online}"
#     • Default: "<gradient:#00AAFF:#FF55FF>UltimateImprovments | Online: {online}"
#
#   bossbar.color
#     • Description: Progress bar color.
#     • Values: BLUE, RED, GREEN, PURPLE, PINK, WHITE, YELLOW
#     • Default: YELLOW
#
#   bossbar.style
#     • Description: Bar style (segment count).
#     • SOLID:        solid
#     • SEGMENTED_6:  6 segments (NOTCHED_6)
#     • SEGMENTED_10: 10 segments (NOTCHED_10)
#     • SEGMENTED_12: 12 segments (NOTCHED_12)
#     • SEGMENTED_20: 20 segments (NOTCHED_20)
#     • Default: SOLID
#
#   bossbar.progress_mode
#     • Description: Progress change mode.
#     • STATIC:            static value (from static_value)
#     • INCREASE_DECREASE: smoothly rises and falls
#     • INCREASE_RESET:    rises to 100%, resets to 0
#     • DECREASE_INCREASE: falls and rises
#     • DECREASE_RESET:    falls to 0%, resets to 100%
#     • RANDOM:            random value every tick
#     • Default: increase_decrease
#
#   bossbar.static_value
#     • Description: Progress value for STATIC mode.
#       0.5 = 50% of the bar. 0.0 = empty. 1.0 = full.
#     • Values: decimal from 0.0 to 1.0
#     • Default: 0.5
#
#   bossbar.progress_speed
#     • Description: Progress change speed (per tick) for animated
#       modes. 0.01 = slow. 0.1 = fast.
#     • Values: decimal from 0.0 to 1.0
#     • Default: 0.01
#
#   bossbar.progress_increasing
#     • Description: Initial progress direction.
#       true: starts rising. false: starts falling.
#     • Values: true / false
#     • Default: true
#
#   bossbar.update_interval_ticks
#     • Description: Text and progress update interval (in ticks).
#       20 = once per second.
#     • Values: any integer ≥ 5
#     • Default: 20
#
#
