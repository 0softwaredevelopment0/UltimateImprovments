# ║   PLACEHOLDERS — FULL REFERENCE                                  ║
# ║                                                                  ║
# ╚══════════════════════════════════════════════════════════════════╝
#
#   All placeholders are resolved via PlaceholderResolver.
#   They work in MiniMessage format: colors, gradients, tags.
#   Resolution order: Built-in → Ping → Stats → PAPI (last).
#
#   ────────────────────────────────────────────────────────────────
#   1. 👤 PLAYER PLACEHOLDERS (no PAPI)
#   ────────────────────────────────────────────────────────────────
#
#   {player_name}           — player's nick
#   {player_displayname}    — display name (with prefixes/suffixes)
#   {player_uuid}           — player's UUID
#   {player_ping}           — ping in ms (number only)
#   {player_ping_color}     — ping with HEX color (MiniMessage <#RRGGBB>)
#   {player_ping_gradient}  — ping with a MiniMessage gradient
#   {player_gamemode}       — gamemode (survival/creative/...)
#   {player_health}         — health (number, e.g. 20.0)
#   {player_food}           — food (number, 0-20)
#   {player_level}          — XP level
#   {player_xp}             — XP progress (0-100%)
#
#   ────────────────────────────────────────────────────────────────
#   2. 🌍 WORLD PLACEHOLDERS (no PAPI)
#   ────────────────────────────────────────────────────────────────
#
#   {world_name}            — player's current world name
#   {world_players}         — player count in the current world
#
#   ────────────────────────────────────────────────────────────────
#   3. 🖥 SERVER PLACEHOLDERS (no PAPI)
#   ────────────────────────────────────────────────────────────────
#
#   {online}                — current online count
#   {max_players}           — maximum player count
#   {tps}                   — TPS (formatted, 0.00)
#   {tps_color}             — TPS with HEX color (green/yellow/red)
#   {mspt}                  — MSPT (milliseconds per tick)
#   {mspt_color}            — MSPT with HEX color
#   {ram}                   — RAM in % (e.g. "45.2")
#   {ram_color}             — RAM with HEX color
#   {uptime}                — server uptime (e.g. "12d 5h 30m")
#   {server_name}           — server name (Bukkit.getName())
#   {server_version}        — server version (e.g. "1.21.4")
#
#   ────────────────────────────────────────────────────────────────
#   4. 🔤 BUILT-IN LUCKPERMS (no PAPI)
#   ────────────────────────────────────────────────────────────────
#
#   {prefix}                — LuckPerms prefix (if installed)
#   {suffix}                — LuckPerms suffix
#   {group}                 — primary LuckPerms group name
#
#   ⚠ Requires LuckPerms on the server. Auto-detected at startup.
#
#   ────────────────────────────────────────────────────────────────
#   5. ⏱ DYNAMIC PLACEHOLDERS (period statistics)
#   ────────────────────────────────────────────────────────────────
#
#   Let you get min/avg/max metrics over a time period.
#   Statistics are collected once per second (buffer: ~24 hours).
#
#   Format: {<metric>[_min|max|avg]_<time>[_color]}
#
#   Metrics:
#     tps     — ticks per second
#     mspt    — milliseconds per tick
#     online  — player count
#     ram     — RAM usage (%)
#
#   Time formats:
#     1s  — over the last 1 second
#     30s — over the last 30 seconds
#     5m  — over the last 5 minutes
#     1h  — over the last 1 hour
#     1d  — over the last 1 day
#     ss  — over the whole server session
#
#   Suffixes:
#     _min    — minimum value over the period
#     _max    — maximum value over the period
#     _avg    — average value (default, can be omitted)
#     _color  — value with HEX color
#
#   Examples:
#     {tps}             — TPS now
#     {tps_5m}          — average TPS over 5 minutes
#     {tps_min_1h}      — minimum TPS over an hour
#     {tps_max_ss}      — maximum TPS over the session
#     {tps_1s_color}    — TPS over 1 sec with color
#     {mspt_max_1h}     — maximum MSPT over an hour
#     {online_max_1h}   — maximum online over an hour
#     {ram_avg_5m}      — average RAM over 5 minutes
#     {ram_color}       — RAM with color
#
#   ────────────────────────────────────────────────────────────────
#   6. 📶 PING PLACEHOLDERS
#   ────────────────────────────────────────────────────────────────
#
#   Format: {ping[_min|max|avg]_<time>_<scope>[_color]}
#
#   Scope:
#     all     — average ping of ALL online players
#     ys      — your own ping (current, no history)
#     <nick>  — a specific player's ping (current only)
#
#   Examples:
#     {ping}              — average ping of all players
#     {ping_5m}           — average ping of all over 5 minutes
#     {ping_ys}           — your current ping
#     {ping_all}          — average ping of all right now
#     {ping_min_30s_all}  — minimum ping of all over 30 sec
#     {ping_max_1h_all}   — maximum ping of all over an hour
#     {ping_ys_color}     — your ping with a gradient
#     {ping_1s_Steve}     — Steve's ping
#     {ping_Steve_color}  — Steve's ping with color
#
#   Ping colors:
#     0-200ms     — green        (#00AA00 → #55FF55)
#     200-400ms   — yellow       (#55FF55 → #FFFF55)
#     400-600ms   — orange       (#FFFF55 → #FFAA00)
#     600-800ms   — red          (#FFAA00 → #FF5555)
#     800-1000ms+ — dark red     (#FF5555 → #AA0000)
#
#   ────────────────────────────────────────────────────────────────
#   7. 🟢 PAPI (PlaceholderAPI) — ANY EXTERNAL PLACEHOLDERS
#   ────────────────────────────────────────────────────────────────
#
#   If PlaceholderAPI is installed on the server, any PAPI placeholders
#   work alongside the built-in ones.
#
#   Examples:
#     %luckperms_prefix%           — prefix from LuckPerms
#     %luckperms_suffix%           — suffix from LuckPerms
#     %luckperms_primary_group_name%  — group name
#     %player_world%               — world name
#     %player_xp%                  — XP
#     %vault_eco_balance%          — balance (Vault Economy)
#     %player_health%              — health (PAPI version)
#
#   PAPI placeholders are resolved AFTER the built-in ones; they can be combined:
#     {player_name} %luckperms_prefix%
#
#   ────────────────────────────────────────────────────────────────
#   8. 🔔 CHAT PINGS (@mentions)
#   ────────────────────────────────────────────────────────────────
#
#   Work inside chat messages (not in the format, but in the message text itself).
#
#   @everyone       — pings everyone online (except yourself)
#   @<nick>         — pings a specific player (e.g. @Steve)
#   @non-op         — pings all non-OP players
#   @is-admin       — pings all players with ui.admin/ui.* permission
#   @is-non-admin   — pings all players without admin permission
#
#   Pinged players hear a sound and get a notification.
#   Ping style is configured in config.yml → chat_ping.ping_style
#
#   ────────────────────────────────────────────────────────────────
#   9. 📍 WHERE PLACEHOLDERS WORK
#   ────────────────────────────────────────────────────────────────
#
#   ┌──────────────────────────┬──────────────────────────────────┐
#   │ WHERE                    │ WHICH PLACEHOLDERS              │
#   ├──────────────────────────┼──────────────────────────────────┤
#   │ chat.format              │ Any + {message} (the message)     │
#   │ chat.groups.formats.*    │ Any + {message}                  │
#   │ chat.worlds.*            │ Any + {message}                  │
#   │                          │                                  │
#   │ tab.header / footer      │ Any (per-player)                 │
#   │ tab.player_list.format   │ Any                              │
#   │ tab.player_list.objective_*│ Any                            │
#   │                          │                                  │
#   │ bossbar.format           │ Any                              │
#   │                          │                                  │
#   │ scoreboard.boards.*.title│ Any                              │
#   │ scoreboard.boards.*.lines│ Any                              │
#   │ motd.line1 / line2       │ {online}, {max_players}, {tps},  │
#   │                          │ {uptime}, {server_name}          │
#   │                          │ {player_name} DOES NOT WORK       │
#   │                          │                                  │
#   │ Player messages          │ Any (if message_placeholders     │
#   │                          │ = true in config.yml)             │
#   │                          │                                  │
#   │ Nickname ping placeholders│ only if the player is online    │
#   └──────────────────────────┴──────────────────────────────────┘
#
#   ⚠ {player_name} DOES NOT WORK in MOTD — there is no player context.
#   ⚠ _color versions contain a MiniMessage tag (<#RRGGBB>),
#     they are NOT overridden by external MiniMessage formatting.
#   ⚠ Plain versions (without _color) are just a number/string,
#     they ARE overridden by external MiniMessage.
#
#
# ╔══════════════════════════════════════════════════════════════════╗
# ║                                                                  ║
# ║   CONFIGURATION EXAMPLES                                       ║
# ║                                                                  ║
# ╚══════════════════════════════════════════════════════════════════╝
#
#   ── Chat with groups ──
#   chat:
#     enabled: true
#     mode: per-group
#     format: "<gray>{player_name}</gray>: <white>{message}</white>"
#     groups:
#       default: "<gray>[<white>{player_name}</white>]</gray> <white>{message}</white>"
#       formats:
#         admin: "<red>[Admin]</red> <white>{player_name}</white>: <red>{message}</red>"
#         vip: "<gold>[VIP]</gold> <white>{player_name}</white>: <gold>{message}</gold>"
#         moderator: "<dark_green>[Mod]</dark_green> <white>{player_name}</white>: <green>{message}</green>"
#         default: "<gray>{player_name}</gray>: <white>{message}</white>"
#
#   ── Tab with ping ──
#   tab:
#     enabled: true
#     update_interval_ticks: 20
#     header:
#       - "<gradient:#00AAFF:#FF55FF>  ✦ My Server ✦  </gradient>"
#       - "<gray>Online: <white>{online}</white><gray>/{max_players}</gray>"
#     footer:
#       - "<gray>TPS: {tps_color}  |  MSPT: {mspt_color}</gray>"
#       - "<gray>Uptime: {uptime}</gray>"
#     player_list:
#       objective_enabled: true
#       objective_suffix: " <dark_gray>[</dark_gray>{player_ping_gradient}<dark_gray>ms]</dark_gray>"
#
#   ── Bossbar with progress ──
#   bossbar:
#     enabled: true
#     format: "<gradient:#FFAA00:#FF5555>Custom Server</gradient> | Online: {online}"
#     color: YELLOW
#     style: SEGMENTED_6
#     progress_mode: INCREASE_DECREASE
#     progress_speed: 0.005
#     update_interval_ticks: 20
#
#   ── Scoreboard for two worlds ──
#   scoreboard:
#     enabled: true
#     boards:
#       default:
#         condition:
#           type: world_blacklist
#           worlds: ["pvp_arena"]
#         title: "<gradient:#00AAFF:#FF55FF>My Server</gradient>"
#         lines:
#           - ""
#           - "<gray>Online: <white>{online}</white></gray>"
#           - "<gray>TPS: {tps_color}</gray>"
#           - ""
#           - "<gray>Ping: {player_ping_gradient}</gray>"
#           - "<gray>World: <white>{world_name}</white></gray>"
#           - ""
#           - "<dark_gray>discord.gg/server</dark_gray>"
#       pvp:
#         condition:
#           type: world
#           worlds: ["pvp_arena"]
#         title: "<red>⚔ PVP ARENA</red>"
#         lines:
#           - "<gray>Let's fight!</gray>"
#           - "<gray>K/D: <white>N/A</white></gray>"
#
#   ── MOTD ──
#   motd:
#     enabled: true
#     line1: "<gradient:#00AAFF:#FF55FF>✦ My Server ✦</gradient>"
#     line2: "<gray>Online: {online}/{max_players}</gray>"
#     icon_enabled: true
#
#
# ╔══════════════════════════════════════════════════════════════════╗
# ║                                                                  ║
# ║   ADDITIONAL INFORMATION                                       ║
# ║                                                                  ║
# ╚══════════════════════════════════════════════════════════════════╝
#
#   ───── VANILLA /whitelist ─────
#   The vanilla /whitelist command is BLOCKED.
#   Use: /ui whitelist on|off|add|remove|list
#
#   ───── VANILLA /op and /deop ─────
#   Vanilla /op and /deop are BLOCKED.
#   Use: /ui chgop (graphical interface)
#
#   ───── VANILLA /stop and /restart ─────
#   Intercepted by the plugin (with confirmation).
#   Use: /ui power off and /ui power reboot
#
#   ───── DATABASE ─────
#   All data is stored in plugins/UltimateImprovments/database.db (SQLite).
#   Regular backups are strongly recommended!
#
#   ───── DATAPACK ─────
#   The plugin automatically installs the UI-Datapack
#   into the world/datapacks/ folder on first launch.
#   The datapack contains custom recipes, functions and structures.
#
#   ───── RELOAD ─────
#   After changing config.yml use /ui reload.
#   This reloads the configs and re-initializes the modules.
#   A full server restart is NOT required (but possible).
#
#   ───── SUPPORT ─────
#   GitHub: https://github.com/rizer001/UltimateImprovments
#   Bugs and suggestions: create an Issue on GitHub
# === ULTIMATEIMPROVMENTS GUIDE END ===

