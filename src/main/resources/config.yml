# ║   11. ☠ SUICIDE                                              ║
# ║                                                                  ║
# ╚══════════════════════════════════════════════════════════════════╝
#
#   suicide.countdown_duration
#     • Description: Timer before death (seconds).
#       10 — the player dies 10 sec after confirmation.
#     • Values: any integer ≥ 1
#     • Default: 10
#
#   suicide.cooldown_seconds
#     • Description: Cooldown between suicides (seconds).
#       10 — cannot die more often than once every 10 sec.
#     • Values: any integer ≥ 0
#     • Default: 10
#
#   suicide.confirm_timeout
#     • Description: Time to confirm the suicide (seconds).
#       30 — after 30 sec without confirmation the request cancels.
#     • Values: any integer ≥ 1
#     • Default: 30
#
#   suicide.sounds
#     • Description: Sounds for different suicide stages.
#     • warning:    warning sound
#     • tick:       countdown tick sound
#     • finish:     death sound
#     • Values: Minecraft sound names
#
#   suicide.bossbar.color/style
