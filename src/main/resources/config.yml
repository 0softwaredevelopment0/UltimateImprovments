#
# ▸ WHAT IS ULTIMATEIMPROVMENTS?
#   UltimateImprovments is a feature-packed plugin for Paper 1.21.4+.
#   It adds: energy, reactors, custom crafting, punishments, whitelist,
#   blacklist, custom chat, tab, scoreboard, MOTD, vanish, authentication,
#   radiation, wireless redstone, bot protection, chat filter and much more.
#
#   All commands: /ui <subcommand>
#   Help:         /ui help
#
# ▸ CONFIGURATION FILES
#
#   plugins/UltimateImprovments/config.yml       — MAIN SETTINGS (all values)
#   config.yml (sections messages: + messages_en:) — MESSAGES
#   config.yml (plugin-guide section at the TOP of the file) — documentation
#
#   config.yml contains EVERYTHING: values, localized messages, DOCUMENTATION (at the top).
#   ALL setup documentation is at the TOP of this file (config.yml)
#
# ▸ AUTO-CONFIG-REPAIR
#   If config.yml is missing some keys (after a plugin update) —
#   the plugin AUTOMATICALLY appends the missing values at the END of the file.
#   Your settings will NOT be reset.
#
#   Also, if the embedded guide is outdated — the plugin will rewrite
#   it with the current version on the next startup.
#
# ▸ HOW TO READ THIS GUIDE
#   For every config.yml section the following is provided:
#     • KEY — the YAML path (e.g. energy.generator.enabled)
#     • Description — what it does
#     • Values — what you can put there
#     • Default — what is used when the key is absent
#     • Notes — important nuances
#
#
# ╔══════════════════════════════════════════════════════════════════╗
# ║                                                                  ║
# ║   1. ⚡ ENERGY SYSTEM (energy)                                   ║
# ║                                                                  ║
# ╚══════════════════════════════════════════════════════════════════╝
#
#   The energy system is the core of the plugin. Generators produce energy,
#   cables transmit it, batteries store it, and furnaces/workbenches consume it.
#
#   ────────────────────────────────────────────────────────────────
#   1.1. energy.generator — ENERGY GENERATOR
#   ────────────────────────────────────────────────────────────────
#
#   energy.generator.enabled
#     • Description: Enables/disables the energy generator.
#       The generator is a block that burns fuel (coal, wood, lava
#       etc.) and produces energy.
#     • Values: true / false
#     • Default: true
#
#   energy.generator.energy_per_fuel
#     • Description: How much energy (EU/tick) one unit of fuel gives.
#       E.g. 100 — coal gives 100 EU per burning tick.
#       The higher the number, the faster energy accumulates.
#     • Values: any integer ≥ 1
#     • Default: 100
#
#   energy.generator.fuel_burn_ticks
#     • Description: How many ticks (1 tick = 0.05 sec) 1 unit of fuel burns.
#       100 ticks = 5 seconds.
#       Affects how often you need to add fuel.
#     • Values: any integer ≥ 1
#     • Default: 100
#
#   energy.generator.log
#     • Description: Log generator operation to console.
#       Useful for debugging, but clutters the console on big servers.
#     • Values: true / false
#     • Default: false
#
#   ────────────────────────────────────────────────────────────────
#   1.2. energy.electric_furnace — ELECTRIC FURNACE
#   ────────────────────────────────────────────────────────────────
#
#   energy.electric_furnace.enabled
#     • Description: Enables the electric furnace — smelts ore for energy
#       instead of fuel. Works faster than a regular furnace.
#     • Values: true / false
#     • Default: true
#
#   energy.electric_furnace.energy_per_smelt
#     • Description: How much energy ONE smelt operation costs.
#       Example: 100 — smelting one iron ore costs 100 EU.
#     • Values: any integer ≥ 1
#     • Default: 100
#
#   energy.electric_furnace.cooldown_ms
#     • Description: Cooldown between smelts in milliseconds.
#       1000 ms = 1 second.
#       Protects against too-fast smelting (can cause lag).
#     • Values: any integer ≥ 0
#     • Default: 1000
#
#   ────────────────────────────────────────────────────────────────
#   1.3. energy.cable — POWER CABLES
#   ────────────────────────────────────────────────────────────────
#
#   energy.cable.enabled
#     • Description: Enables cables — connect generators, batteries and
#       consumers into one network. Without cables energy does not flow.
#     • Values: true / false
#     • Default: true
#
#   energy.cable.max_energy
#     • Description: Max energy a SINGLE cable can store.
#       0 — the cable does NOT store energy (only transfers it).
#       If set > 0, the cable acts as a mini-battery.
#     • Values: 0 or any integer ≥ 1
#     • Default: 0
#
#   energy.cable.log
#     • Description: Log energy transfer.
#     • Values: true / false
#     • Default: false
#
#   energy.cable.blink.enabled
#     • Description: Cable blinking while transferring energy (visual effect).
#       The cable changes its block state during transfer — looks like a pulse.
#     • Values: true / false
#     • Default: true
#
#   energy.cable.blink.off_ticks
#     • Description: How many ticks the cable stays in the "off" state
#       while blinking. Lower = faster flicker.
#     • Values: any integer ≥ 1
#     • Default: 10
#
#   energy.cable.blink.on_ticks
#     • Description: How many ticks the cable stays in the "on" state
#       while blinking.
#     • Values: any integer ≥ 1
#     • Default: 10
#
#   ────────────────────────────────────────────────────────────────
#   1.4. energy.battery — BATTERY
#   ────────────────────────────────────────────────────────────────
#
#   energy.battery.max_energy
#     • Description: Max energy storage of ONE battery.
#       100000 = 100k EU. When full, the battery stops accepting energy.
#     • Values: any integer ≥ 1
#     • Default: 100000
#
#   energy.battery.discharge_per_tick
#     • Description: How much energy the battery feeds into the network
#       PER TICK when receiving a redstone signal. 10 — slow discharge,
#       1000 — instant output. If 0 — the battery never discharges.
#     • Values: any integer ≥ 0
#     • Default: 10
#
#   energy.battery.smooth_charge.enabled
#     • Description: Smooth dynamic charging.
#       Instead of instant refill, energy arrives gradually.
#       Looks nicer and feels more realistic.
#     • Values: true / false
#     • Default: true
#
#   energy.battery.smooth_charge.charge_multiplier
#     • Description: Charge speed multiplier in smooth mode.
#       2.0 — twice as fast as the standard speed.
#       0.5 — twice as slow.
#     • Values: any decimal ≥ 0.1
#     • Default: 2.0
#
#   energy.battery.smooth_charge.discharge_multiplier
#     • Description: Discharge speed multiplier in smooth mode.
#     • Values: any decimal ≥ 0.1
#     • Default: 0.5
#
#   energy.battery.visual.particles_enabled
#     • Description: Electricity particles around the battery while
#       charging/discharging. May lag with many batteries.
#     • Values: true / false
#     • Default: true
#
#   ────────────────────────────────────────────────────────────────
#   1.5. energy.battery_drain — LEGACY BATTERY DRAIN
#   ────────────────────────────────────────────────────────────────
#
#   energy.battery_drain.enabled
#     • Description: Legacy mechanic. Use smooth_charge instead.
#       Kept for backwards compatibility.
#     • Values: true / false
#     • Default: true
#
#   energy.battery_drain.transfer_per_tick
#     • Description: How much energy is transferred per tick.
#     • Values: any integer ≥ 1
#     • Default: 5
#
#   energy.battery_drain.log
#     • Description: Log discharging.
#     • Values: true / false
#     • Default: false
#
#   ────────────────────────────────────────────────────────────────
#   1.6. energy.balancer — ENERGY BALANCER
#   ────────────────────────────────────────────────────────────────
#
#   energy.balancer.enabled
#     • Description: The balancer distributes energy evenly between all
#       consumers in the network. Without it, energy goes to the first
#       connected consumer and the rest may starve.
#     • Values: true / false
#     • Default: true
#
#   energy.balancer.include_batteries
#     • Description: Include batteries in balancing.
#       If false — batteries charge first, the remainder goes to
#       consumers. If true — energy is split evenly between
#       batteries and consumers.
#     • Values: true / false
#     • Default: false
#
#   energy.balancer.max_transfer
#     • Description: Max energy the balancer can redistribute per tick.
#       25 — soft cap. 0 — unlimited (may lag).
#     • Values: any integer ≥ 0
#     • Default: 25
#
#   energy.balancer.log
#     • Description: Log balancer activity.
#     • Values: true / false
#     • Default: false
#
#   ────────────────────────────────────────────────────────────────
#   1.7. energy_crafting — ENERGY FOR CRAFTING
#   ────────────────────────────────────────────────────────────────
#
#   energy_crafting.enabled
#     • Description: Some custom recipes require energy.
#       If disabled — recipes are free (but may stop working).
#     • Values: true / false
#     • Default: true
#
#   energy_crafting.energy_per_craft
#     • Description: How much energy one craft costs.
#       100 — one custom craft costs 100 EU.
#     • Values: any integer ≥ 1
#     • Default: 100
#
#   energy_crafting.workbench_search_radius
#     • Description: Search radius for an energy network around the
#       workbench (in blocks). 3 — looks for energy sources within 3 blocks.
#     • Values: any integer ≥ 1
#     • Default: 3
#
#
# ╔══════════════════════════════════════════════════════════════════╗
# ║                                                                  ║
# ║   2. 💻 CODE PANEL SYSTEM (codepanel)                           ║
# ║                                                                  ║
# ╚══════════════════════════════════════════════════════════════════╝
#
#   The code panel is a dialog window (Custom Screen) for entering a code/password.
#   Opened via /ui codepane. Has a numeric keypad, an input screen,
#   and «←», «✔ Confirm» and «✖ Cancel» buttons.
#
#   codepanel.max_length
#     • Description: Maximum length of the entered code (in characters).
#     • Values: any integer from 1 to 20
#     • Default: 10
#
#   codepanel.enter_cooldown
#     • Description: Cooldown between Confirm button presses (in seconds).
#       Protects against spamming code attempts.
#     • Values: any integer ≥ 0
#     • Default: 3
#
#   codepanel.sounds
#     • Description: Sounds for different panel actions.
#     • digit:      digit key press sound
#     • backspace:  character delete sound
#     • enter:      Confirm press sound
#     • success:    correct code sound
#     • fail:       wrong code sound
#     • Values: Minecraft sound names (see https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Sound.html)
#       E.g. UI_BUTTON_CLICK, BLOCK_NOTE_BLOCK_PLING, ENTITY_PLAYER_LEVELUP
#
#
# ╔══════════════════════════════════════════════════════════════════╗
# ║                                                                  ║
# ║   3. ⚛ DARK SYNTHESIS REACTOR (reactor)                        ║
# ║                                                                  ║
# ╚══════════════════════════════════════════════════════════════════╝
#
#   The reactor is a complex mechanic with temperature, pressure, wear
#   and the possibility of an explosion (meltdown). Requires cooling and monitoring.
#
#   reactor.enabled
#     • Description: Enables the reactor. If disabled — the reactor block
#       does not work (but does not disappear from the world).
#     • Values: true / false
#     • Default: true
#
#   reactor.temp_decay_rate
#     • Description: Core temperature natural decay rate (per tick).
#       1 — cools slowly. Higher — cools faster.
#     • Values: any integer ≥ 0
#     • Default: 1
#
#   reactor.core_temp_max
#     • Description: Maximum core temperature (in degrees).
#       6000 — above this, shell destruction begins.
#     • Values: any integer
#     • Default: 6000
#
#   reactor.core_temp_min
#     • Description: Minimum core temperature.
#       -272 — near absolute zero.
#     • Values: any integer
#     • Default: -272
#
#   reactor.core_temp_cool_min
#     • Description: Minimum temperature the core can be cooled to
#       by cooling systems.
#     • Values: any integer
#     • Default: -270
#
#   reactor.heat_rate
#     • Description: Core heating rate while working (per tick).
#       3 — slow heating. 10 — fast heating.
#     • Values: any integer ≥ 0
#     • Default: 3
#
#   reactor.cool_rate
#     • Description: Core cooling rate via cooling systems (per tick).
#       3 — slow cooling. Higher — more efficient cooling.
#     • Values: any integer ≥ 0
#     • Default: 3
#
#   reactor.core_press_reduce_rate
#     • Description: Core pressure reduction rate (per tick).
#       1 — slow. Higher — pressure drops faster.
#     • Values: any integer ≥ 0
#     • Default: 1
#
#   reactor.case_temp_heat_rate
#     • Description: Reactor CASE heating rate from the core (per tick).
#       2 — the case heats slower than the core.
#     • Values: any integer ≥ 0
#     • Default: 2
#
#   reactor.case_temp_max
#     • Description: Maximum case temperature.
#       8000 — above this the case starts to break.
#     • Values: any integer
#     • Default: 8000
#
#   reactor.case_temp_cool_rate
#     • Description: Case cooling rate (per tick).
#     • Values: any integer ≥ 0
#     • Default: 2
#
#   reactor.case_temp_cool_min
#     • Description: Minimum case temperature.
#     • Values: any integer
#     • Default: -271
#
#   reactor.case_temp_decay_rate
#     • Description: Case temperature natural decay rate (per tick).
#     • Values: any integer ≥ 0
#     • Default: 1
#
#   reactor.case_press_heat_rate
#     • Description: Case pressure growth rate from temperature (per tick).
#     • Values: any integer ≥ 0
#     • Default: 4
#
#   reactor.case_press_max
#     • Description: Maximum case pressure.
#       10000 — above this the case breaks.
#     • Values: any integer ≥ 0
#     • Default: 10000
#
#   reactor.case_press_decay_rate
#     • Description: Case pressure decay rate (per tick).
#     • Values: any integer ≥ 0
#     • Default: 1
#
#   reactor.shell_integrity_decay_temp
#     • Description: Core temperature AT WHICH the core shell starts
#       to break. Above this temperature the shell loses integrity.
#     • Values: any integer
#     • Default: 5000
#
#   reactor.shell_int_decay_rate
#     • Description: Shell destruction rate when above the temperature
#       (integrity units per tick).
#     • Values: any integer ≥ 0
#     • Default: 1
#
#   reactor.shell_int_recovery_temp_max
#     • Description: Temperature BELOW which the shell starts to recover.
#     • Values: any integer
#     • Default: 4999
#
#   reactor.shell_int_recovery_rate
#     • Description: Shell recovery rate (per tick).
#     • Values: any integer ≥ 0
#     • Default: 1
#
#   reactor.case_integrity_decay_press
#     • Description: Pressure at which the case starts losing integrity.
#     • Values: any integer
#     • Default: 7000
#
#   reactor.case_integrity_decay_temp
#     • Description: Case temperature at which it loses integrity.
#     • Values: any integer
#     • Default: 7000
#
#   reactor.case_int_decay_press_rate
#     • Description: Case destruction rate from pressure (per tick).
#     • Values: any integer ≥ 0
#     • Default: 1
#
#   reactor.case_int_decay_temp_rate
#     • Description: Case destruction rate from temperature (per tick).
#     • Values: any integer ≥ 0
#     • Default: 1
#
#   reactor.case_int_recovery_press_max
#     • Description: Pressure BELOW which the case recovers.
#     • Values: any integer
#     • Default: 7000
#
#   reactor.case_int_recovery_temp_max
#     • Description: Temperature BELOW which the case recovers.
#     • Values: any integer
#     • Default: 4999
#
#   reactor.case_int_recovery_rate
#     • Description: Case integrity recovery rate (per tick).
#     • Values: any integer ≥ 0
#     • Default: 1
#
#   reactor.wear.enabled
#     • Description: Enables the reactor wear system.
#       Over time the reactor wears out and requires maintenance.
#       If disabled — the reactor runs forever without maintenance.
#     • Values: true / false
#     • Default: true
#
#   reactor.wear.interval_normal
#     • Description: Interval between wear checks in normal mode
#       (in ticks). 1200 ticks = 1 minute.
#     • Values: any integer ≥ 1
#     • Default: 1200
#
#   reactor.wear.interval_degradation
#     • Description: Wear check interval in degradation mode
#       (when the reactor overheats). 20 ticks = 1 second.
#     • Values: any integer ≥ 1
#     • Default: 20
#
#   reactor.wear.chat_countdown
#     • Description: How many seconds before meltdown to start warning
#       in chat. 30 = writes "WARNING!" 30 seconds before the explosion.
#     • Values: any integer ≥ 0
#     • Default: 30
#
#   reactor.wear.final_meltdown_start_at
#     • Description: Integrity level at which the final countdown
#       to meltdown starts (irreversible destruction). 11 — starts at 11% integrity.
#     • Values: any integer ≥ 0
#     • Default: 11
#
#   reactor.wear.final_meltdown_duration
#     • Description: Duration of the final countdown to the explosion (seconds).
#       10 — the reactor explodes 10 seconds after the final countdown starts.
#     • Values: any integer ≥ 1
#     • Default: 10
#
#   reactor.meltdown_explosion_radius
#     • Description: Reactor explosion radius on meltdown (in blocks).
#       10 — destroys everything within 10 blocks. 0 — disable the explosion.
#     • Values: any integer ≥ 0
#     • Default: 10
#
#   reactor.recipe_time_max
#     • Description: Maximum recipe execution time in the reactor
#       (in ticks). 100 ticks = 5 seconds.
#     • Values: any integer ≥ 1
#     • Default: 100
#
#
