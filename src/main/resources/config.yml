# ║   7. ☢ RADIATION                                               ║
# ║                                                                  ║
# ╚══════════════════════════════════════════════════════════════════╝
#
#   radiation.enabled
#     • Description: Enables the radiation system. Players receive radiation
#       from ancient debris, basalt deltas, the End, the reactor, etc.
#       High radiation applies effects (nausea, weakness, damage).
#     • Values: true / false
#     • Default: true
#
#   radiation.natural_decay
#     • Description: Natural radiation decay per tick (in units).
#       1 — very slow. 100 — radiation fades quickly.
#     • Values: any integer ≥ 0
#     • Default: 1
#
#   radiation.effects_enabled
#     • Description: Whether to apply effects (nausea, damage) at high radiation.
#       If false — radiation accumulates but does not harm the player.
#     • Values: true / false
#     • Default: true
#
#   radiation.ancient_debris_radiation
#     • Description: Radiation from ancient debris (per tick nearby).
#       2 — weak radiation near debris.
#     • Values: any integer ≥ 0
#     • Default: 2
#
#   radiation.basalt_deltas_radiation
#     • Description: Radiation in basalt deltas (per tick).
#     • Values: any integer ≥ 0
#     • Default: 2
#
#   radiation.end_radiation
#     • Description: Background radiation in the End.
#     • Values: any integer ≥ 0
#     • Default: 2
#
#   radiation.lead_shield_reduction
#     • Description: How many units a lead shield reduces radiation per tick.
#       2 — weak protection. 20 — good protection.
#     • Values: any integer ≥ 0
#     • Default: 2
#
#   radiation.antirad_reduction
#     • Description: How much antirad (medicine) reduces radiation.
#       100 — one pill removes 100 units.
#     • Values: any integer ≥ 0
#     • Default: 100
#
#   radiation.kill_reduction
#     • Description: How much killing a mob reduces radiation.
#       100 — killed a mob = -100 radiation.
#     • Values: any integer ≥ 0
#     • Default: 100
#
#   radiation.death_reset
#     • Description: Whether to reset radiation on player death.
#       true — died = radiation 0. false — radiation persists.
#     • Values: true / false
#     • Default: true
#
#   radiation.mace_use_radiation
#     • Description: Radiation from using a mace (per hit).
#     • Values: any integer ≥ 0
#     • Default: 50
#
#   radiation.trident_use_radiation
#     • Description: Radiation from throwing a trident.
#     • Values: any integer ≥ 0
#     • Default: 50
#
#   radiation.elytra_use_radiation
#     • Description: Radiation from flying with elytra (per tick).
#     • Values: any integer ≥ 0
#     • Default: 50
#
#   radiation.reactor_core_radiation
#     • Description: Radiation near the reactor core.
#     • Values: any integer ≥ 0
#     • Default: 10
#
#   radiation.reactor_pressure_radiation
#     • Description: Radiation from reactor pressure.
#     • Values: any integer ≥ 0
#     • Default: 600
#
#   radiation.reactor_meltdown_close
#     • Description: Radiation close to a meltdown site.
#     • Values: any integer ≥ 0
#     • Default: 6400
#
#   radiation.reactor_meltdown_far
#     • Description: Radiation far from a meltdown site.
#     • Values: any integer ≥ 0
#     • Default: 3200
