#       [75, 50, 25, 10, 5] — at 75%, 50%, 25%, 10%, 5%
#
#   features.integrity.unbreaking.enabled
#     • Description: Whether to account for the Unbreaking enchant (slows wear).
#     • Values: true/false
#
#   features.integrity.piercing
#     • Description: The Piercing enchant speeds up the target's wear.
#     • enabled: true
#     • extra_integrity_cost: extra integrity cost (0.5 = +50%)
#
#   features.integrity.blacklist / whitelist
#     • Description: Material lists for which the integrity system
#       does NOT work (blacklist) or works ONLY (whitelist).
#       If whitelist is non-empty — the system works ONLY on those materials.
#       [] — empty list = works on all materials.
#     • Example blacklist: ["BOW", "CROSSBOW", "FISHING_ROD"]
#     • Example whitelist: ["DIAMOND_SWORD", "NETHERITE_SWORD"]
