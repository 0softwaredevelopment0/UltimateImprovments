#     • enabled: whether repair is allowed (true)
#     • integrity_multiplier: how much integrity is restored per repair
#       (0.25 = +25% integrity per level)
#     • combine_enabled: whether items can be combined for repair (true)
#     • combine_bonus: integrity bonus for combining (0.1)
#     • material_craft.enabled: repair with materials (true)
#     • material_craft.integrity_per_material: +10% per material
#
#   features.integrity.mending_xp
#     • Description: Integrity restoration via XP.
#     • enabled: whether XP repair is allowed (true)
#     • integrity_multiplier: how much integrity per 1 XP (0.5)
#
#   features.integrity.combine
#     • Description: Combining two identical items.
#     • enabled: whether combining is allowed (true)
#     • loss_rate: combining loss (0.0 = no loss)
#
#   features.integrity.xp_integrity
#     • Description: XP-to-integrity conversion (at the enchanting table).
#     • enabled: whether allowed (true)
#     • integrity_per_xp: +0.1% integrity per 1 XP
#
#   features.integrity.low_integrity_warning
#     • Description: Warnings at low integrity.
#     • enabled: on (true)
