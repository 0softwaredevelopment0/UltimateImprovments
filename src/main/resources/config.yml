# ══════════════════════════════════════════════════════════════
# Override Join Messages (OJM) feature
# Use the <player> placeholder here to show player's nick
# Enable/disable this feature
ojm:
  enabled: false
  # Join message
  join: "<white>[<green>+<white>] <player> <green>joined the game"
  # Leave message
  leave: "<white>[<red>-<white>] <player> <red>left the game"

# ══════════════════════════════════════════════════════════════
# 🚀 SPACE DIMENSION
# ══════════════════════════════════════════════════════════════
# Empty void dimension with gravity, radiation, and oxygen mechanics.
# Players enter via rocket item (craftable) or /ui space command.
space:
  # Master toggle: enable/disable the space dimension
  enabled: true
  # Debug logging: verbose space logs in console (gravity, teleport, etc.)
  debug: false
  # Cooldown between teleports, in ticks (100 = 5 seconds)
  teleport_cooldown_ticks: 100
  # Rocket right-click launch delay, in ticks (60 = 3 seconds)
  rocket_launch_delay_ticks: 60
  # Gravity attribute value in space (default MC gravity is 0.08)
  gravity: 0.01
  # Oxygen: damage per second to entities without helmet
  oxygen_damage_per_second: 1
  # Meteor integration: meteors only spawn in the space dimension
  meteor_space_only: true
  # Worlds FROM which players can auto-enter space (elytra, /tp, etc.)
  # Return teleport always uses the saved overworld position in DB.
  space_entry_worlds:
    - "world"