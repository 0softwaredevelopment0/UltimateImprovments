# =========================
# 🎲 RTP — random teleport
# =========================
# Disabled by default (on a vanilla server /rtp is a cheat).
# All parameters are configurable for maximum flexibility.
rtp:
  enabled: false

  # Cooldown between uses (sec). 0 = no cooldown.
  cooldown_seconds: 60

  # Maximum attempts to find a safe spot
  max_attempts: 50

  # Teleport radius from spawn (0,0)
  radius:
    min: 500
    max: 10000

  # Area shape: "square" or "circle"
  shape: "square"

  # Worlds where RTP is allowed. Empty list = all worlds.
  worlds:
    - "world"

  # Height limits (Y-coordinate)
  height:
    min: 0
    max: 255

  # Safe-spot search radius (checks neighboring blocks)
  safe_search_radius: 5

  # ⛔ Blocks to NOT teleport onto
  avoid_blocks:
    - "MAGMA_BLOCK"
    - "CACTUS"
    - "FIRE"
    - "SWEET_BERRY_BUSH"
    - "POWDER_SNOW"
    - "CAMPFIRE"
    - "SOUL_CAMPFIRE"
    - "BEDROCK"
    - "WITHER_ROSE"
    - "POINTED_DRIPSTONE"

  # ✅ Teleport only onto these blocks (empty = any solid block)
  # Handy for ultra-vanilla: grass_block, stone, sand, gravel
  only_surface: []

  # Situations to avoid
  avoid:
    # Avoid liquids (lava, water) underfoot
    liquid: true

    # Avoid void underfoot (Y < world min height)
    void: true

# =========================
# 📍 NEAR — find nearby players
# =========================
# Disabled by default (on a vanilla server /near is a cheat).
# Enable it on servers where it is appropriate.
near:
  enabled: false

  # Maximum search radius (configurable limit)
  max_radius: 128

# =========================
# ☄️ METEOR — meteor shower
# =========================
# Disabled by default (on a vanilla server it is visual cheat/atmosphere).
# Only works in the configured world, falls near players.
meteor:
  enabled: false

  # World where meteors fall
  world: "world"

  # Interval between meteor showers (minutes, random min..max)
  interval:
    min: 30
    max: 90

  # How many meteors to spawn per shower
  count_per_spawn: 1

  # Spawn radius around the player (blocks)
  spawn_radius:
    min: 30
    max: 120

  # Surface-search height limits
  height:
    min: -64
    max: 320

  # Fall animation duration (ticks, 20 = 1 sec)
  fall_duration_ticks: 60

  # Sphere radius of blocks around the meteor center
  sphere_radius:
    min: 1.0
    max: 3.0

  # Sphere radius of blocks (int, 1-5)
  sphere_radius: 2

  # Blocks for the meteor shell
  display_blocks:
    - "CRACKED_DEEPSLATE_BRICKS"
    - "CRACKED_DEEPSLATE_TILES"
    - "CHISELED_DEEPSLATE"
    - "MAGMA_BLOCK"

  # Central ores with chances (weighted random)
  # Default: all deepslate ores with equal chance 1.0
  core_ores:
    DEEPSLATE_DIAMOND_ORE: 1.0
    DEEPSLATE_IRON_ORE: 1.0
    DEEPSLATE_GOLD_ORE: 1.0
    DEEPSLATE_EMERALD_ORE: 1.0
    DEEPSLATE_LAPIS_ORE: 1.0
    DEEPSLATE_REDSTONE_ORE: 1.0
    DEEPSLATE_COAL_ORE: 1.0
    DEEPSLATE_COPPER_ORE: 1.0

  # Old parameters explosion_radius and ore_block are no longer used.
  # Explosion: sphere_radius x 10, blocks from display_blocks + core_ores.

particle_accelerator:
  enabled: true

  collision_recipes:
    # Format: materialA + materialB at speedMin%-speedMax% speed → result
    # speedPct = particle.speed / MAX_SPEED * 100 (0..100%)
    # Materials are specified by Material.name() (see Bukkit Material)
    - material_a: GOLD_INGOT
      material_b: DIAMOND
      speed_min_pct: 5.0
      speed_max_pct: 10.0
      result: EMERALD
    - material_a: DIAMOND
      material_b: EMERALD
      speed_min_pct: 10.0
      speed_max_pct: 15.0
      result: NETHERITE_SCRAP

# =========================
# 🧊 BLOCK FRICTION — configurable block friction
# =========================
# Value: friction coefficient (slipperiness).
#   0.600 = normal dirt/stone (DEFAULT)
#   0.989 = blue ice — almost no friction
#   0.980 = ice / packed ice
#   0.800 = slime / honey
#   0.500 = slowdown (cobweb-like)
#
# 💡 Values > 1.0 = EXPONENTIAL SPEED-UP!
#   The higher the value, the faster the acceleration each tick.
#   Example: 1.1 = slow acceleration, 10000 = instant boost.
#
# Works via PlayerMoveEvent → velocity correction.
block_friction:
  BLUE_ICE: 0.989

# =========================
# 🛡 PROTECTION BLOCK — a physical block
# that protects the area around it.
# Crafting is registered via data-pack + datapack recipe.
# Given to admins via /ui protection give <player>.
# =========================
protection:
  # Whether the whole protection-block module is enabled
  enabled: true

  # Visual material of the placed protection block.
  # Any solid block works (LODESTONE / BEACON / NETHERITE_BLOCK etc.)
  block:
    material: "LODESTONE"

  # Protection radius
  radius:
    # Starting radius on first placement
    default: 5
    # Minimum allowed (for DB validation)
    min: 1
    # Maximum achievable through point upgrades
    max: 64

  # Block integrity (damage from actions and explosions)
  integrity:
    # Starting integrity on placement (0..100)
    starting_value: 100.0
    # How many % of integrity is lost per attempt to break a protected block
    loss_per_break_attempt: 0.1
    # How many % of integrity is lost per block that tried to explode
    # inside the radius (TNT, creepers, end crystals etc.)
    loss_per_explosion_block: 0.1

  # Point costs and how points are earned
  points:
    # Multiplier converting «burn-ticks» (furnace value) into points.
    # Example: coal (1600 burn ticks) × 0.1 = 160 points per coal.
    fuel_multiplier: 0.1
    # Base cost of the first radius upgrade. Every next one × 2.
    radius_upgrade_base_cost: 1
    # Base cost of the first integrity repair. Every next one × 2.
    repair_base_cost: 1

  # Crafting restrictions
  crafting:
    # Allow crafting in a normal workbench (default false — recipe visible, not craftable)
    workbench_allowed: false
    # Allow crafting in the Crafter (Paper 1.21+ multi-block)
    crafter_allowed: true

  # Admin commands
  admin:
    # Allow /ui protection give <player>
    give_allowed: true

# ─────────────────────────────────────────────────────────────────────────────
# 🎭 TROLL — fake commands to troll hackers
# /forceop — tells the player the server granted them OP (it actually does NOT)
# /crash   — tells the player the server crashed, and after delay_seconds
#            kicks them with the kick_message text (default "Server closed")
# Messages support MiniMessage (<red>, <bold>, <gold> etc.),
# the %player% placeholder is available in /forceop.
# ─────────────────────────────────────────────────────────────────────────────
troll:
  # Global toggle for all fake commands
  enabled: true

  forceop:
    # Enable /forceop
    enabled: true
    # Permission to use (empty = available to everyone)
    permission: ""
    # Messages to the player — look like the server's OP grant response
    messages:
      - "<white>[<gold>Server</gold>] Made <aqua>%player%</aqua> a server operator</white>"
      - "<green>✔ You are now a server operator!</green>"
    # ActionBar message (empty = don't show)
    actionbar: "<gold>⚡ You are now OP!</gold>"
    # Sound on use (empty = no sound)
    sound: "ENTITY_EXPERIENCE_ORB_PICKUP"
    # Log command usage to the console
    log_to_console: true

  crash:
    # Enable /crash
    enabled: true
    # Permission to use (empty = available to everyone)
    permission: ""
    # Messages to the player before the kick — imitate a server crash
    messages:
      - "<dark_red><bold>⚠ SERVER ERROR</bold></dark_red>"
      - "<gray>java.lang.OutOfMemoryError: Java heap space</gray>"
      - "<gray>    at net.minecraft.server.MinecraftServer.run(MinecraftServer.java:932)</gray>"
      - "<dark_gray>[<red>Server closed</red>]</dark_gray>"
    # Delay before the kick (seconds)
    delay_seconds: 2
    # Kick text — shown on the disconnect screen
    kick_message: "Server closed"
    # Звук при использовании (пусто = без звука)
    sound: "ENTITY_GENERIC_EXPLODE"
    # Логировать использование команды в консоль
    log_to_console: true

plugin_version: "1.8.128"

