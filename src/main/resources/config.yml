# ║                                                                  ║
# ║   30. 📡 WIRELESS REDSTONE (wireless_redstone)                  ║
# ║                                                                  ║
# ╚══════════════════════════════════════════════════════════════════╝
#
#   wireless_redstone.enabled
#     • Description: Wireless redstone signal transfer between blocks.
#       Lets you link redstone lamps, observers, pistons, dispensers
#       and redstone dust WITHOUT wires.
#       One block can be linked to SEVERAL others (one-to-many).
#     • Values: true / false
#     • Default: true
#
#   Usage:
#     1. Shift+RMB on the first device → "Binding" in the actionbar
#     2. Shift+RMB on the second device → linked!
#     3. Repeat with a third → all three linked (one-to-many)
#     4. Shift+RMB on a device with existing links →
#        shows the link count and allows adding more
#     5. Shift+RMB on the same block twice → cancel binding
#     6. Break a device → all its links are removed
#
#   Supported blocks:
#     - REDSTONE_LAMP (lamp)
#     - OBSERVER (observer)
#     - PISTON / STICKY_PISTON (piston)
#     - DISPENSER / DROPPER (dispenser)
#     - REDSTONE_WIRE (redstone dust)
#
#   Cascade activation:
#     Lamp A → (wireless) → Lamp B → (wireless) → Lamp C.
#     When A turns on, B and C turn on automatically (cycle-protected).
#
#   Note: Links are stored in the DB (table wireless_links) and persist
#   across server restarts. Chunks with linked blocks are kept
#   loaded via plugin chunk tickets.
#
#
