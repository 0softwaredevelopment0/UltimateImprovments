# ║   28. 💬 CUSTOM CHAT (chat)                                     ║
# ║                                                                  ║
# ╚══════════════════════════════════════════════════════════════════╝
#
#   chat.enabled
#     • Description: Custom chat. Replaces the vanilla chat with a formatted
#       one supporting MiniMessage, placeholders and group formats.
#     • Values: true / false
#     • Default: true
#
#   chat.mode
#     • Description: Chat operation mode.
#     • static:     one format for everyone (from chat.format)
#     • per-group:  different formats per group (from chat.groups.formats)
#                   Determined via the {group} placeholder (LuckPerms)
#     • per-world:  different formats per world (from chat.worlds)
#     • Default: "static"
#
#   chat.format
#     • Description: Chat message format (for static mode).
#       MiniMessage + placeholders + {message} (message text).
#       Example: "<gray>{player_name}</gray>: <white>{message}</white>"
#     • Default: "<green>ᴄʜᴀᴛ <dark_gray>» <white>{player_name}<gray>: <white>{message}"
#
#   chat.player_minimessage
#     • Description: Whether to allow players to use MiniMessage tags
#       in their messages (colors, gradients, etc.).
#       WARNING: if true — players can use any colors.
#     • Values: true / false
#     • Default: true
#
#   chat.message_placeholders
#     • Description: Whether to allow placeholders in player message text.
#       If true — {online} in a player's message is replaced with the online count.
#     • Values: true / false
#     • Default: true
#
#   chat.bypass_permission
#     • Description: Permission for a full custom-chat bypass.
#       Players with this permission can write in the vanilla chat (if needed).
#       Empty string "" — nobody has the bypass.
#     • Default: ""
#
#   chat.groups.default
#     • Description: Default chat format (for groups not in formats).
#       Used when a player matches no group.
#     • Default: "<gray>[<white>{player_name}</white>]</gray> <white>{message}</white>"
#
#   chat.groups.formats.<group>
#     • Description: Formats for specific LuckPerms groups.
#       Key = group name (from LuckPerms), value = format.
#       Example:
#         admin: "<red>[Admin]</red> <white>{player_name}</white>: <red>{message}</red>"
#         vip: "<gold>[VIP]</gold> <white>{player_name}</white>: <gold>{message}</gold>"
#         default: "<gray>{player_name}</gray>: <white>{message}</white>"
#
#   chat.worlds.<world>
#     • Description: Formats per world (if mode = per-world).
#       Key = world name, value = format.
#       Example:
#         world: "<green>{player_name}</green>: <white>{message}</white>"
#         world_nether: "<red>{player_name}</red>: <white>{message}</white>"
#         world_the_end: "<dark_purple>{player_name}</dark_purple>: <white>{message}</white>"
#
#
