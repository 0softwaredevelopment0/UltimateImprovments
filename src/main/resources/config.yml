# ╚══════════════════════════════════════════════════════════════════╝
#
#   motd.enabled
#     • Description: Custom server MOTD (message of the day).
#       Shown in the server list. Supports MiniMessage.
#     • Values: true / false
#     • Default: true
#
#   motd.line1 / motd.line2
#     • Description: First and second MOTD line in MiniMessage format.
#       Supported placeholders: {online}, {max_players}, {tps},
#       {uptime}, {server_name}.
#       {player_name} does NOT work — MOTD has no player context.
#     • Gradient examples: "<gradient:#00AAFF:#FF55FF>Text</gradient>"
#     • Default: dynamic strings
#
#   motd.icon_enabled
#     • Description: Whether to show the server icon (server-icon.png).
#       If true — the plugin uses server-icon.png from the server folder.
#     • Values: true / false
#     • Default: true
#
#   motd.player_list.enabled
#     • Description: Custom player list in the MOTD.
#       Shows the given lines instead of the real player list.
#       Used to display "advertising" or hide the online count.
#     • Values: true / false
#     • Default: false
#
#   motd.player_list.lines
#     • Description: Lines shown in the player list (up to 2 lines).
#       Each line is MiniMessage.
#
#   motd.online_counter
#     • Description: Online-counter management in the server list.
#       Allows showing a FAKE online count (to attract players).
#     • current_online.mode: normal/fake — fake shows a substituted number
#     • current_online.value: base value for the fake online
#     • current_online.scale: multiplier
#     • current_online.percent: percentage
#     • current_online.add: addition
#     • current_online.min/max: minimum and maximum value
#     • current_online.update_interval_ticks: update interval
#     • max_online: max-online settings (same structure)
