#       the break % is shown in the actionbar after each click.
#     • Values: true / false
#     • Default: true
#
#   features.unbreakable_breaker.blocks.<MATERIAL>:
#     • Each block type (BEDROCK, BARRIER) is configured separately.
#     • enabled: whether this type can be broken
#     • max_damage: how many "hits" are needed to break it
#     • min_tool_tier: min tool tier ("-" = any)
#     • require_haste: whether Haste II+ is required
#     • drop_block: whether the block drops when broken
#     • break_naturally: whether it breaks naturally (no particles/sounds)
#     • play_effects: whether to play effects/particles
#     • damage.<pickaxe_type>: damage per hit with a specific pickaxe
#     • efficiency_multiplier: Efficiency multiplier
#     • haste_multiplier: Haste multiplier
#
#   Example for BEDROCK:
#     damage:
#       netherite_pickaxe: 4.0    — 4 dmg per hit (25 hits)
#       diamond_pickaxe: 2.5
#       default: 0.3              — 0.3 dmg (334 bare-hand hits)
