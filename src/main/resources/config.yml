# ║   4. ⚙ CUSTOM FEATURES (features.*)                             ║
# ║                                                                  ║
# ╚══════════════════════════════════════════════════════════════════╝
#
#   ────────────────────────────────────────────────────────────────
#   4.1. features.antimatter — ANTIMATTER
#   ────────────────────────────────────────────────────────────────
#
#   features.antimatter.enabled
#     • Description: Enables crafting and using antimatter.
#       Antimatter is a powerful explosive item.
#     • Values: true / false
#     • Default: true
#
#   features.antimatter.explosion_radius
#     • Description: Antimatter explosion radius (in blocks).
#       5 — a standard creeper. 50 — will wipe half the server.
#     • Values: any decimal ≥ 0
#     • Default: 5
#
#   features.antimatter.break_blocks
#     • Description: Whether the explosion breaks blocks.
#       false — only damages players and entities, blocks stay intact.
#     • Values: true / false
#     • Default: true
#
#   features.antimatter.set_fire
#     • Description: Whether the explosion ignites fire.
#     • Values: true / false
#     • Default: true
#
#   ────────────────────────────────────────────────────────────────
#   4.2. features.attributes — PLAYER ATTRIBUTES
#   ────────────────────────────────────────────────────────────────
#
#   features.attributes.enabled
#     • Description: Enables custom player attributes (stats system).
#       Allows changing attack speed, hand damage, sneak speed.
#     • Values: true / false
#     • Default: true
#
#   features.attributes.attack_damage
#     • Description: Base bare-hand attack damage (in hearts).
#       0.1 — almost nothing. 1.0 — standard damage.
#       Works ONLY with an empty hand (no weapon).
#     • Values: any decimal ≥ 0
#     • Default: 0.1
#
#   features.attributes.sneak_speed
#     • Description: Sneak movement speed.
#       1.0 — standard sneak speed.
#       8192 — extremely slow (near full stop).
#     • Values: any decimal ≥ 0
#     • Default: 1.0
#
#   features.attributes.attack_speed
#     • Description: Attack speed (4.0 = standard vanilla).
#       3.5 — slightly slower than standard. 6.0 — faster.
#     • Values: any decimal ≥ 0
#     • Default: 3.5
#
#   features.attributes.interval_ticks
#     • Description: Interval of applying attribute effects (in ticks).
#       200 ticks = 10 seconds. Lower — applied more often (more load).
#     • Values: any integer ≥ 1
#     • Default: 200
#
#   ────────────────────────────────────────────────────────────────
#   4.3. features.beacon — TRAP BEACON
#   ────────────────────────────────────────────────────────────────
#
#   features.beacon.enabled
#     • Description: Enables the trap-beacon mechanic.
#       When activated, applies effects to players (blindness, glowing).
#     • Values: true / false
#     • Default: true
#
#   features.beacon.glowing
#     • Description: Whether to apply Glowing — everyone sees the silhouette.
#     • Values: true / false
#     • Default: true
#
#   features.beacon.blindness
#     • Description: Whether to apply Blindness.
#     • Values: true / false
#     • Default: true
#
#   features.beacon.regeneration_amplifier
#     • Description: Regeneration power (0 = I, 1 = II, ..., 4 = V).
#       4 — very strong regeneration.
#     • Values: any integer ≥ 0
#     • Default: 4
#
#   features.beacon.resistance_amplifier
#     • Description: Resistance power (0 = I, 4 = V).
#     • Values: any integer ≥ 0
#     • Default: 4
#
#   features.beacon.interval_ticks
#     • Description: Effect application interval (in ticks).
#       5 ticks = 0.25 sec. Very frequent — high load.
#     • Values: any integer ≥ 1
#     • Default: 5
#
#   ────────────────────────────────────────────────────────────────
#   4.4. features.blockdmg — BLOCK DAMAGE
#   ────────────────────────────────────────────────────────────────
#
#   features.blockdmg.enabled
#     • Description: Enables damage from dripping stalactites and end rods.
#     • Values: true / false
#     • Default: true
#
#   features.blockdmg.dripstone_damage
#     • Description: Falling stalactite damage (in hearts).
#       1 = 1 heart.
#     • Values: any integer ≥ 0
#     • Default: 1
#
#   features.blockdmg.endrod_damage
#     • Description: End rod damage (in hearts).
#     • Values: any integer ≥ 0
#     • Default: 1
#
#   features.blockdmg.interval_ticks
#     • Description: Check interval (in ticks).
#     • Values: any integer ≥ 1
#     • Default: 5
#
#   ────────────────────────────────────────────────────────────────
#   4.5. features.boostedcobweb — COBWEB
#   ────────────────────────────────────────────────────────────────
#
#   features.boostedcobweb.enabled
#     • Description: A player in a cobweb is COMPLETELY STOPPED.
#       Movement is impossible until leaving the web.
#       Disables any movement (including flying).
#     • Values: true / false
#     • Default: true
#
#   ────────────────────────────────────────────────────────────────
#   4.6. features.deathbell — DEATH BELL
#   ────────────────────────────────────────────────────────────────
#
#   features.deathbell.enabled
#     • Description: Ringing a bell strikes lightning.
#       Used as a trap or signaling system.
#     • Values: true / false
#     • Default: true
#
#   features.deathbell.lightning
#     • Description: Whether lightning strikes on ringing.
#     • Values: true / false
#     • Default: true
#
#   ────────────────────────────────────────────────────────────────
#   4.7. features.dragonegg — DRAGON EGG
#   ────────────────────────────────────────────────────────────────
#
#   features.dragonegg.enabled
#     • Description: Periodically spawns a dragon egg at the given coordinates.
#       Disabled by default — the dragon egg already exists in the world.
#     • Values: true / false
#     • Default: false
#
#   features.dragonegg.world
#     • Description: Which world to spawn the egg in. "world_the_end" — the End.
#     • Values: world name (folder in the world/ directory)
#     • Default: "world_the_end"
#
#   features.dragonegg.x / y / z
#     • Description: Egg spawn coordinates.
#     • Default: 0 / 142 / 0
#
#   features.dragonegg.interval_ticks
#     • Description: Interval between spawns (in ticks).
#       1728000 ticks = 24 hours of real time.
#       Lower — the egg spawns more often.
#     • Values: any integer ≥ 1
#     • Default: 1728000
#
#   features.dragonegg.spawn_chance
#     • Description: Chance to spawn the egg on each check.
#       1.0 = 100% (guaranteed spawn).
#       0.5 = 50%. 0.0 = never.
#     • Values: decimal from 0.0 to 1.0
#     • Default: 1.0
#
#   ────────────────────────────────────────────────────────────────
#   4.8. features.enderchest — ENDER CHEST TRAP
#   ────────────────────────────────────────────────────────────────
#
#   features.enderchest.enabled
#     • Description: Ender chests may explode when opened.
#       A PvP/adventure mechanic — opening other people's chests is risky.
#     • Values: true / false
#     • Default: true
#
#   features.enderchest.explosion_chance
