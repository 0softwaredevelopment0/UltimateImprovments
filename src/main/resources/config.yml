  # location is filled via /ui setspawn

# =========================
# 🛡 ANTICHEAT — modular cheat detection system
# =========================
# Each check can be enabled/disabled separately.
# max_vl — maximum Violation Level before the action triggers.
# vl_decay — how much VL decays every second without violations.
#
# Anticheat does NOT ban or kick — it only:
#   log     — writes to console
#   notify  — notifies admins (perm: ui.anticheat.notify)
#   setback — teleports back to the last safe position
# =========================
anticheat:
  # Whether this feature is enabled
  enabled: true

  # Players with this permission fully bypass all checks
  # Permission that bypasses this check
  bypass_permission: "ui.anticheat.bypass"

  # Cooldown between actions for one player (ms)
  # Cooldown between anti-cheat actions, in milliseconds
  action_cooldown_ms: 100

  # Global actions by VL thresholds
  actions:
    log:
      # Whether the log check is enabled
      enabled: true
    notify:
      # Violation level threshold that triggers the action
      vl_threshold: 1.0
    setback:
      # Violation level threshold that triggers the action
      vl_threshold: 1.0

  # NMS packet interceptor at the Netty level (before Bukkit events)
  # Gives more accurate data for movement, CPS and interactions
  packet:
    # Whether this feature is enabled
    enabled: true
    # Log the injection of each player
    # Whether packet injections are logged
    log_inject: false

  # ── COMBAT checks ──
  combat:
    killaura:
      # Whether the killaura check is enabled
      enabled: true
      # Maximum violation level (VL) before the killaura check flags a player
      max_vl: 10.0
      # How fast the violation level (VL) of the killaura check decays
      vl_decay: 0.5
      # Maximum angle snap (degrees) considered as an aimbot
      max_angle_snap: 90.0
      # Maximum attack angle (degrees) considered valid
      max_attack_angle: 180.0
      # Whether attacking multiple targets in one tick is checked
      check_multi_target: true

    aimbot:
      # Whether the aimbot check is enabled
      enabled: true
      # Maximum violation level (VL) before the aimbot check flags a player
