# ║   23. 📋 TAB LIST (tab)                                         ║
# ║                                                                  ║
# ╚══════════════════════════════════════════════════════════════════╝
#
#   tab.enabled
#     • Description: Custom tab list (player list shown on Tab).
#       Replaces the vanilla player list with a custom one with header/footer.
#     • Values: true / false
#     • Default: true
#
#   tab.update_interval_ticks
#     • Description: Header/footer refresh interval (in ticks).
#       20 = once per second. Lower = more often, more load.
#     • Values: any integer ≥ 5
#     • Default: 20
#
#   tab.hide_spectators
#     • Description: Whether to hide Spectator-mode players from the tab.
#       Useful for admins watching players invisibly.
#     • Values: true / false
#     • Default: true
#
#   tab.header
#     • Description: List of lines (up to ~6) for the top of the tab.
#       Each line is MiniMessage with placeholders.
#       Lines are separated by commas in YAML (as a list).
#     • Placeholders: {online}, {max_players}, {tps}, {mspt}, {uptime},
#       {ram_used}, {ram_max}, {world_name}, {player_name}, {player_ping}
#     • Format: each line is a separate list element
#
#   tab.footer
#     • Description: Bottom part of the tab. Same as header.
#
#   tab.player_list.objective_enabled
#     • Description: Enables a custom prefix/suffix in the player list.
#       Shows ping or other info next to the nick.
#     • Values: true / false
#     • Default: true
#
#   tab.player_list.format
#     • Description: Player line format in the tab list.
#       Usually empty "" — objective_prefix/suffix is used.
#       You can set a custom format with placeholders.
#       Example: "%luckperms_prefix%{player_name}"
#
#   tab.player_list.objective_prefix
#     • Description: Prefix before the player's nick in the tab.
#       Usually empty — info goes after the nick.
#
#   tab.player_list.objective_suffix
#     • Description: Suffix after the player's nick in the tab.
#       Example: " <dark_gray>[</dark_gray>{player_ping_color}{player_ping}<dark_gray>ms] </dark_gray>"
#
#   tab.sort.mode
#     • Description: Player sort mode in the tab.
#     • none:       no sorting (by join order)
#     • a_z:        alphabetical A→Z
#     • z_a:        alphabetical Z→A
#     • luckperms:  by LuckPerms group weight
#     • op:         OP on top
#     • Default: none
#
#   ⚠ Full placeholder list is in the "PLACEHOLDERS" section at the end of this guide.
#
#
