#     • Default: RED / SOLID
#
#
# ╔══════════════════════════════════════════════════════════════════╗
# ║                                                                  ║
# ║   12. 📦 PACKET GUARD                                           ║
# ║                                                                  ║
# ╚══════════════════════════════════════════════════════════════════╝
#
#   packet_guard.enabled
#     • Description: Crash-packet protection. Blocks packets exceeding the
#       maximum size. Protects against some DDoS attacks.
#     • Values: true / false
#     • Default: true
#
#   packet_guard.bypass_permission
#     • Description: Permission to bypass the protection.
#     • Default: "ui.packetguard.bypass"
#
#   packet_guard.max_packet_size
#     • Description: Maximum packet size in bytes.
#       7000000 (7 MB) — the standard protocol limit.
#       Lower = stricter. Higher = more risk.
#     • Values: any integer ≥ 1
#     • Default: 7000000
#
#   packet_guard.log
#     • Description: Log blocked packets.
#     • Values: true / false
#     • Default: true
#
#   packet_guard.log_inject
#     • Description: Log with injection info (detailed logging).
#     • Values: true / false
#     • Default: false
#
#
# ╔══════════════════════════════════════════════════════════════════╗
# ║                                                                  ║
# ║   13. 🔴 REDSTONE GUARD                                         ║
# ║                                                                  ║
# ╚══════════════════════════════════════════════════════════════════╝
#
#   redstone_guard.enabled
#     • Description: Redstone-overload protection. If a redstone tick
#       loads the server beyond mspt_threshold — the plugin blocks the chunk
#       with the most iterations FOREVER (until manual unlock),
#       then recalculates the load and repeats until it drops below.
#     • Values: true / false
#     • Default: true
#
#   redstone_guard.mspt_threshold
#     • Description: MSPT threshold above which protection kicks in.
#       50.0 — at MSPT > 50 the most loaded redstone chunks are blocked.
#     • Values: decimal ≥ 0
#     • Default: 50.0
#
#   redstone_guard.chunk_iterations_limit
#     • Description: Minimum redstone iterations per tick in a chunk for
#       it to be considered a blocking candidate.
#       10 — chunks with >10 redstone updates per tick are blocked.
#     • Values: any integer ≥ 1
#     • Default: 10
#
#   Managing blocked chunks (permission: ui.command.redstone.list):
#     /ui redstone list [page] — list (5 chunks per page, clickable
#       [<] [>] to flip pages; chunk center coordinates are clickable — they
#       run /tp @s; the «Unlock» button unlocks the chunk).
#     /ui redstone unlock <number>  — unlock a chunk by number.
#
#
# ╔══════════════════════════════════════════════════════════════════╗
# ║                                                                  ║
# ║   14. 🛡 EMERGENCY ENTITY KILL                                  ║
# ║                                                                  ║
# ╚══════════════════════════════════════════════════════════════════╝
#
#   emergency_entity_kill.enabled
#     • Description: Automatically removes excess entities when the server
#       is overloaded. Protects against lag machines spawning thousands of mobs.
#     • Values: true / false
#     • Default: true
#
#   emergency_entity_kill.entity_limit
#     • Description: Minimum entity count at which cleanup starts
#       (protects against false triggers on an empty server).
#       1000 — cleanup only runs when there are more than 1000 entities.
#     • Values: any integer ≥ 1
#     • Default: 1000
#
#   emergency_entity_kill.mspt_threshold
#     • Description: MSPT threshold to start cleanup.
#       50.0 — at MSPT > 50 the highest-load entity type is removed;
#       then the load is recalculated and the next type is removed if needed
#       — until MSPT drops below the threshold.
#     • Values: decimal ≥ 0
#     • Default: 50.0
#
#   emergency_entity_kill.kill_worlds
#     • Description: Worlds where cleanup works.
#       [] — all worlds.
#     • Values: list of strings
#     • Default: []
#
#   emergency_entity_kill.log
#     • Description: Log entity removals.
#     • Values: true / false
#     • Default: true
#
#
# ╔══════════════════════════════════════════════════════════════════╗
# ║                                                                  ║
# ║   15. ⚠ SERVER OVERLOAD WARNING                                ║
# ║                                                                  ║
# ╚══════════════════════════════════════════════════════════════════╝
#
#   server_overload_warning.enabled
#     • Description: Warns operators in chat/actionbar on high server load.
#       Helps notice problems in time.
#     • Values: true / false
#     • Default: true
#
#   server_overload_warning.high_mspt
#     • Description: HIGH MSPT threshold — yellow warning.
#       40.0 — at MSPT > 40 writes "⚠ High server load".
#     • Values: decimal ≥ 0
#     • Default: 40.0
#
#   server_overload_warning.critical_mspt
#     • Description: CRITICAL MSPT threshold — red warning.
#       50.0 — at MSPT > 50 writes "🚫 Critical server load".
#     • Values: decimal ≥ 0
#     • Default: 50.0
#
#   server_overload_warning.notify_cooldown_seconds
#     • Description: Cooldown between notifications (to avoid spam).
#       30 — no more often than once every 30 seconds.
#     • Values: any integer ≥ 0
#     • Default: 30
#
#
# ╔══════════════════════════════════════════════════════════════════╗
# ║                                                                  ║
# ║   16. 🔇 CHAT FILTER                                            ║
# ║                                                                  ║
# ╚══════════════════════════════════════════════════════════════════╝
#
#   chat_filter.enabled
#     • Description: Banned-words chat filter.
#       Off by default (false). Enable it if you want to
#       block profanity and other unwanted words.
#     • Values: true / false
#     • Default: false
#
#   chat_filter.words
#     • Description: List of banned words (with * wildcard support).
#       E.g. "*badword*" — blocks any words containing "badword".
#       "*word" — words ending with "word".
#       "word*" — words starting with "word".
#       Without asterisks — exact word match.
#     • Values: list of strings
#
#   chat_filter.regex_patterns
#     • Description: Regex patterns to block.
#       Used when simple words with * are not enough.
#       Each pattern is a Java regex.
#       Example: ".*[A-Z]{15,}.*" — caps lock of 15+ letters.
#     • WARNING: If your config.yml was created BEFORE an update,
#       the regexes may contain \p{L} — that is NORMAL, those patterns
#       are built into the plugin code and do not depend on config.yml.
#
#   Bypass permission: ui.chat.filter.bypass
#
#
# ╔══════════════════════════════════════════════════════════════════╗
# ║                                                                  ║
# ║   17. 📢 CHAT PINGS (chat_ping)                                ║
# ║                                                                  ║
# ╚══════════════════════════════════════════════════════════════════╝
#
#   chat_ping.enabled
#     • Description: Enables @mentions in chat.
#       @nick — highlights the nick and notifies the player with a sound.
#     • Values: true / false
#     • Default: true
#
#   chat_ping.ping_style
#     • Description: MiniMessage format wrapping an @mention.
#       "%s" is replaced with the mentioned player's nick.
#       Example: "<underlined><color:#FFAA00>@%s</color></underlined>"
#     • Default: "<underlined><color:#FFAA00>@%s</color></underlined>"
#
#   chat_ping.sound_name / sound_volume / sound_pitch
#     • Description: Sound, volume and pitch for the ping notification.
#     • Default: ENTITY_EXPERIENCE_ORB_PICKUP / 0.5 / 1.5
#
