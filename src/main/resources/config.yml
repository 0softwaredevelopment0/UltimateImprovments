#       1.0 — standard cost. 2.0 — twice as expensive.
#     • Values: decimal ≥ 0
#     • Default: 1.0
#
#   features.integrity.gradient
#     • Description: Integrity gradient colors in the item lore.
#     • high_color: high-integrity color ("#006600" — green)
#     • low_color: low-integrity color ("#990000" — red)
#
#   features.integrity.lore_text
#     • Description: Text before the integrity number in the item lore.
#       "§fIntegrity:" in English. Use §-codes for color.
#     • Default: "§fIntegrity:"
#
#   features.integrity.on_break
#     • Description: Behavior when an item breaks.
#     • play_sound: play the break sound (true/false)
#     • send_message: write "item broke" to chat (true/false)
#     • sound: which sound (ENTITY_ITEM_BREAK)
#     • sound_volume: volume (2.0)
#     • sound_pitch: pitch (1.0)
#
#   features.integrity.logging
#     • Description: Integrity system logging.
#     • log_init, log_break, log_errors — what to log.
#
#   features.integrity.anvil_repair
