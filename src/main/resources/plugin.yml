# Main plugin data
name: UltimateImprovments
description: UltimateImprovments
website: https://github.com/rizer001
version: ${project.version}
api-version: "26.2"
main: com.ultimateimprovments.core.Main
author: rizer001
load: STARTUP
softdepend: [PlaceholderAPI, LuckPerms, Vault]
libraries:
  - de.mkammerer:argon2-jvm:2.12

# =====================================================================
# PERMISSIONS
# Все права плагина построены на префиксе "ui.".
# - ui.*         — все права (wildcard)
# - ui.admin     — полный доступ (выдаётся OP по умолчанию)
# - ui.command.* — все права на команды /ui
# - ui.command.<name> — право на конкретную команду
# =====================================================================
permissions:
  ui:
    description: Base access to UltimateImprovments commands
    default: false
  ui.*:
    description: All UltimateImprovments permissions
    default: false
  ui.admin:
    description: Full access to all UltimateImprovments features
    default: op
    children:
      ui: true
      ui.*: true
  ui.command.*:
    description: All /ui command permissions
    default: false

  # ---- Команды: утилиты ----
  ui.command.reload:
    description: Reload plugin configuration
    default: false
  ui.command.version:
