plugins {
    id 'io.papermc.paperweight.userdev' version '2.0.0-beta.21'
    id 'com.gradleup.shadow' version '9.4.2'
}

dependencies {
    paperweight.paperDevBundle("26.2.build.+")
    implementation project(':ui-core')
}

// The bundled UI-Datapack resources live in this module's own
// src/main/resources/datapacks/ and are copied into the jar under
// datapacks/ by the regular processResources task — the path
// DatapackInstaller extracts from.
tasks {
    assemble {
        dependsOn(shadowJar)
    }
    shadowJar {
        archiveBaseName.set('UI-Datapack')
        archiveVersion.set(project.version.toString())
        configurations = [project.configurations.runtimeClasspath]
        // config.yml lives only in UI-Core (ui-core/src/main/resources)
        exclude 'config.yml'
    }
}
