plugins {
    id 'com.gradleup.shadow' version '9.4.2' apply false
}

// Root build.gradle — shared config for all subprojects
group = 'com.ultimateimprovments'
version = '1.8.3-beta.9'

subprojects {
    apply plugin: 'java-library'

    group = 'com.ultimateimprovments'
    version = rootProject.version

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(26)
        }
    }

    repositories {
        mavenCentral()
        maven { url = 'https://repo.papermc.io/repository/maven-public/' }
        maven { url = 'https://jitpack.io' }
        maven { url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
    }

    processResources {
        filteringCharset = 'UTF-8'
        filesMatching(['plugin.yml', 'paper-plugin.yml']) {
            expand(project: project)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        // Surface deprecated API usage (Bukkit legacy -> modern Paper rewrites).
        options.compilerArgs << '-Xlint:deprecation'
    }

    // Copy the module's distributable shadow jar (-all) into the root
    // build/libs, so after `./gradlew build` every plugin jar lands in one
    // directory (<root>/build/libs/UI-<Name>-<version>-all.jar).
    tasks.register('copyJarToRoot', Copy) {
        group = 'build'
        description = "Copies this module's -all (shadow) jar into the root build/libs."
        dependsOn tasks.named('shadowJar')
        from(tasks.named('shadowJar').map { it.archiveFile })
        into rootProject.layout.buildDirectory.dir('libs')
    }

    tasks.named('assemble') {
        finalizedBy 'copyJarToRoot'
    }

    pluginManager.withPlugin('com.gradleup.shadow') {
        tasks.named('shadowJar') {
            // sqlite-jdbc ships ~24 MB of native libraries for every platform
            // imaginable. Only UI-Core uses it directly (DatabaseManager loads
            // the JDBC driver, and every addon joins UI-Core's classpath via
            // paper-plugin.yml), so no other module needs to bundle it — it
            // used to leak into every addon jar transitively through
            // `implementation project(':ui-core')`.
            if (project.name != 'ui-core') {
                dependencies {
                    exclude(dependency('org.xerial:sqlite-jdbc:.*'))
                }
            }
        }
    }
}

// Shadow-only distribution build: compiles every module and collects the
// -all (shadow) jars into root build/libs, skipping tests/check/jar tasks.
tasks.register('distributeJars') {
    group = 'build'
    description = 'Builds all module shadow jars into root build/libs (no tests).'
    dependsOn subprojects.collect { ":$it.name:copyJarToRoot" }
}
